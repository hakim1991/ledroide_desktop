<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pomodoro</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f12; --surface: #18181b; --surface2: #1f1f23; --border: #27272a;
    --text: #e2e2e8; --muted: #71717a; --accent: #6366f1; --accent-h: #818cf8;
    --work: #ef4444; --short: #22c55e; --long: #3b82f6; --phase: var(--work);
    --mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
  }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 14px; font-size: 14px; }
  body.short { --phase: var(--short); } body.long { --phase: var(--long); }
  .layout { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(300px, 1fr); gap: 12px; max-width: 1100px; margin: 0 auto; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  h1 { font-size: 1.15rem; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .card-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 10px;
                display: flex; align-items: center; gap: 8px; }
  .card-title .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; display: flex; gap: 6px; align-items: center; }
  button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 11px;
           font: inherit; font-size: .82rem; cursor: pointer; transition: .12s; white-space: nowrap; }
  button:hover { border-color: #52525b; background: #26262b; }
  button.danger { color: #fca5a5; border-color: #7f1d1d; }
  input[type=text], input[type=number] { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
           padding: 8px 10px; font: inherit; font-size: .88rem; outline: none; width: 100%; }
  input:focus { border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: none; border-radius: 0; background: transparent; color: var(--muted); padding: 8px 6px; }
  .seg button.on[data-mode=work] { background: var(--work); color: #fff; }
  .seg button.on[data-mode=short] { background: var(--short); color: #fff; }
  .seg button.on[data-mode=long] { background: var(--long); color: #fff; }

  .timer-card { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 14px; position: relative; overflow: hidden; }
  .ring { position: relative; width: min(300px, 78vw); aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: #26262b; }
  .ring .prog { stroke: var(--phase); stroke-linecap: round; transition: stroke .3s; }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .time { font-family: var(--mono); font-size: clamp(2.6rem, 11vw, 4.2rem); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .phase-lbl { font-size: .85rem; color: var(--phase); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .ends { font-size: .78rem; color: var(--muted); min-height: 1em; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2f2f35; }
  .dot.done { background: var(--work); }
  .controls { display: flex; gap: 10px; align-items: center; }
  .btn-main { background: var(--phase); border: none; color: #fff; font-weight: 700; font-size: 1rem; padding: 12px 34px; border-radius: 30px; min-width: 150px; }
  .btn-main:hover { background: var(--phase); filter: brightness(1.12); }
  .btn-round { width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 1.05rem; }
  .task-row { width: 100%; max-width: 420px; }
  .flash { position: absolute; inset: 0; background: var(--phase); opacity: 0; pointer-events: none; }
  .flash.on { animation: flash 1s ease-in-out 4; }
  @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: .35; } }
  .banner { width: 100%; padding: 9px 12px; border-radius: 7px; background: #1f170d; border: 1px solid #78350f; color: #fcd34d; font-size: .84rem; display: none; text-align: center; }
  .banner.show { display: block; }

  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .settings label { font-size: .78rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .settings .chk { flex-direction: row; align-items: center; gap: 7px; color: var(--text); font-size: .84rem; cursor: pointer; }
  .settings .chk input { accent-color: var(--accent); }
  .settings input[type=range] { accent-color: var(--accent); }
  .muted { color: var(--muted); font-size: .8rem; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: #141417; border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px; }
  .kpi .v { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .72rem; color: var(--muted); }
  .goal { height: 6px; background: #26262b; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .goal > div { height: 100%; background: var(--work); }
  #chart { width: 100%; height: 190px; display: block; }
  #chart text { fill: #a1a1aa; font-size: 11px; font-family: system-ui, sans-serif; }
  #chart .bar { fill: var(--accent); } #chart .bar:hover { fill: var(--accent-h); }
  #chart .bar.today { fill: var(--work); }
  #chart .grid { stroke: #26262b; }
  .tip { position: fixed; background: #27272a; border: 1px solid #3f3f46; padding: 5px 9px; border-radius: 6px; font-size: .78rem; pointer-events: none; display: none; z-index: 9; }

  .hist { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
  .hrow { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: .84rem; }
  .hrow:hover { background: #1d1d22; }
  .hrow .c { width: 10px; height: 10px; border-radius: 50%; }
  .hrow .task { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .task small { color: var(--muted); margin-left: 6px; }
  .hrow .d { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8rem; }
  .hrow .x { opacity: 0; padding: 1px 6px; font-size: .72rem; }
  .hrow:hover .x { opacity: 1; }
  .empty { color: var(--muted); text-align: center; padding: 14px; font-size: .85rem; }
  .tasks { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
  .trow { display: grid; grid-template-columns: 1fr 70px; gap: 8px; font-size: .8rem; align-items: center; }
  .trow .b { height: 16px; background: #26262b; border-radius: 3px; position: relative; overflow: hidden; }
  .trow .b > div { position: absolute; inset: 0 auto 0 0; background: rgba(99,102,241,.45); }
  .trow .b span { position: relative; padding-left: 6px; line-height: 16px; white-space: nowrap; }
  .trow .t { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  .err { color: #fca5a5; font-size: .82rem; }
</style>
</head>
<body class="work">
<div class="layout">
  <div class="col">
    <h1>🍅 Pomodoro</h1>
    <div class="card timer-card">
      <div class="flash" id="flash"></div>
      <div class="seg" style="width:100%;max-width:420px" id="modeSeg">
        <button data-mode="work" class="on">Travail</button>
        <button data-mode="short">Pause courte</button>
        <button data-mode="long">Pause longue</button>
      </div>
      <div class="banner" id="banner"></div>
      <div class="ring">
        <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="90" fill="none" stroke-width="10"/>
          <circle class="prog" id="prog" cx="100" cy="100" r="90" fill="none" stroke-width="10" stroke-dasharray="565.487" stroke-dashoffset="0"/></svg>
        <div class="center">
          <div class="phase-lbl" id="phaseLbl">Travail</div>
          <div class="time" id="time">25:00</div>
          <div class="ends" id="ends"></div>
          <div class="dots" id="dots"></div>
        </div>
      </div>
      <div class="task-row"><input type="text" id="task" maxlength="200" placeholder="Sur quoi travaillez-vous ? (tâche de la session)"></div>
      <div class="controls">
        <button class="btn-round" id="btnReset" title="Réinitialiser (R)">↺</button>
        <button class="btn-main" id="btnStart">Démarrer</button>
        <button class="btn-round" id="btnSkip" title="Passer à la phase suivante (S)">⏭</button>
      </div>
      <div class="muted">Espace : démarrer / pause</div>
    </div>

    <div class="card">
      <div class="card-title">Réglages <span class="r"><span class="muted" id="saveState"></span></span></div>
      <div class="settings" id="settings">
        <label>Travail (min)<input type="number" id="s_work_min" min="1" max="180" step="1"></label>
        <label>Pause courte (min)<input type="number" id="s_short_min" min="1" max="60" step="1"></label>
        <label>Pause longue (min)<input type="number" id="s_long_min" min="1" max="120" step="1"></label>
        <label>Cycles avant pause longue<input type="number" id="s_cycles" min="1" max="12" step="1"></label>
        <label>Objectif quotidien (pomodoros)<input type="number" id="s_daily_goal" min="1" max="50" step="1"></label>
        <label>Volume<input type="range" id="s_volume" min="0" max="1" step="0.05"></label>
        <label class="chk"><input type="checkbox" id="s_auto_breaks"> Lancer les pauses automatiquement</label>
        <label class="chk"><input type="checkbox" id="s_auto_work"> Lancer le travail après la pause</label>
        <label class="chk"><input type="checkbox" id="s_sound"> Son de fin</label>
        <div style="display:flex;gap:6px;align-items:center"><button id="btnTestSound">🔊 Tester</button><button id="btnNotif">🔔 Notifications</button></div>
      </div>
      <div class="muted" id="notifState" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <div class="card-title">Statistiques
        <span class="r"><div class="seg" id="statSeg" style="width:auto"><button data-p="days" class="on" style="padding:4px 10px">7 jours</button><button data-p="weeks" style="padding:4px 10px">8 semaines</button></div></span>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="v" id="kToday">0</div><div class="l">pomodoros aujourd'hui</div><div class="goal"><div id="kGoal" style="width:0"></div></div></div>
        <div class="kpi"><div class="v" id="kTodayMin">0 min</div><div class="l">concentré aujourd'hui</div></div>
        <div class="kpi"><div class="v" id="kWeek">0</div><div class="l">cette semaine</div></div>
        <div class="kpi"><div class="v" id="kStreak">0 j</div><div class="l">série en cours</div></div>
      </div>
      <svg id="chart" preserveAspectRatio="none"></svg>
      <div class="tasks" id="tasks"></div>
      <div class="err" id="statErr"></div>
    </div>
    <div class="card">
      <div class="card-title">Historique <span class="r" id="histActions"></span></div>
      <div class="hist" id="hist"><div class="empty">Aucune session enregistrée.</div></div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
const PORT = parseInt(location.port) || 8765;
const BASE = `http://127.0.0.1:${PORT}/modules/pomodoro/api`;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LBL = { work: 'Travail', short: 'Pause courte', long: 'Pause longue' };
const COLORS = { work: '#ef4444', short: '#22c55e', long: '#3b82f6' };
const CIRC = 2 * Math.PI * 90;
const BASE_TITLE = document.title;

let S = { work_min: 25, short_min: 5, long_min: 15, cycles: 4, auto_breaks: false, auto_work: false, sound: true, volume: 0.6, daily_goal: 8 };
// Timer state. Time is always derived from wall-clock timestamps (endAt), never from tick counts.
let T = { mode: 'work', running: false, endAt: 0, remaining: 25 * 60 * 1000, total: 25 * 60 * 1000, startedAt: null, runMs: 0, segStart: 0, done: 0 };
let statPeriod = 'days', lastStats = null;

const ls = { get(k) { try { return JSON.parse(localStorage.getItem('pomodoro:' + k)); } catch (_) { return null; } },
             set(k, v) { try { localStorage.setItem('pomodoro:' + k, JSON.stringify(v)); } catch (_) {} } };

async function api(path, opts = {}) {
  let res;
  try { res = await fetch(BASE + path, opts); } catch (e) { throw { error: 'Backend injoignable' }; }
  const d = await res.json().catch(() => ({ error: 'Réponse invalide' }));
  if (!res.ok) throw d;
  return d;
}
const jsonOpts = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function localISO(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
const durOf = mode => Math.round(S[mode + '_min'] * 60 * 1000);
function fmtClock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); const m = Math.floor(s / 60); return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
function fmtMin(sec) { const m = Math.round(sec / 60); if (m < 60) return `${m} min`; return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`; }

// ── Timer core ───────────────────────────────────────────────────────────
function remainingNow() { return T.running ? Math.max(0, T.endAt - Date.now()) : T.remaining; }
function elapsedRunMs() { return T.runMs + (T.running ? Date.now() - T.segStart : 0); }
function saveTimer() { ls.set('timer', T); }

function setMode(mode) {
  T.mode = mode; T.running = false; T.total = durOf(mode); T.remaining = T.total; T.startedAt = null; T.runMs = 0;
  document.body.className = mode;
  saveTimer(); render(); stopTicker();
}
function start() {
  if (T.running) return;
  ensureAudio();
  const now = Date.now();
  if (!T.startedAt) T.startedAt = now;
  T.running = true; T.segStart = now; T.endAt = now + T.remaining;
  saveTimer(); startTicker(); render();
}
function pause() {
  if (!T.running) return;
  const now = Date.now();
  T.remaining = Math.max(0, T.endAt - now); T.runMs += now - T.segStart; T.running = false;
  saveTimer(); stopTicker(); render();
}
function nextMode(completedWork) {
  if (T.mode === 'work') {
    if (completedWork) T.done++;
    return completedWork && T.done % S.cycles === 0 ? 'long' : 'short';
  }
  return 'work';
}
async function record(completed) {
  const dur = Math.round(Math.min(elapsedRunMs(), T.total) / 1000);
  if (!completed && dur < 60) return; // ignore very short aborted sessions
  const body = { type: T.mode, task: $('task').value.trim(), started_at: localISO(T.startedAt || Date.now() - dur * 1000),
                 ended_at: localISO(completed && T.endAt ? Math.min(T.endAt, Date.now()) : Date.now()), planned_sec: Math.round(T.total / 1000), duration_sec: completed ? Math.round(T.total / 1000) : dur, completed };
  try { await api('/sessions', jsonOpts('POST', body)); } catch (e) { queueOffline(body); }
  refreshData();
}
function queueOffline(body) { const q = ls.get('queue') || []; q.push(body); ls.set('queue', q); }
async function flushQueue() {
  const q = ls.get('queue') || []; if (!q.length) return;
  const rest = [];
  for (const b of q) { try { await api('/sessions', jsonOpts('POST', b)); } catch (_) { rest.push(b); } }
  ls.set('queue', rest);
}

async function complete() {
  const finished = T.mode;
  T.remaining = 0; T.running = false; stopTicker();
  await record(true);
  const nm = nextMode(true);
  alertUser(finished, nm);
  setMode(nm);
  if ((nm === 'work' && S.auto_work) || (nm !== 'work' && S.auto_breaks)) start();
}
async function skip() {
  if (T.startedAt) await record(false);
  const nm = nextMode(false);
  setMode(nm);
}
function reset() { setMode(T.mode); }

// ticker: a Worker is not throttled in background tabs like setInterval is; fallback to setInterval.
let worker = null, interval = null;
function startTicker() {
  stopTicker();
  try {
    if (!worker) {
      const src = 'let h=null;onmessage=e=>{clearInterval(h);if(e.data==="start")h=setInterval(()=>postMessage(0),250)}';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));
      worker.onmessage = tick;
    }
    worker.postMessage('start');
  } catch (_) { worker = null; interval = setInterval(tick, 250); }
}
function stopTicker() { if (worker) worker.postMessage('stop'); if (interval) { clearInterval(interval); interval = null; } }
let completing = false;
async function tick() {
  if (!T.running) return;
  if (remainingNow() <= 0 && !completing) { completing = true; try { await complete(); } finally { completing = false; } return; }
  render();
}
document.addEventListener('visibilitychange', tick);
window.addEventListener('focus', tick);

// ── Rendering ────────────────────────────────────────────────────────────
function render() {
  const rem = remainingNow();
  $('time').textContent = fmtClock(rem);
  $('phaseLbl').textContent = LBL[T.mode];
  $('prog').style.strokeDashoffset = String(CIRC * (1 - (T.total ? rem / T.total : 0)));
  $('btnStart').textContent = T.running ? 'Pause' : (T.startedAt ? 'Reprendre' : 'Démarrer');
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === T.mode));
  $('ends').textContent = T.running ? 'Fin à ' + new Date(T.endAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : (T.startedAt ? 'En pause' : '');
  const inCycle = T.done % S.cycles;
  $('dots').innerHTML = Array.from({ length: S.cycles }, (_, i) => `<span class="dot ${i < inCycle || (inCycle === 0 && T.done > 0 && T.mode === 'long') ? 'done' : ''}"></span>`).join('');
  document.title = T.running || T.startedAt ? `${fmtClock(rem)} · ${LBL[T.mode]}` : BASE_TITLE;
}

// ── Alerts: sound, notification, visual flash ───────────────────────────
let audioCtx = null;
function ensureAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {}
}
function beep() {
  if (!S.sound || !audioCtx) return;
  const t0 = audioCtx.currentTime + 0.05;
  [0, 0.35, 0.7].forEach((off, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1046.5 : 880;
    g.gain.setValueAtTime(0.0001, t0 + off);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, S.volume), t0 + off + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.28);
    o.connect(g).connect(audioCtx.destination); o.start(t0 + off); o.stop(t0 + off + 0.3);
  });
}
function notifAvailable() { return 'Notification' in window; }
function alertUser(finished, next) {
  beep();
  const title = finished === 'work' ? '🍅 Session terminée !' : '⏰ Pause terminée';
  const body = finished === 'work' ? `Bravo${$('task').value ? ' — « ' + $('task').value + ' »' : ''}. Place à : ${LBL[next].toLowerCase()}.` : 'On reprend le travail !';
  let notified = false;
  try { if (notifAvailable() && Notification.permission === 'granted') { new Notification(title, { body, tag: 'pomodoro' }); notified = true; } } catch (_) {}
  // visual fallback (always flash; banner when no system notification)
  const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  if (!notified || document.hidden) {
    $('banner').textContent = title + ' ' + body; $('banner').classList.add('show');
    clearTimeout(alertUser._h); alertUser._h = setTimeout(() => $('banner').classList.remove('show'), 15000);
    let n = 0; clearInterval(alertUser._t);
    alertUser._t = setInterval(() => { document.title = (n++ % 2) ? title : BASE_TITLE; if (n > 12 || (!document.hidden && n > 6)) { clearInterval(alertUser._t); render(); } }, 800);
  }
}
function renderNotifState() {
  const el = $('notifState');
  if (!notifAvailable()) { el.textContent = 'Notifications système indisponibles : un flash visuel sera utilisé.'; $('btnNotif').disabled = true; return; }
  const p = Notification.permission;
  el.textContent = p === 'granted' ? 'Notifications système activées.' : p === 'denied' ? 'Notifications refusées : un flash visuel sera utilisé.' : 'Cliquez sur « Notifications » pour les autoriser (sinon : flash visuel).';
  $('btnNotif').disabled = p !== 'default';
}
$('btnNotif').onclick = async () => {
  try { await Notification.requestPermission(); } catch (_) {}
  renderNotifState();
};
$('btnTestSound').onclick = () => { ensureAudio(); const s = S.sound; S.sound = true; beep(); S.sound = s; };

// ── Settings ─────────────────────────────────────────────────────────────
const NUM = ['work_min', 'short_min', 'long_min', 'cycles', 'daily_goal'];
const BOOL = ['auto_breaks', 'auto_work', 'sound'];
function fillSettings() {
  NUM.forEach(k => $('s_' + k).value = S[k]);
  BOOL.forEach(k => $('s_' + k).checked = !!S[k]);
  $('s_volume').value = S.volume;
}
let saveTimerH;
function onSettingChange() {
  const n = { ...S };
  for (const k of NUM) { const v = parseFloat($('s_' + k).value); if (!isFinite(v) || v < +$('s_' + k).min || v > +$('s_' + k).max) { $('s_' + k).style.borderColor = '#ef4444'; return; } $('s_' + k).style.borderColor = ''; n[k] = k === 'cycles' || k === 'daily_goal' ? Math.round(v) : v; }
  BOOL.forEach(k => n[k] = $('s_' + k).checked);
  n.volume = parseFloat($('s_volume').value);
  const durChanged = n[T.mode + '_min'] !== S[T.mode + '_min'];
  S = n; ls.set('settings', S);
  if (durChanged && !T.startedAt) { T.total = durOf(T.mode); T.remaining = T.total; saveTimer(); }
  render(); if (lastStats) renderStats(lastStats);
  $('saveState').textContent = 'Enregistrement…';
  clearTimeout(saveTimerH);
  saveTimerH = setTimeout(async () => {
    try { await api('/settings', jsonOpts('PUT', S)); $('saveState').textContent = '✔ Enregistré'; }
    catch (e) { $('saveState').textContent = '✖ ' + (e.error || (e.detail ? 'Valeur invalide' : 'Erreur')); }
  }, 500);
}
document.querySelectorAll('#settings input').forEach(i => i.addEventListener('input', onSettingChange));

// ── Controls ─────────────────────────────────────────────────────────────
$('btnStart').onclick = () => T.running ? pause() : start();
$('btnSkip').onclick = skip;
$('btnReset').onclick = reset;
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = async () => {
  if (b.dataset.mode === T.mode) return;
  if (T.startedAt) await record(false);
  setMode(b.dataset.mode);
});
$('task').addEventListener('input', () => ls.set('task', $('task').value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); $('btnStart').click(); }
  else if (e.key === 's' || e.key === 'S') skip();
  else if (e.key === 'r' || e.key === 'R') reset();
});

// ── Stats & history ──────────────────────────────────────────────────────
function todayStr() { return localISO(Date.now()).slice(0, 10); }
async function refreshData() {
  await flushQueue();
  try {
    const [st, hi] = await Promise.all([api(`/stats?days=7&weeks=8&today=${todayStr()}`), api('/sessions?limit=60')]);
    $('statErr').textContent = '';
    lastStats = st; renderStats(st); renderHistory(hi.sessions);
  } catch (e) { $('statErr').textContent = '✖ ' + (e.error || 'Erreur de chargement'); }
}
function renderStats(st) {
  $('kToday').textContent = st.today.work_count;
  $('kGoal').style.width = Math.min(100, st.today.work_count / S.daily_goal * 100) + '%';
  $('kToday').parentElement.title = `Objectif : ${S.daily_goal}`;
  $('kTodayMin').textContent = fmtMin(st.today.work_sec);
  $('kWeek').textContent = st.this_week.work_count;
  $('kStreak').textContent = st.streak + ' j';
  const data = statPeriod === 'days'
    ? st.daily.map((d, i) => ({ lbl: new Date(d.day + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', ''), sub: d.day.slice(8) + '/' + d.day.slice(5, 7), v: d.work_sec, n: d.work_count, today: i === st.daily.length - 1, full: new Date(d.day + 'T12:00').toLocaleDateString('fr-FR', { dateStyle: 'full' }) }))
    : st.weekly.map((w, i) => ({ lbl: 'S' + w.week.split('-S')[1], sub: w.week_start.slice(8) + '/' + w.week_start.slice(5, 7), v: w.work_sec, n: w.work_count, today: i === st.weekly.length - 1, full: `Semaine du ${new Date(w.week_start + 'T12:00').toLocaleDateString('fr-FR', { dateStyle: 'long' })}` }));
  drawChart(data);
  const top = st.top_tasks, max = Math.max(1, ...top.map(t => t.work_sec));
  $('tasks').innerHTML = top.length ? '<div class="muted" style="margin-bottom:2px">Tâches (7 derniers jours)</div>' + top.map(t =>
    `<div class="trow"><div class="b"><div style="width:${t.work_sec / max * 100}%"></div><span>${esc(t.task)}</span></div><div class="t">${fmtMin(t.work_sec)}</div></div>`).join('') : '';
}
function drawChart(data) {
  const svg = $('chart');
  const W = svg.clientWidth || 400, H = 190, padL = 34, padB = 34, padT = 10;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const maxMin = Math.max(30, ...data.map(d => d.v / 60));
  const step = maxMin <= 60 ? 15 : maxMin <= 180 ? 30 : maxMin <= 480 ? 60 : 120;
  const top = Math.ceil(maxMin / step) * step;
  const y = m => padT + (H - padT - padB) * (1 - m / top);
  let g = '';
  for (let m = 0; m <= top; m += step) g += `<line class="grid" x1="${padL}" x2="${W}" y1="${y(m)}" y2="${y(m)}"/><text x="${padL - 6}" y="${y(m) + 4}" text-anchor="end">${m >= 60 && m % 60 === 0 ? m / 60 + 'h' : m}</text>`;
  const bw = (W - padL) / data.length;
  data.forEach((d, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64, m = d.v / 60, yy = y(m);
    g += `<rect class="bar ${d.today ? 'today' : ''}" x="${x}" y="${yy}" width="${w}" height="${Math.max(0, H - padB - yy)}" rx="3" data-i="${i}"/>`;
    g += `<text x="${x + w / 2}" y="${H - padB + 14}" text-anchor="middle">${esc(d.lbl)}</text><text x="${x + w / 2}" y="${H - padB + 27}" text-anchor="middle" style="fill:#52525b;font-size:10px">${esc(d.sub)}</text>`;
  });
  svg.innerHTML = g;
  svg.onmousemove = e => {
    const r = e.target.closest('rect'); const tip = $('tip');
    if (!r) { tip.style.display = 'none'; return; }
    const d = data[+r.dataset.i];
    tip.innerHTML = `<b>${esc(d.full)}</b><br>${d.n} pomodoro${d.n > 1 ? 's' : ''} · ${fmtMin(d.v)}`;
    tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 12, innerWidth - 200) + 'px'; tip.style.top = (e.clientY - 40) + 'px';
  };
  svg.onmouseleave = () => { $('tip').style.display = 'none'; };
}
document.querySelectorAll('#statSeg button').forEach(b => b.onclick = () => {
  statPeriod = b.dataset.p; document.querySelectorAll('#statSeg button').forEach(x => x.classList.toggle('on', x === b));
  if (lastStats) renderStats(lastStats);
});
new ResizeObserver(() => { if (lastStats) renderStats(lastStats); }).observe($('chart'));

function renderHistory(list) {
  const h = $('hist');
  if (!list.length) { h.innerHTML = '<div class="empty">Aucune session enregistrée.</div>'; renderHistActions(false); return; }
  let lastDay = null, out = '';
  for (const s of list) {
    if (s.day !== lastDay) {
      lastDay = s.day;
      const lbl = s.day === todayStr() ? 'Aujourd\'hui' : new Date(s.day + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      out += `<div class="muted" style="margin:6px 8px 2px;text-transform:capitalize">${esc(lbl)}</div>`;
    }
    out += `<div class="hrow"><span class="c" style="background:${COLORS[s.type]}"></span>
      <span class="task">${s.task ? esc(s.task) : '<span class="muted">' + LBL[s.type] + '</span>'}${s.task ? '<small>' + LBL[s.type] + '</small>' : ''}${s.completed ? '' : '<small>(interrompue)</small>'}</span>
      <span class="d">${s.started_at.slice(11, 16)} · ${fmtMin(s.duration_sec)}</span>
      <button class="x" data-del="${s.id}" title="Supprimer">✕</button></div>`;
  }
  h.innerHTML = out; renderHistActions(true);
}
function renderHistActions(any, confirming) {
  const a = $('histActions');
  if (!any) { a.innerHTML = ''; return; }
  if (confirming) {
    a.innerHTML = '<span style="color:#fca5a5;font-size:.8rem">Tout effacer ?</span><button class="danger" id="clrYes">Oui, effacer</button><button id="clrNo">Annuler</button>';
    $('clrYes').onclick = async () => { try { await api('/sessions?confirm=true', { method: 'DELETE' }); } catch (_) {} refreshData(); };
    $('clrNo').onclick = () => renderHistActions(true);
    return;
  }
  a.innerHTML = '<button class="danger" id="clrAll">Effacer l\'historique</button>';
  $('clrAll').onclick = () => renderHistActions(true, true);
}
$('hist').addEventListener('click', async e => {
  const b = e.target.closest('button[data-del]'); if (!b) return;
  if (b.dataset.armed) { try { await api('/sessions/' + b.dataset.del, { method: 'DELETE' }); } catch (_) {} refreshData(); }
  else { b.dataset.armed = '1'; b.textContent = 'Supprimer ?'; b.style.opacity = 1; b.classList.add('danger'); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '✕'; b.style.opacity = ''; b.classList.remove('danger'); } }, 3000); }
});

// ── Init ─────────────────────────────────────────────────────────────────
async function init() {
  const cached = ls.get('settings'); if (cached) S = { ...S, ...cached };
  try { S = { ...S, ...(await api('/settings')) }; ls.set('settings', S); } catch (_) {}
  fillSettings();
  $('task').value = ls.get('task') || '';
  const saved = ls.get('timer');
  if (saved && saved.mode) {
    T = { ...T, ...saved };
    if (!T.startedAt) { T.total = durOf(T.mode); T.remaining = T.total; }
  } else { T.total = durOf('work'); T.remaining = T.total; }
  document.body.className = T.mode;
  renderNotifState();
  render();
  if (T.running) { startTicker(); tick(); }
  refreshData();
  // refresh stats at midnight / periodically
  setInterval(() => { if (!T.running) refreshData(); }, 5 * 60 * 1000);
}
init();
</script>
</body>
