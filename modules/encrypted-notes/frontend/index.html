<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes chiffrées</title>
<script src="/ledroide-bridge.js"></script>
<style>
  :root {
    --bg: #0f0f12; --surface: #18181b; --surface2: #1f1f23; --border: #27272a;
    --text: #e2e2e8; --muted: #71717a; --accent: #6366f1; --accent-h: #818cf8;
    --ok: #22c55e; --err: #ef4444; --warn: #f59e0b; --info: #38bdf8;
    --mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
         font-size: 13px; overflow: hidden; }
  button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
           padding: 5px 10px; font: inherit; cursor: pointer; transition: .12s; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: #3f3f46; background: #26262b; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { color: var(--text); background: var(--surface2); }
  button.icon { padding: 3px 7px; }
  button.danger:hover:not(:disabled) { color: #fca5a5; border-color: rgba(239,68,68,.5); }
  button.link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12px; }
  button.link:hover:not(:disabled) { color: var(--text); background: none; }
  input, select, textarea { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 9px; font: inherit; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3);
             border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .screen { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
         padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 12px; }
  .box h1 { font-size: 19px; display: flex; gap: 10px; align-items: center; }
  .box .lead { color: #a1a1aa; line-height: 1.5; }
  .box label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
  .pw { display: flex; gap: 6px; }
  .pw input { flex: 1; min-width: 0; font-size: 14px; }
  .warn-box { background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.35); color: #fcd34d; border-radius: 8px;
              padding: 10px 12px; line-height: 1.5; font-size: 12.5px; }
  .err-line { color: #fca5a5; min-height: 18px; font-size: 12.5px; }
  .meter { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .meter div { height: 100%; width: 0; transition: width .2s, background .2s; }
  .meter-lbl { font-size: 11.5px; display: flex; justify-content: space-between; color: var(--muted); }
  .big-icon { font-size: 42px; text-align: center; }

  #app { height: 100%; display: flex; }
  #side { width: 290px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
          display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
  .side-head .row { display: flex; gap: 6px; }
  .side-head input { flex: 1; min-width: 0; }
  #list { flex: 1; overflow-y: auto; padding: 6px; }
  .item { padding: 8px 9px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: var(--surface2); }
  .item.current { background: rgba(99,102,241,.14); border-color: rgba(99,102,241,.35); }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .d { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .side-foot { padding: 8px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .side-foot .row { display: flex; gap: 6px; }
  .side-foot .row button { flex: 1; }
  .lock-info { color: var(--muted); font-size: 11.5px; text-align: center; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 10px 12px; gap: 8px; }
  .editor-head { display: flex; gap: 8px; align-items: center; }
  #title { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; background: transparent; border-color: transparent; }
  #title:hover { border-color: var(--border); }
  #title:focus { border-color: var(--accent); background: var(--surface2); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button.active { background: var(--surface2); color: var(--text); }
  #save-state { color: var(--muted); font-size: 11.5px; min-width: 120px; text-align: right; }
  #save-state.dirty { color: var(--warn); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; flex: 1; min-height: 0; display: flex; }
  #content { flex: 1; border: none; border-radius: 8px; resize: none; padding: 14px 16px; font-family: var(--mono);
             font-size: 13px; line-height: 1.6; background: transparent; tab-size: 4; }
  #preview { flex: 1; overflow: auto; padding: 16px 20px; line-height: 1.65; font-size: 13.5px; }
  #preview h1, #preview h2, #preview h3 { margin: 14px 0 6px; } #preview h1 { font-size: 21px; } #preview h2 { font-size: 17px; } #preview h3 { font-size: 15px; }
  #preview p { margin: 6px 0; } #preview ul, #preview ol { margin: 6px 0 6px 22px; }
  #preview code { font-family: var(--mono); background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  #preview pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto; margin: 8px 0; }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: #a1a1aa; margin: 6px 0; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  #preview a { color: var(--accent-h); }
  .placeholder { color: var(--muted); flex: 1; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 8px; text-align: center; padding: 20px; line-height: 1.5; }
  .placeholder .big { font-size: 36px; }
  .foot-meta { color: var(--muted); font-size: 11.5px; display: flex; gap: 12px; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: min(440px, 94vw);
           display: flex; flex-direction: column; }
  .modal-head { padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; }
  .modal-head span { flex: 1; }
  .modal-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .modal-body label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
  .modal-foot { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--surface2);
           border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; z-index: 60; opacity: 0;
           transition: opacity .2s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: 1; }
  #toast.bad { border-color: var(--err); color: #fca5a5; }
  kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--muted); }
</style>
</head>
<body>

<div class="screen" id="loading"><span class="spinner"></span></div>

<div class="screen hidden" id="setup">
  <form class="box" id="setup-form" autocomplete="off">
    <h1>🔒 Créer votre coffre</h1>
    <p class="lead">Choisissez un mot de passe maître. Il chiffre toutes vos notes (AES-256-GCM, clé dérivée par scrypt) et n'est jamais enregistré.</p>
    <div class="warn-box">⚠ <b>Mot de passe perdu = notes perdues.</b> Aucune récupération n'est possible : notez-le dans un endroit sûr.</div>
    <label>Mot de passe maître
      <span class="pw"><input type="password" id="s-pw" autocomplete="new-password" /><button type="button" class="icon" data-eye="s-pw" title="Afficher / masquer">👁</button></span>
    </label>
    <div><div class="meter"><div id="s-meter"></div></div><div class="meter-lbl"><span id="s-strength">—</span><span id="s-hint"></span></div></div>
    <label>Confirmation
      <span class="pw"><input type="password" id="s-pw2" autocomplete="new-password" /></span>
    </label>
    <div class="err-line" id="s-err"></div>
    <button class="primary" type="submit" id="s-btn">Créer le coffre</button>
  </form>
</div>

<div class="screen hidden" id="lock">
  <form class="box" id="lock-form" autocomplete="off">
    <div class="big-icon">🔒</div>
    <h1 style="justify-content:center">Coffre verrouillé</h1>
    <p class="lead" id="lock-reason" style="text-align:center"></p>
    <label>Mot de passe maître
      <span class="pw"><input type="password" id="l-pw" autocomplete="current-password" /><button type="button" class="icon" data-eye="l-pw" title="Afficher / masquer">👁</button></span>
    </label>
    <div class="err-line" id="l-err"></div>
    <button class="primary" type="submit" id="l-btn">Déverrouiller</button>
    <div style="text-align:center"><button type="button" class="link" id="btn-reset">Mot de passe oublié ?</button></div>
  </form>
</div>

<div class="hidden" id="app">
  <aside id="side">
    <div class="side-head">
      <div class="row"><input id="q" type="search" placeholder="Rechercher dans les titres… (Ctrl+F)" /></div>
      <button class="primary" id="btn-new" title="Nouvelle note (Ctrl+N)">＋ Nouvelle note</button>
    </div>
    <div id="list"></div>
    <div class="side-foot">
      <div class="row">
        <button id="btn-lock" title="Verrouiller (Ctrl+L)">🔒 Verrouiller</button>
        <button id="btn-pw" title="Changer le mot de passe maître">🔑 Mot de passe</button>
      </div>
      <div class="lock-info" id="lock-info"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
const MODULE_ID = 'encrypted-notes'
const call = (action, payload = {}, opts) => window.ledroide.call(MODULE_ID, action, payload, opts)
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const KDF_TIMEOUT = 60000

const state = { status: null, items: [], total: 0, current: null, dirty: false, saving: false, mode: 'edit', q: '' }

let toastTimer
function toast(msg, bad = false) {
  const t = $('#toast')
  t.textContent = msg
  t.className = 'show' + (bad ? ' bad' : '')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => (t.className = ''), bad ? 4500 : 2000)
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) } catch { return '' }
}
function show(id) {
  for (const s of ['loading', 'setup', 'lock', 'app']) $('#' + s).classList.toggle('hidden', s !== id)
}
document.addEventListener('click', (e) => {
  const eye = e.target.closest('[data-eye]')
  if (eye) { const i = document.getElementById(eye.dataset.eye); i.type = i.type === 'password' ? 'text' : 'password' }
})

// ── Password strength ───────────────────────────────────────────────────────
const COMMON = ['password', 'motdepasse', 'azerty', 'qwerty', '123456', 'admin', 'letmein', 'welcome', 'bonjour', 'soleil', 'iloveyou', 'dragon', 'monkey', 'football']
function strength(pw) {
  if (!pw) return { score: 0, label: '—', hint: '' }
  let pool = 0
  if (/[a-z]/.test(pw)) pool += 26
  if (/[A-Z]/.test(pw)) pool += 26
  if (/\d/.test(pw)) pool += 10
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 33
  let bits = pw.length * Math.log2(Math.max(pool, 1))
  const lower = pw.toLowerCase()
  if (COMMON.some((w) => lower.includes(w))) bits -= 25
  if (/(.)\1{2,}/.test(pw)) bits -= 10
  if (/(?:0123|1234|2345|3456|4567|5678|6789|abcd|bcde|cdef|azer|qwer)/i.test(pw)) bits -= 10
  if (new Set(pw).size < pw.length / 2) bits -= 10
  const levels = [[35, 'Très faible', 'var(--err)'], [55, 'Faible', '#f97316'], [75, 'Moyen', 'var(--warn)'], [100, 'Fort', '#84cc16'], [Infinity, 'Très fort', 'var(--ok)']]
  const i = levels.findIndex(([max]) => bits < max)
  let hint = ''
  if (pw.length < 12) hint = '12 caractères ou plus recommandés'
  else if (pool < 60) hint = 'Mélangez lettres, chiffres et symboles'
  return { score: i, label: levels[i][1], color: levels[i][2], bits: Math.max(0, Math.round(bits)), hint }
}
function renderMeter(pw, meter, label, hintEl) {
  const s = strength(pw)
  meter.style.width = pw ? `${(s.score + 1) * 20}%` : '0'
  meter.style.background = s.color || 'transparent'
  label.textContent = pw ? `${s.label} (~${s.bits} bits)` : '—'
  label.style.color = s.color || ''
  if (hintEl) hintEl.textContent = s.hint
  return s
}

// ── Status / screens ───────────────────────────────────────────────────────
async function refreshStatus(reason) {
  let st
  try { st = await call('status') } catch (e) {
    show('lock'); $('#l-err').textContent = e.message; return
  }
  state.status = st
  if (!st.dependency_ok) {
    show('lock')
    $('#lock-reason').textContent = ''
    $('#l-err').textContent = 'La bibliothèque « cryptography » est absente : réactivez le module ou installez-la depuis le menu Bibliothèques.'
    $('#l-btn').disabled = true
    return
  }
  if (!st.initialized) { show('setup'); setTimeout(() => $('#s-pw').focus(), 0); return }
  if (!st.unlocked) { showLock(reason); return }
  enterApp()
}

function showLock(reason) {
  clearSensitive()
  show('lock')
  $('#l-pw').value = ''
  $('#l-err').textContent = ''
  $('#l-btn').disabled = false
  $('#lock-reason').textContent = reason === 'auto' ? 'Verrouillé automatiquement après inactivité.' : reason === 'shutdown' ? 'Le module a été arrêté.' : 'Saisissez votre mot de passe maître pour accéder à vos notes.'
  setTimeout(() => $('#l-pw').focus(), 0)
}

function clearSensitive() {
  state.items = []; state.current = null; state.dirty = false
  $('#list').innerHTML = ''
  $('#main').innerHTML = ''
  $('#q').value = ''; state.q = ''
}

$('#s-pw').addEventListener('input', () => renderMeter($('#s-pw').value, $('#s-meter'), $('#s-strength'), $('#s-hint')))
$('#setup-form').onsubmit = async (e) => {
  e.preventDefault()
  const pw = $('#s-pw').value, pw2 = $('#s-pw2').value
  const min = (state.status && state.status.min_password) || 8
  $('#s-err').textContent = ''
  if (pw.length < min) { $('#s-err').textContent = `Au moins ${min} caractères.`; return }
  if (pw !== pw2) { $('#s-err').textContent = 'Les deux mots de passe ne correspondent pas.'; return }
  if (strength(pw).score < 2 && !confirm('Ce mot de passe est faible. Le conserver quand même ?')) return
  $('#s-btn').disabled = true
  $('#s-btn').innerHTML = '<span class="spinner"></span> Dérivation de la clé…'
  try {
    await call('setup', { password: pw, confirm: pw2 }, { timeout: KDF_TIMEOUT })
    $('#s-pw').value = $('#s-pw2').value = ''
    toast('Coffre créé et déverrouillé')
    await refreshStatus()
  } catch (err) { $('#s-err').textContent = err.message } finally {
    $('#s-btn').disabled = false; $('#s-btn').textContent = 'Créer le coffre'
  }
}

$('#lock-form').onsubmit = async (e) => {
  e.preventDefault()
  const pw = $('#l-pw').value
  if (!pw) { $('#l-pw').focus(); return }
  $('#l-btn').disabled = true
  $('#l-btn').innerHTML = '<span class="spinner"></span> Vérification…'
  $('#l-err').textContent = ''
  try {
    await call('unlock', { password: pw }, { timeout: KDF_TIMEOUT })
    $('#l-pw').value = ''
    await refreshStatus()
  } catch (err) {
    $('#l-err').textContent = err.message
    $('#l-pw').select()
  } finally { $('#l-btn').disabled = false; $('#l-btn').textContent = 'Déverrouiller' }
}

$('#btn-reset').onclick = async () => {
  if (!confirm('Sans le mot de passe maître, vos notes ne peuvent PAS être récupérées.\n\nVoulez-vous supprimer définitivement le coffre et toutes ses notes pour en créer un nouveau ?')) return
  const word = prompt('Pour confirmer la suppression définitive de toutes les notes, tapez SUPPRIMER :')
  if (word !== 'SUPPRIMER') { if (word !== null) toast('Confirmation incorrecte : rien n\'a été supprimé', true); return }
  try { await call('reset_vault', { confirm: 'SUPPRIMER' }, { timeout: 30000 }); toast('Coffre supprimé'); await refreshStatus() } catch (e) { toast(e.message, true) }
}

window.ledroide.on(MODULE_ID, 'locked', (d) => { showLock(d && d.reason) })

// ── App ────────────────────────────────────────────────────────────────────
async function enterApp() {
  show('app')
  const m = state.status.auto_lock_minutes
  $('#lock-info').textContent = m ? `Verrouillage automatique après ${m} min d'inactivité` : 'Verrouillage automatique désactivé'
  await loadList()
  if (!state.current) renderEmpty()
}

async function loadList() {
  try {
    const r = await call('list', { q: state.q })
    state.items = r.items; state.total = r.total
  } catch (e) { if (e.code === 'LOCKED') return showLock(); toast(e.message, true) }
  renderList()
}

function renderList() {
  const el = $('#list')
  if (!state.items.length) {
    el.innerHTML = `<div class="placeholder" style="height:100%">${state.total ? 'Aucun titre ne correspond.' : 'Aucune note.'}</div>`
    return
  }
  el.innerHTML = state.items.map((n) => `
    <div class="item ${state.current && state.current.id === n.id ? 'current' : ''}" data-id="${n.id}">
      <div class="t">${esc(n.title)}</div>
      <div class="d">${fmtDate(n.updated)}</div>
    </div>`).join('')
}

function renderEmpty() {
  $('#main').innerHTML = `<div class="placeholder"><div class="big">📝</div><b>${state.total ? 'Sélectionnez une note' : 'Aucune note pour l\'instant'}</b>
    Vos notes sont chiffrées sur le disque ; elles ne sont déchiffrées qu'en mémoire, coffre ouvert.
    <div><button class="primary" id="empty-new">＋ Nouvelle note</button></div></div>`
  $('#empty-new').onclick = newNote
}

function renderEditor() {
  const n = state.current
  $('#main').innerHTML = `
    <div class="editor-head">
      <input id="title" maxlength="300" placeholder="Titre" value="${esc(n.title)}" />
      <div class="seg"><button data-mode="edit" class="${state.mode === 'edit' ? 'active' : ''}" title="Édition (Ctrl+E)">Édition</button><button data-mode="preview" class="${state.mode === 'preview' ? 'active' : ''}" title="Aperçu (Ctrl+E)">Aperçu</button></div>
      <span id="save-state"></span>
      <button class="ghost icon danger" id="btn-del" title="Supprimer la note">🗑</button>
    </div>
    <div class="card">
      <textarea id="content" class="${state.mode === 'edit' ? '' : 'hidden'}" spellcheck="false" placeholder="Écrivez ici… (Markdown simple : # titre, **gras**, *italique*, \`code\`, - liste, > citation)"></textarea>
      <div id="preview" class="${state.mode === 'preview' ? '' : 'hidden'}"></div>
    </div>
    <div class="foot-meta"><span>${n.id ? 'Créée ' + fmtDate(n.created) + ' · modifiée ' + fmtDate(n.updated) : 'Nouvelle note (non enregistrée)'}</span><span style="flex:1"></span><span id="chars"></span><span><kbd>Ctrl+S</kbd> enregistrer · enregistrement automatique</span></div>`
  $('#content').value = n.content
  if (state.mode === 'preview') $('#preview').innerHTML = md(n.content)
  updateSaveState()
  $('#title').addEventListener('input', onEdit)
  $('#content').addEventListener('input', onEdit)
  $('#content').addEventListener('keydown', (e) => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); e.target.setRangeText('    ', e.target.selectionStart, e.target.selectionEnd, 'end'); onEdit() }
  })
  $('#main').querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)))
  $('#btn-del').onclick = deleteNote
}

function setMode(mode) {
  if (!state.current) return
  state.current.content = $('#content').value
  state.mode = mode
  $('#content').classList.toggle('hidden', mode !== 'edit')
  $('#preview').classList.toggle('hidden', mode !== 'preview')
  $('#main').querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode))
  if (mode === 'preview') $('#preview').innerHTML = md(state.current.content)
  else $('#content').focus()
}

function updateSaveState() {
  const el = $('#save-state')
  if (!el) return
  el.className = state.dirty ? 'dirty' : ''
  el.innerHTML = state.saving ? '<span class="spinner"></span> Chiffrement…' : state.dirty ? '● Modifications non enregistrées' : (state.current && state.current.id ? '✓ Enregistrée' : '')
  const c = $('#content')
  if (c) $('#chars').textContent = `${c.value.length.toLocaleString('fr-FR')} caractère(s)`
}

let saveTimer
function onEdit() {
  state.dirty = true
  updateSaveState()
  clearTimeout(saveTimer)
  saveTimer = setTimeout(save, 1200)
}

async function save() {
  clearTimeout(saveTimer)
  const n = state.current
  if (!n || !state.dirty || state.saving) return
  const title = $('#title').value, content = $('#content').value
  state.saving = true; updateSaveState()
  try {
    const r = await call('save', { id: n.id, title, content }, { timeout: 30000 })
    if (state.current === n) {
      Object.assign(n, { id: r.id, title: r.title, content, created: r.created, updated: r.updated })
      state.dirty = $('#title').value !== title || $('#content').value !== content
    }
    await loadList()
  } catch (e) {
    if (e.code === 'LOCKED') { showLock(); return }
    toast(e.message, true)
  } finally {
    state.saving = false
    updateSaveState()
    if (state.dirty && state.current === n) saveTimer = setTimeout(save, 1200)
  }
}

async function openNote(id) {
  if (state.dirty) await save()
  try {
    state.current = await call('get', { id }, { timeout: 30000 })
    state.dirty = false
    renderList(); renderEditor()
  } catch (e) { if (e.code === 'LOCKED') return showLock(); toast(e.message, true) }
}

async function newNote() {
  if (state.dirty) await save()
  state.current = { id: null, title: '', content: '', created: null, updated: null }
  state.dirty = false
  state.mode = 'edit'
  renderList(); renderEditor()
  $('#title').focus()
}

async function deleteNote() {
  const n = state.current
  if (!n) return
  if (!n.id) { state.current = null; state.dirty = false; renderEmpty(); return }
  if (!confirm(`Supprimer définitivement la note « ${n.title} » ?`)) return
  try {
    clearTimeout(saveTimer)
    await call('delete', { id: n.id })
    state.current = null; state.dirty = false
    toast('Note supprimée')
    await loadList(); renderEmpty()
  } catch (e) { toast(e.message, true) }
}

async function lockNow() {
  if (state.dirty) await save()
  await call('lock')
  showLock()
}

$('#list').addEventListener('click', (e) => { const it = e.target.closest('[data-id]'); if (it) openNote(it.dataset.id) })
$('#btn-new').onclick = newNote
$('#btn-lock').onclick = lockNow
let qTimer
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $('#q').value; loadList() }, 150) })

// ── Change password ────────────────────────────────────────────────────────
$('#btn-pw').onclick = async () => {
  if (state.dirty) await save()
  const bd = document.createElement('div')
  bd.className = 'backdrop'
  bd.innerHTML = `<form class="modal" autocomplete="off"><div class="modal-head"><span>Changer le mot de passe maître</span><button type="button" class="ghost icon" data-x>✕</button></div>
    <div class="modal-body">
      <label>Mot de passe actuel<input type="password" id="c-cur" autocomplete="current-password" /></label>
      <label>Nouveau mot de passe<input type="password" id="c-new" autocomplete="new-password" /></label>
      <div><div class="meter"><div id="c-meter"></div></div><div class="meter-lbl"><span id="c-strength">—</span><span id="c-hint"></span></div></div>
      <label>Confirmation<input type="password" id="c-new2" autocomplete="new-password" /></label>
      <div class="muted" style="font-size:12px">Toutes les notes seront re-chiffrées avec la nouvelle clé (opération atomique).</div>
      <div class="err-line" id="c-err"></div>
    </div>
    <div class="modal-foot"><button type="button" data-x>Annuler</button><button type="submit" class="primary" id="c-btn">Changer</button></div></form>`
  const close = () => { bd.remove(); document.removeEventListener('keydown', onKey, true) }
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close() } }
  document.addEventListener('keydown', onKey, true)
  bd.addEventListener('click', (e) => { if (e.target === bd || e.target.closest('[data-x]')) close() })
  bd.querySelector('#c-new').addEventListener('input', (e) => renderMeter(e.target.value, bd.querySelector('#c-meter'), bd.querySelector('#c-strength'), bd.querySelector('#c-hint')))
  bd.querySelector('form').onsubmit = async (e) => {
    e.preventDefault()
    const cur = bd.querySelector('#c-cur').value, nw = bd.querySelector('#c-new').value, nw2 = bd.querySelector('#c-new2').value
    const err = bd.querySelector('#c-err')
    err.textContent = ''
    if (nw !== nw2) { err.textContent = 'Les deux mots de passe ne correspondent pas.'; return }
    if (nw.length < (state.status.min_password || 8)) { err.textContent = `Au moins ${state.status.min_password || 8} caractères.`; return }
    if (strength(nw).score < 2 && !confirm('Ce mot de passe est faible. Le conserver quand même ?')) return
    const btn = bd.querySelector('#c-btn')
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Re-chiffrement…'
    try {
      const r = await call('change_password', { current: cur, new: nw, confirm: nw2 }, { timeout: 120000 })
      close()
      toast(`Mot de passe changé — ${r.reencrypted} note(s) re-chiffrée(s)`)
    } catch (ex) {
      if (ex.code === 'LOCKED') { close(); showLock(); return }
      err.textContent = ex.message
    } finally { btn.disabled = false; btn.textContent = 'Changer' }
  }
  document.body.appendChild(bd)
  bd.querySelector('#c-cur').focus()
}

// ── Markdown (minimal, escaped first) ──────────────────────────────────────
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/~~([^~]+)~~/g, '<s>$1</s>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a title="$2">$1</a>')
}
function md(src) {
  const lines = esc(src).split('\n')
  let out = '', list = null, para = [], inCode = false, code = []
  const flushPara = () => { if (para.length) { out += `<p>${inline(para.join('<br>'))}</p>`; para = [] } }
  const flushList = () => { if (list) { out += `</${list}>`; list = null } }
  for (const line of lines) {
    if (/^```/.test(line)) {
      if (inCode) { out += `<pre><code>${code.join('\n')}</code></pre>`; code = []; inCode = false } else { flushPara(); flushList(); inCode = true }
      continue
    }
    if (inCode) { code.push(line); continue }
    let m
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushPara(); flushList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); flushList(); out += '<hr>'; continue }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); flushList(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue }
    if ((m = line.match(/^\s*([-*+]|\d+\.)\s+(.*)$/))) {
      flushPara()
      const kind = /\d/.test(m[1]) ? 'ol' : 'ul'
      if (list !== kind) { flushList(); out += `<${kind}>`; list = kind }
      const task = m[2].match(/^\[( |x)\]\s+(.*)$/i)
      out += `<li>${task ? (task[1].trim() ? '☑ ' : '☐ ') + inline(task[2]) : inline(m[2])}</li>`
      continue
    }
    if (!line.trim()) { flushPara(); flushList(); continue }
    flushList(); para.push(line)
  }
  if (inCode) out += `<pre><code>${code.join('\n')}</code></pre>`
  flushPara(); flushList()
  return out || '<div class="muted">Note vide</div>'
}

// ── Activity / shortcuts ───────────────────────────────────────────────────
let lastPing = 0
function activity() {
  if ($('#app').classList.contains('hidden')) return
  const now = Date.now()
  if (now - lastPing < 20000) return
  lastPing = now
  call('ping').then((r) => { if (r && !r.unlocked && !$('#app').classList.contains('hidden')) showLock('auto') }).catch(() => {})
}
for (const ev of ['mousemove', 'keydown', 'mousedown', 'wheel']) document.addEventListener(ev, activity, { passive: true })

document.addEventListener('keydown', (e) => {
  if ($('#app').classList.contains('hidden') || document.querySelector('.backdrop')) return
  const k = e.key.toLowerCase()
  if (e.ctrlKey && k === 's') { e.preventDefault(); save() }
  else if (e.ctrlKey && k === 'n') { e.preventDefault(); newNote() }
  else if (e.ctrlKey && k === 'l') { e.preventDefault(); lockNow() }
  else if (e.ctrlKey && k === 'f') { e.preventDefault(); $('#q').focus(); $('#q').select() }
  else if (e.ctrlKey && k === 'e' && state.current) { e.preventDefault(); setMode(state.mode === 'edit' ? 'preview' : 'edit') }
})

refreshStatus()
</script>
