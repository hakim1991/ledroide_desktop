<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini-jeux</title>
<script src="/ledroide-bridge.js"></script>
<style>
  :root {
    --bg: #0f0f12; --surface: #18181b; --surface2: #1f1f23; --surface3: #27272c; --border: #27272a;
    --text: #e2e2e8; --muted: #71717a; --accent: #6366f1; --accent-h: #818cf8;
    --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; --info: #3b82f6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
         font-size: 13px; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
  button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
           padding: 5px 10px; font: inherit; cursor: pointer; transition: .12s; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: #3f3f46; background: #26262b; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button.danger { color: #fca5a5; }
  button.danger:hover:not(:disabled) { border-color: rgba(239,68,68,.5); }
  button.icon { padding: 5px 8px; min-width: 30px; }
  button.on { border-color: var(--accent); color: var(--accent-h); }
  input, select, textarea { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 8px; font: inherit; outline: none; user-select: text; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  .hidden { display: none !important; }
  .spacer { flex: 1; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
  .muted { color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--surface3); color: var(--text); }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px;
          background: var(--surface2); border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .kbd { display: inline-block; padding: 0 5px; border: 1px solid #3f3f46; border-bottom-width: 2px; border-radius: 4px;
         font-size: 11px; color: var(--text); background: var(--surface2); }

  header { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border);
           background: var(--surface); flex-shrink: 0; flex-wrap: wrap; min-height: 46px; }
  header .title { font-weight: 600; font-size: 14px; margin-right: 4px; display: flex; align-items: center; gap: 6px; }
  #gameToolbar, #gameStatus { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .vol { display: inline-flex; align-items: center; gap: 4px; }
  .vol input { width: 70px; }

  #hub { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
  .group { margin-bottom: 20px; }
  .group h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer;
          display: flex; flex-direction: column; gap: 6px; transition: .12s; position: relative; outline: none; }
  .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-1px); background: #1b1b20; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .card .ico { font-size: 28px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--surface2); border-radius: 8px; }
  .card .name { font-weight: 600; font-size: 14px; }
  .card .desc { color: var(--muted); line-height: 1.4; flex: 1; }
  .card .foot { display: flex; gap: 8px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .card .badge { position: absolute; top: 10px; right: 10px; font-size: 11px; color: var(--accent-h);
                 background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.35); padding: 1px 7px; border-radius: 999px; }

  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #game { position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; }
  .loading { margin: auto; color: var(--muted); }

  .overlay { position: absolute; inset: 0; background: rgba(9,9,11,.72); display: grid; place-items: center; z-index: 40;
             backdrop-filter: blur(2px); animation: fade .15s; }
  .overlay-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px;
                  min-width: 260px; max-width: min(460px, 92%); text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .overlay-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .overlay-text { color: var(--muted); line-height: 1.5; margin-bottom: 12px; white-space: pre-line; }
  .overlay-btns { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

  .dlg-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 100; animation: fade .12s; }
  .dlg { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-width: 320px; max-width: min(520px, 94vw);
         max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,.55); }
  .dlg.wide { max-width: min(820px, 96vw); width: 820px; }
  .dlg-title { padding: 12px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border); }
  .dlg-body { padding: 14px 16px; overflow-y: auto; line-height: 1.5; }
  .dlg-btns { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .form { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
  .scores table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .scores td { padding: 5px 6px; border-bottom: 1px solid var(--border); }
  .scores tr.me td { background: rgba(99,102,241,.14); }
  .scores .rk { width: 34px; } .scores .sc { font-weight: 600; } .scores .dt { text-align: right; }

  #toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 200; pointer-events: none; }
  .toast { background: var(--surface2); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
           transition: opacity .3s, transform .3s; animation: rise .2s; }
  .toast.ok { border-color: rgba(34,197,94,.5); } .toast.err { border-color: rgba(239,68,68,.5); color: #fca5a5; }
  .toast.out { opacity: 0; transform: translateY(6px); }
  @media (max-width: 1250px) {
    #gameHeader .vol input, #gameTitle span:last-child { display: none; }
    #gameHeader { gap: 4px; padding: 6px 8px; }
  }
  @keyframes fade { from { opacity: 0 } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } }
</style>
</head>
<body>
<header id="hubHeader">
  <div class="title">🕹️ Mini-jeux</div>
  <input id="search" placeholder="Rechercher un jeu…" style="width:200px" />
  <div class="spacer"></div>
  <label class="muted" for="player">Joueur</label>
  <input id="player" maxlength="40" placeholder="Anonyme" style="width:130px" />
  <span class="sep"></span>
  <span class="vol"><button class="icon sndBtn" title="Son">🔊</button><input class="volIn" type="range" min="0" max="1" step="0.05" /></span>
</header>
<header id="gameHeader" class="hidden">
  <button id="backBtn" title="Retour à l’accueil (les parties en cours sont sauvegardées)">← Accueil</button>
  <div class="title" id="gameTitle"></div>
  <div id="gameToolbar"></div>
  <div class="spacer"></div>
  <div id="gameStatus"></div>
  <span class="sep"></span>
  <span class="vol"><button class="icon sndBtn" title="Son">🔊</button><input class="volIn" type="range" min="0" max="1" step="0.05" /></span>
</header>
<main id="hub"></main>
<div id="stage" class="hidden"><div id="game"></div></div>
<div id="toasts"></div>

<script type="module">
import { call, h, createContext, sound, toast, format } from './common.js'

const GAMES = [
  { id: 'minesweeper', group: 'Réflexion', icon: '💣', name: 'Démineur', desc: 'Dégagez la grille sans toucher une mine. Premier clic toujours sûr, accords, records par niveau.' },
  { id: 'sudoku', group: 'Réflexion', icon: '🔢', name: 'Sudoku', desc: 'Grilles générées à solution unique, 4 niveaux, notes au crayon, indices, annuler.' },
  { id: 'fusion', group: 'Réflexion', icon: '🔷', name: 'Fusion', desc: 'Faites glisser les tuiles, fusionnez les nombres identiques et visez toujours plus haut.' },
  { id: 'slider', group: 'Réflexion', icon: '🔲', name: 'Taquin', desc: 'Remettez les pièces dans l’ordre, de 3×3 à 5×5. Indices calculés par un solveur.' },
  { id: 'memory', group: 'Réflexion', icon: '🧠', name: 'Mémoire', desc: 'Retrouvez les paires. Solo ou à deux, emoji ou vos propres images.' },
  { id: 'solitaire', group: 'Réflexion', icon: '🃏', name: 'Solitaire', desc: 'La patience classique à 7 colonnes : tirage 1 ou 3 cartes, annuler, indices, fin automatique.' },
  { id: 'snake', group: 'Arcade', icon: '🐍', name: 'Serpent', desc: 'Mangez, grandissez, ne vous mordez pas la queue. Murs, bords ouverts, obstacles.' },
  { id: 'blocks', group: 'Arcade', icon: '🟦', name: 'Blocs', desc: 'Empilez les pièces qui tombent et complétez des lignes. Pièce suivante, réserve, niveaux.' },
  { id: 'breakout', group: 'Arcade', icon: '🏓', name: 'Casse-briques', desc: 'Brisez tous les murs de briques. Niveaux intégrés et éditeur de niveaux.' },
  { id: 'daily-word', group: 'Mots', icon: '🔤', name: 'Mot du jour', desc: 'Trouvez le mot de 5 lettres en 6 essais. Un mot par jour, ou en mode libre.' },
  { id: 'hangman', group: 'Mots', icon: '📝', name: 'Pendu', desc: 'Devinez le mot lettre par lettre avant que le dessin soit complet. Thèmes variés.' },
  { id: 'connect4', group: 'Duel', icon: '🔴', name: 'Quatre en ligne', desc: 'Alignez quatre jetons avant l’adversaire. Contre l’ordinateur (3 niveaux) ou à deux.' },
  { id: 'tictactoe', group: 'Duel', icon: '❌', name: 'Morpion', desc: 'Le classique en 3×3, ou en grand plateau avec 5 alignés. IA ou à deux.' },
  { id: 'reversi', group: 'Duel', icon: '⚫', name: 'Reversi', desc: 'Encadrez les pions adverses pour les retourner. IA 3 niveaux ou à deux.' },
  { id: 'chess', group: 'Duel', icon: '♟️', name: 'Échecs', desc: 'Toutes les règles (roque, prise en passant, promotion, nulles). IA 3 niveaux ou à deux.' },
  { id: 'checkers', group: 'Duel', icon: '⚪', name: 'Dames', desc: 'Dames internationales 10×10 ou 8×8 : prises obligatoires, rafles, dames volantes. IA ou à deux.' },
]

const $ = (s) => document.querySelector(s)
let hubPrefs = { sound: true, volume: 0.5, player: '' }
let summary = {}
let current = null
let prefsTimer = 0

function savePrefs() {
  clearTimeout(prefsTimer)
  prefsTimer = setTimeout(() => call('prefs.set', { game: '_hub', data: hubPrefs }).catch(() => {}), 400)
}

function syncSoundUi() {
  sound.enabled = hubPrefs.sound !== false
  sound.volume = hubPrefs.volume ?? 0.5
  for (const b of document.querySelectorAll('.sndBtn')) b.textContent = sound.enabled && sound.volume > 0 ? '🔊' : '🔇'
  for (const i of document.querySelectorAll('.volIn')) i.value = sound.volume
}
for (const b of document.querySelectorAll('.sndBtn')) b.onclick = () => { hubPrefs.sound = !sound.enabled; syncSoundUi(); savePrefs() }
for (const i of document.querySelectorAll('.volIn')) i.oninput = () => { hubPrefs.volume = +i.value; hubPrefs.sound = true; syncSoundUi(); savePrefs() }
$('#player').oninput = (e) => { hubPrefs.player = e.target.value.trim(); savePrefs() }
$('#search').oninput = renderHub

function footFor(g) {
  const s = summary[g.id]
  if (!s) return [h('span', null, 'Jamais joué')]
  const st = s.stats || {}
  const out = []
  if (st.played) out.push(h('span', null, `${format.int(st.played)} partie${st.played > 1 ? 's' : ''}`))
  if (st.won) out.push(h('span', null, `🏆 ${format.int(st.won)}`))
  if (st.hub_best) out.push(h('span', null, `★ ${st.hub_best}`))
  return out.length ? out : [h('span', null, 'Jamais joué')]
}

function renderHub() {
  const q = $('#search').value.trim().toLowerCase()
  const groups = new Map()
  for (const g of GAMES) {
    if (q && !`${g.name} ${g.desc} ${g.group}`.toLowerCase().includes(q)) continue
    if (!groups.has(g.group)) groups.set(g.group, [])
    groups.get(g.group).push(g)
  }
  $('#hub').replaceChildren(...[...groups].map(([name, games]) => h('section', { class: 'group' },
    h('h2', null, name),
    h('div', { class: 'cards' }, games.map((g) => h('div', {
      class: 'card', tabindex: 0, 'data-game': g.id,
      onclick: () => openGame(g.id),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGame(g.id) } },
    },
      summary[g.id]?.has_save ? h('span', { class: 'badge' }, 'En cours') : null,
      h('div', { class: 'top' }, h('div', { class: 'ico' }, g.icon), h('div', { class: 'name' }, g.name)),
      h('div', { class: 'desc' }, g.desc),
      h('div', { class: 'foot' }, footFor(g))))))))
  if (!groups.size) $('#hub').replaceChildren(h('div', { class: 'muted' }, 'Aucun jeu ne correspond.'))
}

async function loadSummary() {
  try {
    const r = await call('hub.summary')
    summary = r.games || {}
    hubPrefs = { ...hubPrefs, ...(r.prefs || {}) }
  } catch (e) { toast(`Chargement : ${e.message}`, 'err') }
  $('#player').value = hubPrefs.player || ''
  syncSoundUi()
  renderHub()
}

async function openGame(id) {
  const g = GAMES.find((x) => x.id === id)
  if (!g) return
  await closeGame()
  $('#hubHeader').classList.add('hidden'); $('#hub').classList.add('hidden')
  $('#gameHeader').classList.remove('hidden'); $('#stage').classList.remove('hidden')
  $('#gameTitle').replaceChildren(h('span', null, g.icon), h('span', null, g.name))
  const root = $('#game')
  root.replaceChildren(h('div', { class: 'loading' }, 'Chargement…'))
  const ctx = createContext(g, { hubPrefs, toolbarEl: $('#gameToolbar'), statusEl: $('#gameStatus'), rootEl: root })
  current = { g, ctx, inst: null }
  try {
    const mod = await import(`./games/${id}.js`)
    if (current?.ctx !== ctx) return
    root.replaceChildren()
    current.inst = (await mod.default.mount(root, ctx)) || {}
  } catch (e) {
    console.error(e)
    root.replaceChildren(h('div', { class: 'loading' }, `Impossible de charger le jeu : ${e.message}`))
  }
}

async function closeGame() {
  if (!current) return
  const { ctx, inst } = current
  current = null
  try { ctx._pause(); await inst?.pause?.() } catch (e) { console.error(e) }
  try { await inst?.destroy?.() } catch (e) { console.error(e) }
  ctx._destroy()
  $('#game').replaceChildren()
  $('#gameToolbar').replaceChildren(); $('#gameStatus').replaceChildren()
  $('#game').querySelector('.overlay')?.remove()
}

$('#backBtn').onclick = async () => {
  await closeGame()
  $('#gameHeader').classList.add('hidden'); $('#stage').classList.add('hidden')
  $('#hubHeader').classList.remove('hidden'); $('#hub').classList.remove('hidden')
  await loadSummary()
  document.querySelector('.card')?.focus()
}

const pauseCurrent = () => { if (current) { current.ctx._pause(); current.inst?.pause?.() } }
window.addEventListener('blur', pauseCurrent)
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseCurrent() })

window.__miniGames = { openGame, closeGame, GAMES }
loadSummary()
</script>
</body>
</html>
