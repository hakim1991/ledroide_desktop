<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QR Code</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
  body { font-family: system-ui, sans-serif; background: #0f0f12; color: #e2e2e8; min-height: 100vh; padding: 1.5rem; font-size: 14px; }
  h1 { font-size: 1.1rem; font-weight: 700; color: #f4f4f5; margin-bottom: 1.25rem; }
  h2 { font-size: .95rem; font-weight: 600; color: #f4f4f5; margin-bottom: .75rem; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
  .muted { color: #71717a; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: .5rem 1rem; font-size: .85rem; font-weight: 500; font-family: inherit; transition: opacity .15s, background .15s; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover:not(:disabled) { opacity: .85; }
  .btn-ghost { background: #27272a; color: #e2e2e8; }
  .btn-ghost:hover:not(:disabled) { background: #3f3f46; }
  .btn-sm { padding: .3rem .6rem; font-size: .78rem; }
  input, select, textarea { background: #09090b; border: 1px solid #27272a; color: #e2e2e8; border-radius: 6px; padding: .45rem .6rem; font: inherit; font-size: .85rem; width: 100%; }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
  input[type=range] { padding: 0; accent-color: #6366f1; }
  input[type=checkbox] { width: auto; accent-color: #6366f1; }
  input[type=color] { padding: 2px; height: 34px; width: 46px; cursor: pointer; }
  label.f { display: flex; flex-direction: column; gap: .3rem; font-size: .78rem; color: #a1a1aa; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
  .row > label.f { flex: 1 1 140px; }
  .stack > * + * { margin-top: .75rem; }

  .tabs { display: flex; gap: .25rem; margin-bottom: 1rem; border-bottom: 1px solid #27272a; }
  .tab { background: transparent; color: #a1a1aa; border-radius: 6px 6px 0 0; padding: .55rem 1rem; border-bottom: 2px solid transparent; }
  .tab:hover { color: #e2e2e8; }
  .tab.active { color: #e2e2e8; border-bottom-color: #6366f1; }
  .view { display: none; }
  .view.active { display: block; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .seg { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 1rem; }
  .seg button { background: #09090b; border: 1px solid #27272a; color: #a1a1aa; }
  .seg button.active { border-color: #6366f1; color: #e2e2e8; background: rgba(99,102,241,.12); }
  .tpl { display: none; }
  .tpl.active { display: block; }
  .color-field { display: flex; gap: .4rem; align-items: center; }
  .color-field input[type=text] { font-family: ui-monospace, monospace; }

  .preview-box { display: flex; align-items: center; justify-content: center; min-height: 280px; border-radius: 8px; padding: 1rem;
    background-color: #09090b; background-image: linear-gradient(45deg, #1f1f23 25%, transparent 25%), linear-gradient(-45deg, #1f1f23 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1f1f23 75%), linear-gradient(-45deg, transparent 75%, #1f1f23 75%);
    background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
  .preview-box img { max-width: 100%; max-height: 340px; image-rendering: pixelated; display: block; }
  .meta { font-size: .78rem; color: #71717a; margin-top: .6rem; text-align: center; min-height: 1.2em; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .9rem; justify-content: center; }
  .payload { margin-top: .75rem; font-family: ui-monospace, monospace; font-size: .75rem; color: #a1a1aa; background: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: .5rem .6rem; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }

  .drop-zone { border: 2px dashed #3f3f46; border-radius: 8px; padding: 2.25rem 1rem; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop-zone:hover, .drop-zone.over { border-color: #6366f1; background: rgba(99,102,241,.05); }
  .drop-zone .icon { font-size: 2rem; margin-bottom: .5rem; }
  .drop-zone p { color: #71717a; font-size: .875rem; }
  .drop-zone strong { color: #a1a1aa; }
  .scan-wrap { position: relative; display: inline-block; max-width: 100%; }
  .scan-wrap img { max-width: 100%; max-height: 420px; display: block; border-radius: 6px; }
  .scan-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .result { background: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: .75rem; }
  .result + .result { margin-top: .6rem; }
  .result .head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .45rem; }
  .badge { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; background: rgba(99,102,241,.15); color: #a5b4fc; border-radius: 999px; padding: .15rem .55rem; }
  .result pre { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace; font-size: .8rem; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; font-size: .82rem; margin-top: .5rem; }
  .kv span { color: #71717a; }

  .msg { padding: .7rem 1rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; display: none; white-space: pre-wrap; }
  .msg.show { display: block; }
  .msg.err { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); color: #fca5a5; }
  .msg.info { background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.25); color: #a5b4fc; }
  .warn-text { color: #fcd34d; font-size: .78rem; margin-top: .5rem; }
  .toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(20px); background: #27272a; color: #e2e2e8; padding: .5rem 1rem; border-radius: 6px; font-size: .82rem; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>🔳 QR Code</h1>

<div class="tabs">
  <button class="tab active" data-view="gen">Générer</button>
  <button class="tab" data-view="read">Lire</button>
</div>

<div class="msg err" id="errorMsg"></div>

<!-- ═════ Générer ═════ -->
<section class="view active" id="view-gen">
  <div class="layout">
    <div class="card">
      <div class="seg" id="tplSeg">
        <button class="active" data-tpl="text">📝 Texte</button>
        <button data-tpl="url">🔗 URL</button>
        <button data-tpl="wifi">📶 WiFi</button>
        <button data-tpl="vcard">👤 Contact (vCard)</button>
      </div>

      <div class="tpl active stack" data-tpl="text">
        <label class="f">Texte<textarea id="tText" placeholder="Saisissez votre texte…">Bonjour depuis LedroideDesktop !</textarea></label>
      </div>
      <div class="tpl stack" data-tpl="url">
        <label class="f">Adresse web<input id="tUrl" placeholder="https://exemple.fr" value="https://" /></label>
      </div>
      <div class="tpl stack" data-tpl="wifi">
        <label class="f">Nom du réseau (SSID)<input id="wSsid" placeholder="MaBox" /></label>
        <div class="row">
          <label class="f">Sécurité
            <select id="wSec"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">Aucune</option></select>
          </label>
          <label class="f" id="wPassWrap">Mot de passe<input id="wPass" type="text" autocomplete="off" /></label>
        </div>
        <label style="display:flex;gap:.45rem;align-items:center;font-size:.85rem"><input type="checkbox" id="wHidden" /> Réseau masqué</label>
      </div>
      <div class="tpl stack" data-tpl="vcard">
        <div class="row">
          <label class="f">Prénom<input id="vFirst" /></label>
          <label class="f">Nom<input id="vLast" /></label>
        </div>
        <div class="row">
          <label class="f">Téléphone<input id="vTel" type="tel" /></label>
          <label class="f">E-mail<input id="vEmail" type="email" /></label>
        </div>
        <div class="row">
          <label class="f">Société<input id="vOrg" /></label>
          <label class="f">Fonction<input id="vTitle" /></label>
        </div>
        <label class="f">Site web<input id="vUrl" /></label>
        <label class="f">Adresse<input id="vAdr" placeholder="Rue, ville, code postal, pays" /></label>
        <label class="f">Note<input id="vNote" /></label>
      </div>

      <h2 style="margin-top:1.25rem">Apparence</h2>
      <div class="stack">
        <div class="row">
          <label class="f">Taille : <b id="sizeVal">512 px</b><input type="range" id="size" min="128" max="2048" step="32" value="512" /></label>
          <label class="f">Correction d'erreurs
            <select id="ec">
              <option value="L">L — 7 %</option>
              <option value="M" selected>M — 15 %</option>
              <option value="Q">Q — 25 %</option>
              <option value="H">H — 30 %</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label class="f">Couleur du code<span class="color-field"><input type="color" id="fgPick" value="#000000" /><input type="text" id="fg" value="#000000" maxlength="7" /></span></label>
          <label class="f">Couleur de fond<span class="color-field"><input type="color" id="bgPick" value="#ffffff" /><input type="text" id="bg" value="#ffffff" maxlength="7" /></span></label>
        </div>
        <div class="row">
          <label class="f">Marge (modules) : <b id="borderVal">4</b><input type="range" id="border" min="0" max="10" value="4" /></label>
          <label style="display:flex;gap:.45rem;align-items:center;font-size:.85rem;flex:1 1 140px;padding-bottom:.4rem"><input type="checkbox" id="transparent" /> Fond transparent</label>
        </div>
        <div class="warn-text hidden" id="contrastWarn">⚠️ Contraste faible ou couleurs inversées : certains lecteurs pourraient ne pas reconnaître le code.</div>
      </div>
    </div>

    <div class="card">
      <h2>Aperçu</h2>
      <div class="preview-box" id="previewBox"><span class="muted">Saisissez un contenu…</span></div>
      <div class="meta" id="meta"></div>
      <div class="actions">
        <button class="btn-primary" id="dlPng" disabled>⬇ PNG</button>
        <button class="btn-primary" id="dlSvg" disabled>⬇ SVG</button>
        <button class="btn-ghost" id="copyPayload">📋 Copier le contenu</button>
      </div>
      <div class="payload" id="payload"></div>
    </div>
  </div>
</section>

<!-- ═════ Lire ═════ -->
<section class="view" id="view-read">
  <div class="layout">
    <div class="card">
      <div class="drop-zone" id="dropZone">
        <div class="icon">📷</div>
        <p><strong>Glissez une image ici</strong> ou cliquez pour sélectionner</p>
        <p style="margin-top:.4rem;font-size:.8rem;">Vous pouvez aussi coller une image (Ctrl+V)</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
      <div id="scanArea" class="hidden" style="margin-top:1rem;text-align:center">
        <div class="scan-wrap"><img id="scanImg" alt="" /><svg id="scanSvg" preserveAspectRatio="none"></svg></div>
      </div>
    </div>
    <div class="card">
      <h2>Résultat</h2>
      <div id="readResults"><p class="muted">Aucune image analysée.</p></div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const PORT = parseInt(location.port) || 8765
const BASE = `http://127.0.0.1:${PORT}/modules/qr-code/api`
const $ = id => document.getElementById(id)
let tpl = 'text'
let lastOk = false
let genSeq = 0
let debounceT = null

function showError(msg, code) {
  const e = $('errorMsg')
  if (!msg) { e.classList.remove('show'); return }
  e.textContent = '⚠️ ' + msg + (code === 'MISSING_DEP' ? '\n→ Installez les dépendances du module (bouton « Installer les dépendances »), puis rechargez.' : '')
  e.classList.add('show')
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1600) }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copié !'); return } catch {}
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'
  document.body.appendChild(ta); ta.select()
  try { document.execCommand('copy'); toast('Copié !') } catch { toast('Copie impossible') }
  ta.remove()
}
async function api(path, opts = {}) {
  let r
  try { r = await fetch(BASE + path, opts) } catch { throw { error: 'Erreur de connexion au backend.' } }
  let d = {}
  try { d = await r.json() } catch {}
  if (!r.ok || d.error) throw { error: d.error || ('Erreur HTTP ' + r.status), code: d.code }
  return d
}

// ── tabs ──
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t))
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + t.dataset.view))
  showError(null)
}))
$('tplSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  tpl = b.dataset.tpl
  $('tplSeg').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b))
  document.querySelectorAll('.tpl').forEach(x => x.classList.toggle('active', x.dataset.tpl === tpl))
  schedule()
})

// ── payload builders ──
const wifiEsc = s => s.replace(/([\\;,:"])/g, '\\$1')
const vEsc = s => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1')
function buildPayload() {
  switch (tpl) {
    case 'text': return $('tText').value
    case 'url': {
      let u = $('tUrl').value.trim()
      if (!u || u === 'https://' || u === 'http://') return ''
      if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u
      return u
    }
    case 'wifi': {
      const ssid = $('wSsid').value
      if (!ssid) return ''
      const sec = $('wSec').value
      let s = `WIFI:T:${sec};S:${wifiEsc(ssid)};`
      if (sec !== 'nopass') s += `P:${wifiEsc($('wPass').value)};`
      if ($('wHidden').checked) s += 'H:true;'
      return s + ';'
    }
    case 'vcard': {
      const f = $('vFirst').value.trim(), l = $('vLast').value.trim()
      const fields = ['vTel', 'vEmail', 'vOrg', 'vTitle', 'vUrl', 'vAdr', 'vNote'].map(id => $(id).value.trim())
      if (!f && !l && !fields.some(Boolean)) return ''
      const [tel, email, org, title, url, adr, note] = fields
      const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(l)};${vEsc(f)};;;`, `FN:${vEsc((f + ' ' + l).trim())}`]
      if (org) lines.push('ORG:' + vEsc(org))
      if (title) lines.push('TITLE:' + vEsc(title))
      if (tel) lines.push('TEL;TYPE=CELL:' + tel)
      if (email) lines.push('EMAIL:' + email)
      if (url) lines.push('URL:' + url)
      if (adr) lines.push('ADR;TYPE=HOME:;;' + vEsc(adr) + ';;;;')
      if (note) lines.push('NOTE:' + vEsc(note))
      lines.push('END:VCARD')
      return lines.join('\n')
    }
  }
  return ''
}
$('wSec').addEventListener('change', () => { $('wPassWrap').style.visibility = $('wSec').value === 'nopass' ? 'hidden' : 'visible' })

// ── colors ──
const HEX = /^#[0-9a-f]{6}$/i
function bindColor(pick, text) {
  $(pick).addEventListener('input', () => { $(text).value = $(pick).value; schedule() })
  $(text).addEventListener('input', () => {
    let v = $(text).value.trim(); if (v && v[0] !== '#') v = '#' + v
    if (HEX.test(v)) { $(pick).value = v.toLowerCase(); schedule() }
  })
}
bindColor('fgPick', 'fg'); bindColor('bgPick', 'bg')
function lum(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
}

function opts() {
  return {
    data: buildPayload(), size: +$('size').value, ec: $('ec').value,
    fg: $('fgPick').value, bg: $('bgPick').value, border: +$('border').value, transparent: $('transparent').checked,
  }
}
function schedule() {
  $('sizeVal').textContent = $('size').value + ' px'
  $('borderVal').textContent = $('border').value
  clearTimeout(debounceT); debounceT = setTimeout(generate, 220)
}
async function generate() {
  const o = opts()
  const lf = lum(o.fg), lb = lum(o.bg)
  const warn = o.transparent ? lf > 0.5 : (lf > lb || (lb + 0.05) / (lf + 0.05) < 3)
  $('contrastWarn').classList.toggle('hidden', !warn)
  $('payload').textContent = o.data || '—'
  const seq = ++genSeq
  if (!o.data) {
    $('previewBox').innerHTML = '<span class="muted">Saisissez un contenu…</span>'
    $('meta').textContent = ''; setDl(false); showError(null); return
  }
  try {
    const d = await api('/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) })
    if (seq !== genSeq) return
    showError(null)
    const img = new Image(); img.src = d.png; img.alt = 'QR code'
    $('previewBox').innerHTML = ''; $('previewBox').appendChild(img)
    $('meta').textContent = `Version ${d.version} · ${d.modules}×${d.modules} modules · ${d.pixels}×${d.pixels} px · ${new TextEncoder().encode(o.data).length} octets`
    setDl(true)
  } catch (e) {
    if (seq !== genSeq) return
    showError(e.error, e.code); setDl(false)
    $('previewBox').innerHTML = '<span class="muted">Aperçu indisponible</span>'; $('meta').textContent = ''
  }
}
function setDl(on) { lastOk = on; $('dlPng').disabled = $('dlSvg').disabled = !on }
document.querySelectorAll('#view-gen input, #view-gen textarea, #view-gen select').forEach(el => {
  if (el.id === 'fg' || el.id === 'bg' || el.id === 'fgPick' || el.id === 'bgPick') return
  el.addEventListener('input', schedule); el.addEventListener('change', schedule)
})

function fileStem() {
  if (tpl === 'wifi') return 'wifi_' + ($('wSsid').value || 'reseau')
  if (tpl === 'vcard') return 'contact_' + (($('vFirst').value + '_' + $('vLast').value).replace(/^_|_$/g, '') || 'vcard')
  if (tpl === 'url') { try { return 'qr_' + new URL(buildPayload()).hostname } catch {} }
  return 'qrcode'
}
async function download(fmt) {
  if (!lastOk) return
  try {
    const d = await api('/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...opts(), fmt, name: fileStem() }) })
    const a = document.createElement('a'); a.href = `${BASE}/file/${encodeURIComponent(d.filename)}`; a.download = d.filename
    document.body.appendChild(a); a.click(); a.remove()
  } catch (e) { showError(e.error, e.code) }
}
$('dlPng').addEventListener('click', () => download('png'))
$('dlSvg').addEventListener('click', () => download('svg'))
$('copyPayload').addEventListener('click', () => { const p = buildPayload(); if (p) copyText(p) })

// ── lecture ──
const dropZone = $('dropZone'), fileInput = $('fileInput')
dropZone.addEventListener('click', () => fileInput.click())
fileInput.addEventListener('change', () => { if (fileInput.files[0]) readImage(fileInput.files[0]); fileInput.value = '' })
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over') })
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'))
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('over')
  const f = e.dataTransfer.files[0]; if (f) readImage(f)
})
document.addEventListener('paste', e => {
  if (!$('view-read').classList.contains('active')) return
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'))
  if (item) { e.preventDefault(); readImage(item.getAsFile()) }
})

const TYPE_LABEL = { url: 'URL', wifi: 'WiFi', vcard: 'Contact', email: 'E-mail', tel: 'Téléphone', sms: 'SMS', geo: 'Position', text: 'Texte' }
const SEC_LABEL = { WPA: 'WPA/WPA2', WEP: 'WEP', nopass: 'Aucune', '': 'Aucune' }
let scanUrl = null
async function readImage(f) {
  if (!f.type.startsWith('image/') && !/\.(png|jpe?g|gif|bmp|webp|tiff?)$/i.test(f.name || '')) { showError('Veuillez choisir une image.'); return }
  showError(null)
  if (scanUrl) URL.revokeObjectURL(scanUrl)
  scanUrl = URL.createObjectURL(f)
  $('scanImg').src = scanUrl; $('scanSvg').innerHTML = ''
  $('scanArea').classList.remove('hidden')
  $('readResults').innerHTML = '<p class="muted">Analyse…</p>'
  const fd = new FormData(); fd.append('file', f, f.name || 'image.png')
  try {
    const d = await api('/decode', { method: 'POST', body: fd })
    renderResults(d)
  } catch (e) {
    showError(e.error, e.code); $('readResults').innerHTML = '<p class="muted">Échec de l\'analyse.</p>'
  }
}
function renderResults(d) {
  const box = $('readResults'); box.innerHTML = ''
  const svg = $('scanSvg')
  svg.setAttribute('viewBox', `0 0 ${d.width} ${d.height}`)
  svg.innerHTML = ''
  if (!d.results.length) { box.innerHTML = '<p class="muted">Aucun QR code détecté dans cette image. Essayez une image plus nette ou mieux cadrée.</p>'; return }
  d.results.forEach((r, i) => {
    if (r.points) {
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon')
      poly.setAttribute('points', r.points.map(p => p.join(',')).join(' '))
      poly.setAttribute('fill', 'rgba(99,102,241,.18)'); poly.setAttribute('stroke', '#6366f1')
      poly.setAttribute('stroke-width', Math.max(2, d.width / 200)); poly.setAttribute('vector-effect', 'non-scaling-stroke')
      svg.appendChild(poly)
    }
    const el = document.createElement('div'); el.className = 'result'
    const head = document.createElement('div'); head.className = 'head'
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = (d.results.length > 1 ? `#${i + 1} · ` : '') + (TYPE_LABEL[r.type] || 'Texte')
    const btn = document.createElement('button'); btn.className = 'btn-ghost btn-sm'; btn.textContent = '📋 Copier'
    btn.addEventListener('click', () => copyText(r.text))
    head.append(badge, btn)
    const pre = document.createElement('pre'); pre.textContent = r.text
    el.append(head, pre)
    if (r.wifi) {
      const kv = document.createElement('div'); kv.className = 'kv'
      const rows = [['Réseau', r.wifi.ssid], ['Sécurité', SEC_LABEL[r.wifi.security] || r.wifi.security], ['Mot de passe', r.wifi.password || '—'], ['Masqué', r.wifi.hidden ? 'oui' : 'non']]
      for (const [k, v] of rows) { const a = document.createElement('span'); a.textContent = k; const b = document.createElement('b'); b.textContent = v; kv.append(a, b) }
      el.appendChild(kv)
      if (r.wifi.password) {
        const b2 = document.createElement('button'); b2.className = 'btn-ghost btn-sm'; b2.style.marginTop = '.5rem'; b2.textContent = '🔑 Copier le mot de passe'
        b2.addEventListener('click', () => copyText(r.wifi.password)); el.appendChild(b2)
      }
    }
    box.appendChild(el)
  })
}

schedule()
</script>
</body>
</html>
