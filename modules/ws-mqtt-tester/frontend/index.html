<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Testeur WebSocket / MQTT</title>
<script src="/ledroide-bridge.js"></script>
<style>
  :root {
    --bg: #0f0f12; --surface: #18181b; --surface2: #1f1f23; --border: #27272a;
    --text: #e2e2e8; --muted: #71717a; --accent: #6366f1; --accent-h: #818cf8;
    --ok: #22c55e; --err: #ef4444; --warn: #f59e0b; --info: #38bdf8;
    --mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
         font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }
  button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
           padding: 5px 10px; font: inherit; cursor: pointer; transition: .12s; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: #3f3f46; background: #26262b; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button.danger { border-color: rgba(239,68,68,.5); color: #fca5a5; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { color: var(--text); background: var(--surface2); }
  button.icon { padding: 3px 7px; }
  input, select, textarea { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 8px; font: inherit; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); padding: 0; }
  .mono { font-family: var(--mono); }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; margin-left: 12px; }
  .tabs button.active { background: var(--bg); border-color: var(--accent); color: #fff; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.warn { background: var(--warn); }

  .layout { flex: 1; min-height: 0; display: flex; }
  .side { width: 330px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--surface);
          overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sec-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
               display: flex; align-items: center; gap: 6px; }
  .sec-title span { flex: 1; }
  .grid { display: grid; grid-template-columns: 92px 1fr; gap: 6px 8px; align-items: center; }
  .grid label { color: var(--muted); font-size: 12px; }
  .grid input, .grid select, .grid textarea { width: 100%; min-width: 0; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > input { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
  .status-line { font-size: 12px; color: var(--muted); display: flex; align-items: center; }
  .status-line b { color: var(--text); font-weight: 600; }
  textarea.code { font-family: var(--mono); font-size: 12.5px; resize: vertical; line-height: 1.45; tab-size: 2; }
  .hint { color: var(--muted); font-size: 11.5px; }

  .list { display: flex; flex-direction: column; gap: 2px; }
  .li { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
  .li:hover { background: var(--surface2); }
  .li .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .sub { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .li .del { visibility: hidden; padding: 0 5px; }
  .li:hover .del { visibility: visible; }
  .li.active { background: rgba(99,102,241,.14); }
  .empty { color: var(--muted); font-size: 12px; padding: 6px; }
  .qos { font-family: var(--mono); font-size: 10.5px; color: var(--accent-h); border: 1px solid rgba(99,102,241,.4); border-radius: 4px; padding: 0 4px; }

  .composer { border-bottom: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
  .composer textarea { width: 100%; height: 92px; }
  .composer .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .composer .bar .spacer { flex: 1; }
  .logbar { display: flex; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--border); }
  .logbar input[type=text] { flex: 1; min-width: 100px; }
  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0; font-family: var(--mono); font-size: 12px; }
  .entry { display: grid; grid-template-columns: 92px 20px 1fr auto; gap: 8px; padding: 4px 12px; border-left: 3px solid transparent; }
  .entry:hover { background: rgba(255,255,255,.025); }
  .entry .ts { color: var(--muted); }
  .entry .dir { text-align: center; font-weight: 700; }
  .entry.in { border-left-color: var(--ok); } .entry.in .dir { color: var(--ok); }
  .entry.out { border-left-color: var(--accent); } .entry.out .dir { color: var(--accent-h); }
  .entry.sys { color: var(--muted); font-style: italic; font-family: system-ui, sans-serif; }
  .entry .body { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .entry .topic { color: #fbbf24; margin-right: 8px; }
  .entry .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .entry .meta button { visibility: hidden; padding: 0 5px; font-size: 11px; }
  .entry:hover .meta button { visibility: visible; }
  .tag { font-size: 10px; border-radius: 4px; padding: 0 4px; margin-left: 4px; background: var(--surface2); color: var(--muted); }
  .placeholder { color: var(--muted); height: 100%; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 6px; text-align: center; font-family: system-ui, sans-serif; }
  .placeholder .big { font-size: 30px; }
  .banner { margin: 10px 12px 0; padding: 8px 12px; border-radius: 7px; background: rgba(245,158,11,.08);
            border: 1px solid rgba(245,158,11,.35); color: #fcd34d; font-size: 12px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3);
             border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: min(380px, 92vw); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .modal h3 { font-size: 14px; font-weight: 600; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--surface2);
           border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; z-index: 60; opacity: 0;
           transition: opacity .2s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: 1; }
  #toast.bad { border-color: var(--err); color: #fca5a5; }
  kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🔌 Testeur temps réel</h1>
  <div class="tabs">
    <button data-tab="ws" class="active"><span class="dot" id="dot-ws"></span>WebSocket</button>
    <button data-tab="mqtt"><span class="dot" id="dot-mqtt"></span>MQTT</button>
  </div>
</header>

<!-- ── WebSocket ── -->
<div class="layout" data-panel="ws">
  <aside class="side">
    <div>
      <div class="sec-title"><span>Connexion</span></div>
      <div class="grid">
        <label for="ws-url">URL</label><input id="ws-url" class="mono" type="text" placeholder="wss://echo.exemple.org/ws" spellcheck="false" />
        <label for="ws-proto">Sous-protocoles</label><input id="ws-proto" class="mono" type="text" placeholder="chat, v2 (optionnel)" spellcheck="false" />
        <label for="ws-headers">En-têtes</label><textarea id="ws-headers" class="code" rows="3" placeholder="Authorization: Bearer …&#10;X-Client: test" spellcheck="false"></textarea>
        <span></span><label class="check"><input id="ws-verify" type="checkbox" checked /> Vérifier le certificat (wss)</label>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="ws-connect" class="primary" style="flex:1">Se connecter</button>
        <button id="ws-disconnect" class="danger hidden" style="flex:1">Se déconnecter</button>
      </div>
      <div class="status-line" style="margin-top:8px" id="ws-status"></div>
    </div>
    <div>
      <div class="sec-title"><span>Messages enregistrés</span></div>
      <div class="list" id="ws-saved"></div>
    </div>
  </aside>
  <section class="main">
    <div class="composer">
      <textarea id="ws-msg" class="code" placeholder='{"type": "hello"}' spellcheck="false"></textarea>
      <div class="bar">
        <select id="ws-mode"><option value="text">Texte</option><option value="json">JSON</option><option value="hex">Binaire (hex)</option></select>
        <button id="ws-format" class="ghost">Formater</button>
        <span class="spacer"></span>
        <button id="ws-save">Enregistrer…</button>
        <button id="ws-ping" disabled>Ping</button>
        <button id="ws-send" class="primary" disabled title="Envoyer (Ctrl+Entrée)">Envoyer</button>
      </div>
    </div>
    <div class="logbar">
      <input id="ws-filter" type="text" placeholder="Filtrer le journal…" />
      <label class="check"><input id="ws-autoscroll" type="checkbox" checked /> Défilement auto</label>
      <button id="ws-clear" class="ghost">Vider</button>
    </div>
    <div class="log" id="ws-log"></div>
  </section>
</div>

<!-- ── MQTT ── -->
<div class="layout hidden" data-panel="mqtt">
  <aside class="side">
    <div id="paho-missing" class="banner hidden" style="margin:0">La bibliothèque <b>paho-mqtt</b> n'est pas installée : réactivez le module ou installez-la depuis le menu « Bibliothèques ».</div>
    <div>
      <div class="sec-title"><span>Broker</span></div>
      <div class="grid">
        <label for="mq-host">Hôte</label><input id="mq-host" class="mono" type="text" placeholder="localhost" spellcheck="false" />
        <label for="mq-port">Port</label>
        <div class="row"><input id="mq-port" type="number" min="1" max="65535" value="1883" />
          <label class="check"><input id="mq-tls" type="checkbox" /> TLS</label></div>
        <label for="mq-user">Utilisateur</label><input id="mq-user" type="text" autocomplete="off" />
        <label for="mq-pass">Mot de passe</label><input id="mq-pass" type="password" autocomplete="off" placeholder="non enregistré" />
        <label for="mq-cid">Client ID</label>
        <div class="row"><input id="mq-cid" class="mono" type="text" placeholder="aléatoire" spellcheck="false" /><button id="mq-cid-gen" class="icon" title="Générer">🎲</button></div>
        <label for="mq-version">Version</label>
        <div class="row"><select id="mq-version"><option value="3.1.1">MQTT 3.1.1</option><option value="5">MQTT 5</option></select>
          <input id="mq-keepalive" type="number" min="5" max="3600" value="60" title="Keepalive (s)" style="width:70px;flex:0 0 auto" /></div>
        <span></span><label class="check"><input id="mq-verify" type="checkbox" checked /> Vérifier le certificat (TLS)</label>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="mq-connect" class="primary" style="flex:1">Se connecter</button>
        <button id="mq-disconnect" class="danger hidden" style="flex:1">Se déconnecter</button>
      </div>
      <div class="status-line" style="margin-top:8px" id="mq-status"></div>
    </div>
    <div>
      <div class="sec-title"><span>Abonnements</span></div>
      <div class="row">
        <input id="sub-topic" class="mono" type="text" placeholder="maison/+/temperature  ou  capteurs/#" spellcheck="false" />
        <select id="sub-qos" title="QoS"><option>0</option><option>1</option><option>2</option></select>
        <button id="sub-add" disabled>＋</button>
      </div>
      <div class="list" id="subs" style="margin-top:6px"></div>
    </div>
    <div>
      <div class="sec-title"><span>Topics reçus</span></div>
      <div class="list" id="topics"></div>
    </div>
    <div>
      <div class="sec-title"><span>Messages enregistrés</span></div>
      <div class="list" id="mq-saved"></div>
    </div>
  </aside>
  <section class="main">
    <div class="composer">
      <div class="bar">
        <input id="pub-topic" class="mono" type="text" placeholder="Topic de publication (ex. maison/salon/lampe)" spellcheck="false" style="flex:1;min-width:160px" />
        <select id="pub-qos" title="QoS"><option value="0">QoS 0</option><option value="1">QoS 1</option><option value="2">QoS 2</option></select>
        <label class="check"><input id="pub-retain" type="checkbox" /> Retain</label>
      </div>
      <textarea id="pub-msg" class="code" placeholder='{"etat": "on"}' spellcheck="false"></textarea>
      <div class="bar">
        <select id="pub-mode"><option value="text">Texte</option><option value="json">JSON</option></select>
        <button id="pub-format" class="ghost">Formater</button>
        <span class="spacer"></span>
        <button id="pub-save">Enregistrer…</button>
        <button id="pub-send" class="primary" disabled title="Publier (Ctrl+Entrée)">Publier</button>
      </div>
    </div>
    <div class="logbar">
      <select id="mq-topic-filter"><option value="">Tous les topics</option></select>
      <input id="mq-filter" type="text" placeholder="Filtrer le contenu…" />
      <label class="check"><input id="mq-autoscroll" type="checkbox" checked /> Défilement auto</label>
      <button id="mq-clear" class="ghost">Vider</button>
    </div>
    <div class="log" id="mq-log"></div>
  </section>
</div>
<div id="ask" class="backdrop hidden"><form class="modal" id="ask-form"><h3 id="ask-title">Nom</h3>
  <input id="ask-input" type="text" maxlength="80" /><div class="foot"><button type="button" id="ask-cancel">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form></div>
<div id="toast"></div>

<script>
const MODULE_ID = 'ws-mqtt-tester'
const call = (action, payload = {}, opts) => window.ledroide.call(MODULE_ID, action, payload, opts)
const $ = (s) => document.querySelector(s)
const $$ = (s) => [...document.querySelectorAll(s)]
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

const state = {
  tab: 'ws',
  status: { ws: null, mqtt: null, paho: true },
  log: { ws: [], mqtt: [] },
  saved: { ws: [], mqtt: [] },
  topicFilter: '',
  busy: { ws: false, mqtt: false },
}
const MAX_DOM = 2000

let toastTimer
function toast(msg, bad = false) {
  const t = $('#toast')
  t.textContent = msg
  t.className = 'show' + (bad ? ' bad' : '')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => (t.className = ''), bad ? 4500 : 2200)
}
const fmtTime = (ts) => { const d = new Date(ts * 1000); return d.toLocaleTimeString('fr-FR') + '.' + String(d.getMilliseconds()).padStart(3, '0') }
const fmtSize = (n) => n == null ? '' : n < 1024 ? `${n} o` : `${(n / 1024).toFixed(1)} Ko`

function setTab(tab) {
  state.tab = tab
  $$('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab))
  $$('[data-panel]').forEach((p) => p.classList.toggle('hidden', p.dataset.panel !== tab))
}

// ── Status ──────────────────────────────────────────────────────────────────
function renderStatus() {
  const { ws, mqtt, paho } = state.status
  $('#dot-ws').className = 'dot' + (ws ? ' on' : '')
  $('#dot-mqtt').className = 'dot' + (mqtt ? (mqtt.connected ? ' on' : ' warn') : '')
  $('#ws-connect').classList.toggle('hidden', !!ws)
  $('#ws-disconnect').classList.toggle('hidden', !ws)
  $('#ws-connect').disabled = state.busy.ws
  $('#ws-connect').innerHTML = state.busy.ws ? '<span class="spinner"></span> Connexion…' : 'Se connecter'
  $('#ws-send').disabled = $('#ws-ping').disabled = !ws
  $$('#ws-url, #ws-proto, #ws-headers, #ws-verify').forEach((el) => (el.disabled = !!ws))
  $('#ws-status').innerHTML = ws ? `<span class="dot on"></span>Connecté depuis ${new Date(ws.since * 1000).toLocaleTimeString('fr-FR')}${ws.subprotocol ? ` · sous-protocole <b>&nbsp;${esc(ws.subprotocol)}</b>` : ''}` : '<span class="dot"></span>Déconnecté'

  $('#paho-missing').classList.toggle('hidden', paho)
  $('#mq-connect').classList.toggle('hidden', !!mqtt)
  $('#mq-disconnect').classList.toggle('hidden', !mqtt)
  $('#mq-connect').disabled = state.busy.mqtt || !paho
  $('#mq-connect').innerHTML = state.busy.mqtt ? '<span class="spinner"></span> Connexion…' : 'Se connecter'
  $('#pub-send').disabled = $('#sub-add').disabled = !mqtt
  $$('#mq-host, #mq-port, #mq-tls, #mq-user, #mq-pass, #mq-cid, #mq-cid-gen, #mq-version, #mq-keepalive, #mq-verify').forEach((el) => (el.disabled = !!mqtt))
  $('#mq-status').innerHTML = mqtt
    ? `<span class="dot ${mqtt.connected ? 'on' : 'warn'}"></span>${mqtt.connected ? 'Connecté' : 'Reconnexion…'} à <b>&nbsp;${esc(mqtt.host)}:${mqtt.port}</b>&nbsp;(${esc(mqtt.client_id)})`
    : '<span class="dot"></span>Déconnecté'
  const subs = mqtt?.subs || []
  $('#subs').innerHTML = subs.length ? subs.map((s) => `<div class="li" data-topic="${esc(s.topic)}"><span class="lbl mono">${esc(s.topic)}</span><span class="qos">QoS ${s.qos}</span>
    <button class="ghost icon del" data-unsub title="Se désabonner">✕</button></div>`).join('') : `<div class="empty">${mqtt ? 'Aucun abonnement.' : 'Connectez-vous pour vous abonner.'}</div>`
}

async function refreshStatus() {
  try { state.status = await call('status'); renderStatus() } catch (e) { toast(e.message, true) }
}

// ── Log ─────────────────────────────────────────────────────────────────────
function entryHtml(e) {
  const dir = e.dir === 'in' ? '↓' : e.dir === 'out' ? '↑' : '•'
  const topic = e.topic ? `<span class="topic">${esc(e.topic)}</span>` : ''
  const tags = [e.binary ? 'binaire' : '', e.qos != null && e.dir !== 'sys' ? `QoS ${e.qos}` : '', e.retain ? 'retain' : '', e.truncated ? 'tronqué' : '']
    .filter(Boolean).map((t) => `<span class="tag">${t}</span>`).join('')
  const copy = e.dir === 'sys' ? '' : `<button class="ghost" data-copy="${e.id}" title="Copier">⧉</button><button class="ghost" data-reuse="${e.id}" title="Réutiliser dans l'éditeur">↺</button>`
  return `<div class="entry ${e.dir}" data-id="${e.id}"><span class="ts">${fmtTime(e.ts)}</span><span class="dir">${dir}</span>
    <span class="body">${topic}${esc(e.data)}${tags}</span><span class="meta">${fmtSize(e.size)}${copy}</span></div>`
}
function matches(kind, e) {
  const f = (kind === 'ws' ? $('#ws-filter') : $('#mq-filter')).value.toLowerCase()
  if (kind === 'mqtt' && state.topicFilter && e.topic !== state.topicFilter) return false
  return !f || e.data.toLowerCase().includes(f) || (e.topic || '').toLowerCase().includes(f)
}
function renderLog(kind) {
  const box = kind === 'ws' ? $('#ws-log') : $('#mq-log')
  const items = state.log[kind].filter((e) => matches(kind, e)).slice(-MAX_DOM)
  box.innerHTML = items.length ? items.map(entryHtml).join('')
    : `<div class="placeholder"><div class="big">${kind === 'ws' ? '🔌' : '📨'}</div><div>${state.log[kind].length ? 'Aucun message ne correspond au filtre.' : 'Le journal des messages entrants et sortants apparaîtra ici.'}</div>
       <div><kbd>Ctrl</kbd> + <kbd>Entrée</kbd> pour ${kind === 'ws' ? 'envoyer' : 'publier'}</div></div>`
  if ((kind === 'ws' ? $('#ws-autoscroll') : $('#mq-autoscroll')).checked) box.scrollTop = box.scrollHeight
  if (kind === 'mqtt') renderTopics()
}
function appendLog(e) {
  const kind = e.kind
  state.log[kind].push(e)
  if (state.log[kind].length > 10000) state.log[kind].splice(0, state.log[kind].length - 10000)
  const box = kind === 'ws' ? $('#ws-log') : $('#mq-log')
  if (!matches(kind, e)) { if (kind === 'mqtt') renderTopics(); return }
  if (box.querySelector('.placeholder')) box.innerHTML = ''
  box.insertAdjacentHTML('beforeend', entryHtml(e))
  while (box.children.length > MAX_DOM) box.firstElementChild.remove()
  if ((kind === 'ws' ? $('#ws-autoscroll') : $('#mq-autoscroll')).checked) box.scrollTop = box.scrollHeight
  if (kind === 'mqtt') renderTopics()
}
function renderTopics() {
  const counts = new Map()
  state.log.mqtt.forEach((e) => { if (e.topic && e.dir === 'in') counts.set(e.topic, (counts.get(e.topic) || 0) + 1) })
  const topics = [...counts.keys()].sort()
  $('#topics').innerHTML = topics.length ? topics.map((t) => `<div class="li ${state.topicFilter === t ? 'active' : ''}" data-tf="${esc(t)}"><span class="lbl mono">${esc(t)}</span><span class="sub">${counts.get(t)}</span></div>`).join('')
    : '<div class="empty">Aucun message reçu.</div>'
  const sel = $('#mq-topic-filter')
  const cur = state.topicFilter
  sel.innerHTML = '<option value="">Tous les topics</option>' + topics.map((t) => `<option value="${esc(t)}">${esc(t)} (${counts.get(t)})</option>`).join('')
  sel.value = cur
}
function logClick(kind) {
  return async (ev) => {
    const btn = ev.target.closest('[data-copy],[data-reuse]')
    if (!btn) return
    const e = state.log[kind].find((x) => String(x.id) === (btn.dataset.copy || btn.dataset.reuse))
    if (!e) return
    if (btn.dataset.copy) {
      try { await navigator.clipboard.writeText(e.data); toast('Copié') } catch { toast('Copie impossible', true) }
    } else if (kind === 'ws') {
      $('#ws-msg').value = e.data; $('#ws-mode').value = e.binary ? 'hex' : 'text'; $('#ws-msg').focus()
    } else {
      $('#pub-msg').value = e.data; if (e.topic) $('#pub-topic').value = e.topic; $('#pub-msg').focus()
    }
  }
}

// ── WebSocket actions ───────────────────────────────────────────────────────
function parseHeaders(text) {
  return text.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
    const i = l.indexOf(':')
    return i > 0 ? { key: l.slice(0, i).trim(), value: l.slice(i + 1).trim() } : { key: l, value: '' }
  })
}
function wsSettings() {
  return { url: $('#ws-url').value.trim(), subprotocols: $('#ws-proto').value.trim(), headers_text: $('#ws-headers').value, verify_ssl: $('#ws-verify').checked }
}
async function wsConnect() {
  const s = wsSettings()
  if (!s.url) return toast("Saisissez l'URL du serveur WebSocket", true)
  if (!/^wss?:\/\//i.test(s.url)) return toast("L'URL doit commencer par ws:// ou wss://", true)
  state.busy.ws = true; renderStatus()
  try {
    state.status = await call('ws_connect', { url: s.url, subprotocols: s.subprotocols, headers: parseHeaders(s.headers_text), verify_ssl: s.verify_ssl, timeout: 15 }, { timeout: 25000 })
    saveSettings()
    $('#ws-msg').focus()
  } catch (e) { toast(e.message, true) }
  state.busy.ws = false; renderStatus()
}
async function wsSend() {
  if (!state.status.ws) return
  const text = $('#ws-msg').value
  if (!text) return toast('Message vide', true)
  try { await call('ws_send', { text, mode: $('#ws-mode').value }) } catch (e) { toast(e.message, true) }
}

// ── MQTT actions ────────────────────────────────────────────────────────────
function mqttSettings() {
  return { host: $('#mq-host').value.trim(), port: Number($('#mq-port').value) || 1883, tls: $('#mq-tls').checked, username: $('#mq-user').value,
    client_id: $('#mq-cid').value.trim(), version: $('#mq-version').value, keepalive: Number($('#mq-keepalive').value) || 60, verify_ssl: $('#mq-verify').checked }
}
async function mqttConnect() {
  const s = mqttSettings()
  if (!s.host) return toast("Saisissez l'adresse du broker", true)
  state.busy.mqtt = true; renderStatus()
  try {
    state.status = await call('mqtt_connect', { ...s, password: $('#mq-pass').value, timeout: 15 }, { timeout: 40000 })
    saveSettings()
  } catch (e) { toast(e.message, true) }
  state.busy.mqtt = false; renderStatus()
}
async function subscribe() {
  const topic = $('#sub-topic').value.trim()
  if (!topic) return toast('Saisissez un topic', true)
  try {
    const r = await call('mqtt_subscribe', { topic, qos: Number($('#sub-qos').value) }, { timeout: 15000 })
    $('#sub-topic').value = ''
    toast(`Abonné à ${r.topic}`)
  } catch (e) { toast(e.message, true) }
}
async function publish() {
  if (!state.status.mqtt) return
  const topic = $('#pub-topic').value.trim()
  if (!topic) return toast('Saisissez le topic de publication', true)
  try {
    await call('mqtt_publish', { topic, payload: $('#pub-msg').value, qos: Number($('#pub-qos').value), retain: $('#pub-retain').checked, mode: $('#pub-mode').value }, { timeout: 15000 })
  } catch (e) { toast(e.message, true) }
}

// ── Saved messages ──────────────────────────────────────────────────────────
function renderSaved(kind) {
  const box = kind === 'ws' ? $('#ws-saved') : $('#mq-saved')
  const items = state.saved[kind]
  box.innerHTML = items.length ? items.map((s) => `<div class="li" data-sid="${s._id}" title="Cliquer pour charger dans l'éditeur">
      <span class="lbl">${esc(s.name)}</span><span class="sub">${kind === 'mqtt' ? esc(s.topic) : esc(s.mode)}</span>
      <button class="ghost icon del" data-sdel="${s._id}" title="Supprimer">✕</button></div>`).join('')
    : '<div class="empty">Aucun message enregistré. Utilisez « Enregistrer… » pour réutiliser un message.</div>'
}
async function loadSaved(kind) {
  try { state.saved[kind] = (await call('saved_list', { kind })).items; renderSaved(kind) } catch (e) { toast(e.message, true) }
}
async function saveMessage(kind) {
  const text = kind === 'ws' ? $('#ws-msg').value : $('#pub-msg').value
  if (!text) return toast('Message vide', true)
  const name = await askName('Nom du message enregistré')
  if (!name || !name.trim()) return
  const payload = kind === 'ws' ? { kind, name, text, mode: $('#ws-mode').value }
    : { kind, name, text, mode: $('#pub-mode').value, topic: $('#pub-topic').value.trim(), qos: Number($('#pub-qos').value), retain: $('#pub-retain').checked }
  try { await call('saved_save', payload); toast('Message enregistré'); loadSaved(kind) } catch (e) { toast(e.message, true) }
}
function askName(title) {
  return new Promise((resolve) => {
    $('#ask-title').textContent = title
    $('#ask-input').value = ''
    $('#ask').classList.remove('hidden')
    $('#ask-input').focus()
    const done = (v) => { $('#ask').classList.add('hidden'); $('#ask-form').onsubmit = null; $('#ask-cancel').onclick = null; resolve(v) }
    $('#ask-form').onsubmit = (e) => { e.preventDefault(); done($('#ask-input').value) }
    $('#ask-cancel').onclick = () => done(null)
    $('#ask-input').onkeydown = (e) => { if (e.key === 'Escape') done(null) }
  })
}
function savedClick(kind) {
  return async (ev) => {
    const del = ev.target.closest('[data-sdel]')
    if (del) {
      ev.stopPropagation()
      const s = state.saved[kind].find((x) => x._id === del.dataset.sdel)
      if (!confirm(`Supprimer le message « ${s?.name} » ?`)) return
      try { await call('saved_delete', { id: del.dataset.sdel }); loadSaved(kind) } catch (e) { toast(e.message, true) }
      return
    }
    const li = ev.target.closest('[data-sid]')
    if (!li) return
    const s = state.saved[kind].find((x) => x._id === li.dataset.sid)
    if (!s) return
    if (kind === 'ws') { $('#ws-msg').value = s.text; $('#ws-mode').value = s.mode || 'text'; $('#ws-msg').focus() }
    else {
      $('#pub-msg').value = s.text; $('#pub-mode').value = s.mode === 'json' ? 'json' : 'text'
      $('#pub-topic').value = s.topic || ''; $('#pub-qos').value = String(s.qos || 0); $('#pub-retain').checked = !!s.retain
    }
  }
}

function formatJson(sel, modeSel) {
  try { $(sel).value = JSON.stringify(JSON.parse($(sel).value), null, 2); $(modeSel).value = 'json' } catch (e) { toast('JSON invalide : ' + e.message, true) }
}

// ── Settings (no password) ──────────────────────────────────────────────────
let saveTimer
function saveSettings() {
  clearTimeout(saveTimer)
  saveTimer = setTimeout(() => call('settings_save', { ws: wsSettings(), mqtt: mqttSettings() }).catch(() => {}), 400)
}
async function loadSettings() {
  try {
    const s = await call('settings_get')
    const w = s.ws || {}, m = s.mqtt || {}
    if (w.url) $('#ws-url').value = w.url
    if (w.subprotocols) $('#ws-proto').value = w.subprotocols
    if (w.headers_text) $('#ws-headers').value = w.headers_text
    if (w.verify_ssl === false) $('#ws-verify').checked = false
    if (m.host) $('#mq-host').value = m.host
    if (m.port) $('#mq-port').value = m.port
    $('#mq-tls').checked = !!m.tls
    if (m.username) $('#mq-user').value = m.username
    if (m.client_id) $('#mq-cid').value = m.client_id
    if (m.version) $('#mq-version').value = m.version
    if (m.keepalive) $('#mq-keepalive').value = m.keepalive
    if (m.verify_ssl === false) $('#mq-verify').checked = false
  } catch { /* first run */ }
}

// ── Wiring ──────────────────────────────────────────────────────────────────
$$('.tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)))
$('#ws-connect').addEventListener('click', wsConnect)
$('#ws-disconnect').addEventListener('click', async () => { try { await call('ws_disconnect') } catch (e) { toast(e.message, true) } refreshStatus() })
$('#ws-send').addEventListener('click', wsSend)
$('#ws-ping').addEventListener('click', async () => { try { const r = await call('ws_ping', {}, { timeout: 15000 }); toast(`Pong en ${r.latency_ms} ms`) } catch (e) { toast(e.message, true) } })
$('#ws-format').addEventListener('click', () => formatJson('#ws-msg', '#ws-mode'))
$('#ws-save').addEventListener('click', () => saveMessage('ws'))
$('#ws-clear').addEventListener('click', async () => { await call('log_clear', { kind: 'ws' }).catch(() => {}); state.log.ws = []; renderLog('ws') })
$('#ws-filter').addEventListener('input', () => renderLog('ws'))
$('#ws-log').addEventListener('click', logClick('ws'))
$('#ws-saved').addEventListener('click', savedClick('ws'))
$('#ws-url').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !state.status.ws) wsConnect() })

$('#mq-tls').addEventListener('change', () => {
  const p = $('#mq-port')
  if ($('#mq-tls').checked && p.value === '1883') p.value = '8883'
  if (!$('#mq-tls').checked && p.value === '8883') p.value = '1883'
})
$('#mq-cid-gen').addEventListener('click', () => ($('#mq-cid').value = 'ledroide-' + Math.random().toString(16).slice(2, 10)))
$('#mq-connect').addEventListener('click', mqttConnect)
$('#mq-disconnect').addEventListener('click', async () => { try { await call('mqtt_disconnect', {}, { timeout: 15000 }) } catch (e) { toast(e.message, true) } refreshStatus() })
$('#sub-add').addEventListener('click', subscribe)
$('#sub-topic').addEventListener('keydown', (e) => { if (e.key === 'Enter') subscribe() })
$('#subs').addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-unsub]')
  if (!b) return
  try { await call('mqtt_unsubscribe', { topic: b.closest('[data-topic]').dataset.topic }, { timeout: 15000 }) } catch (e) { toast(e.message, true) }
})
$('#topics').addEventListener('click', (ev) => {
  const li = ev.target.closest('[data-tf]')
  if (!li) return
  state.topicFilter = state.topicFilter === li.dataset.tf ? '' : li.dataset.tf
  renderLog('mqtt')
})
$('#mq-topic-filter').addEventListener('change', () => { state.topicFilter = $('#mq-topic-filter').value; renderLog('mqtt') })
$('#pub-send').addEventListener('click', publish)
$('#pub-format').addEventListener('click', () => formatJson('#pub-msg', '#pub-mode'))
$('#pub-save').addEventListener('click', () => saveMessage('mqtt'))
$('#mq-clear').addEventListener('click', async () => { await call('log_clear', { kind: 'mqtt' }).catch(() => {}); state.log.mqtt = []; state.topicFilter = ''; renderLog('mqtt') })
$('#mq-filter').addEventListener('input', () => renderLog('mqtt'))
$('#mq-log').addEventListener('click', logClick('mqtt'))
$('#mq-saved').addEventListener('click', savedClick('mqtt'))

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); state.tab === 'ws' ? wsSend() : publish() }
})

window.ledroide.on(MODULE_ID, 'log', appendLog)
window.ledroide.on(MODULE_ID, 'status', (s) => { state.status = s; renderStatus() })

async function init() {
  renderStatus(); renderLog('ws'); renderLog('mqtt')
  await loadSettings()
  await refreshStatus()
  try {
    const items = (await call('log_get')).items
    state.log.ws = items.filter((e) => e.kind === 'ws')
    state.log.mqtt = items.filter((e) => e.kind === 'mqtt')
    renderLog('ws'); renderLog('mqtt')
  } catch (e) { toast(e.message, true) }
  loadSaved('ws'); loadSaved('mqtt')
}
init()
</script>
</body>
</html>
