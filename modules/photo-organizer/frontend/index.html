<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organiseur de photos</title>
<script src="/ledroide-bridge.js"></script>
<style>
  :root {
    --bg: #0f0f12; --surface: #18181b; --surface2: #1f1f23; --border: #27272a; --line: #1d1d21;
    --text: #e2e2e8; --muted: #71717a; --accent: #6366f1; --accent-h: #818cf8;
    --ok: #22c55e; --err: #ef4444; --warn: #f59e0b; --tile: 150px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
         font-size: 13px; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
  button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
           padding: 5px 10px; font: inherit; cursor: pointer; transition: .12s; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: #3f3f46; background: #26262b; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button.danger { color: #fca5a5; }
  button.danger:hover:not(:disabled) { border-color: rgba(239,68,68,.5); }
  button.icon { padding: 5px 8px; min-width: 30px; }
  input, select, textarea { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 8px; font: inherit; outline: none; user-select: text; }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=checkbox], input[type=range], input[type=radio] { accent-color: var(--accent); }
  .hidden { display: none !important; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  header { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border);
           background: var(--surface); flex-shrink: 0; flex-wrap: wrap; }
  header .title { font-weight: 600; font-size: 14px; margin-right: 6px; }
  #folderSel { max-width: 260px; }
  #indexBar { display: flex; align-items: center; gap: 8px; min-width: 220px; }
  .progressbar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; flex: 1; min-width: 80px; }
  .progressbar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

  #main { flex: 1; min-height: 0; display: flex; }
  #nav { width: 190px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 10px 8px; overflow-y: auto; }
  #nav h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 8px 6px; }
  .nv { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; color: #c4c4cc; }
  .nv:hover { background: var(--surface2); }
  .nv.sel { background: rgba(99,102,241,.18); color: #fff; }
  .nv .n { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  #navStats { margin: 16px 8px 0; color: var(--muted); font-size: 11.5px; line-height: 1.7; }

  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 44px; flex-wrap: wrap; }
  .crumb { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; }
  .crumb a { color: var(--accent-h); cursor: pointer; font-weight: 500; }
  .crumb a:hover { text-decoration: underline; }
  #view { flex: 1; overflow-y: auto; padding: 14px; position: relative; }
  #selBar { background: rgba(99,102,241,.12); border-bottom: 1px solid rgba(99,102,241,.35); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 8px; }
  .ph { position: relative; aspect-ratio: 1; background: var(--surface2); border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .ph:hover img { transform: scale(1.03); }
  .ph .ck { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85);
            background: rgba(0,0,0,.35); opacity: 0; transition: .1s; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .ph:hover .ck, .grid.selecting .ph .ck { opacity: 1; }
  .ph.sel { border-color: var(--accent); }
  .ph.sel .ck { opacity: 1; background: var(--accent); border-color: var(--accent); }
  .ph.sel .ck::after { content: '✓'; }
  .ph .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px; background: linear-gradient(transparent, rgba(0,0,0,.75));
             font-size: 11px; color: #e4e4e7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: .15s; }
  .ph:hover .cap { opacity: 1; }
  .ph .gps { position: absolute; top: 6px; right: 6px; font-size: 12px; filter: drop-shadow(0 1px 2px #000); }
  .dayhead { grid-column: 1 / -1; font-weight: 600; color: #c4c4cc; margin: 10px 0 2px; font-size: 12.5px; }
  .dayhead:first-child { margin-top: 0; }
  #more { text-align: center; padding: 16px; color: var(--muted); }

  .year { margin-bottom: 22px; }
  .year h3 { font-size: 18px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; }
  .year h3 span { font-size: 12px; color: var(--muted); font-weight: 400; }
  .year h3 a { font-size: 12px; color: var(--accent-h); cursor: pointer; font-weight: 500; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tile { position: relative; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--surface2); border: 1px solid var(--border); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .85; transition: .2s; }
  .tile:hover img { opacity: 1; transform: scale(1.04); }
  .tile .lbl { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .tile .lbl b { display: block; font-size: 14px; text-transform: capitalize; }
  .tile .lbl span { font-size: 11.5px; color: #d4d4d8; }
  .tile .noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 34px; }

  .cluster { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .cluster:hover { border-color: #3f3f46; }
  .cluster .thumbs { display: flex; gap: 4px; flex-shrink: 0; }
  .cluster .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
  .cluster .meta { flex: 1; min-width: 0; line-height: 1.6; }
  .cluster .meta b { font-size: 13.5px; }
  .cluster .count { font-size: 20px; font-weight: 700; color: var(--accent-h); padding: 0 10px; }
  table.coords { width: 100%; border-collapse: collapse; }
  table.coords th, table.coords td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.coords th { color: var(--muted); font-weight: 500; font-size: 11.5px; position: sticky; top: -14px; background: var(--bg); }
  table.coords tr:hover td { background: var(--surface); }
  table.coords img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; vertical-align: middle; }

  .dgroup { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .dgroup .h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
  .dgroup .items { display: flex; gap: 10px; flex-wrap: wrap; }
  .ditem { width: 170px; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface2); position: relative; }
  .ditem.keep { border-color: rgba(34,197,94,.7); }
  .ditem.trash { border-color: rgba(239,68,68,.7); }
  .ditem img { width: 100%; height: 120px; object-fit: cover; display: block; cursor: zoom-in; }
  .ditem .info { padding: 6px 8px; font-size: 11.5px; line-height: 1.45; }
  .ditem .info .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .ditem .info .p { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .ditem label { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-top: 1px solid var(--border); cursor: pointer; font-size: 12px; }
  .ditem .tag { position: absolute; top: 6px; left: 6px; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: rgba(34,197,94,.85); color: #fff; font-weight: 600; }

  .empty { max-width: 460px; margin: 60px auto; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 32px; }
  .empty h2 { font-size: 17px; margin-bottom: 8px; }
  .empty p { color: var(--muted); line-height: 1.5; margin-bottom: 16px; }

  #viewer { position: fixed; inset: 0; background: rgba(5,5,7,.96); z-index: 55; display: flex; }
  #viewer .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; }
  #viewer .stage img { max-width: calc(100% - 100px); max-height: calc(100% - 40px); object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #viewer .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); font-size: 26px; background: rgba(255,255,255,.06); border: none; width: 44px; height: 64px; }
  #viewer .nav-btn.l { left: 10px; } #viewer .nav-btn.r { right: 10px; }
  #viewer .close { position: absolute; top: 10px; right: 10px; z-index: 2; }
  #viewer aside { width: 300px; background: var(--surface); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; user-select: text; }
  #viewer aside h3 { font-size: 14px; word-break: break-all; margin-bottom: 12px; padding-right: 30px; }
  dl.kv { display: grid; grid-template-columns: 100px 1fr; gap: 6px 10px; font-size: 12.5px; }
  dl.kv dt { color: var(--muted); } dl.kv dd { word-break: break-word; }
  #viewer .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: min(640px, calc(100vw - 32px));
            max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .dialog.wide { width: min(820px, calc(100vw - 32px)); }
  .dialog h3 { font-size: 15px; padding: 14px 18px 10px; }
  .dialog .content { padding: 0 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .dialog .foot { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); margin-top: 14px; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { font-size: 11.5px; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 11.5px; padding: 3px 7px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--border); cursor: pointer; font-family: ui-monospace, Consolas, monospace; }
  .chip:hover { border-color: var(--accent); }
  .note { color: var(--muted); font-size: 11.5px; line-height: 1.45; }
  .ptable { border: 1px solid var(--border); border-radius: 8px; max-height: 300px; overflow: auto; }
  .ptable table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ptable td, .ptable th { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .ptable th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
  .ptable td.arrow { color: var(--muted); width: 20px; }
  .ptable tr.same td { color: var(--muted); }
  .ptable td.new { color: #a5b4fc; }
  .flist { display: flex; flex-direction: column; gap: 6px; }
  .fitem { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); }
  .fitem .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fitem .s { color: var(--muted); font-size: 11.5px; }
  .op { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .op .l { flex: 1; } .op .d { color: var(--muted); font-size: 11.5px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--surface2); color: var(--text); }

  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: #27272a;
           border: 1px solid #3f3f46; border-radius: 8px; padding: 8px 14px; transition: .2s; z-index: 100; max-width: 80vw; display: flex; gap: 12px; align-items: center; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  #toast.bad { border-color: rgba(239,68,68,.6); color: #fecaca; }
  #toast button { padding: 3px 8px; }
</style>
</head>
<body>

<header>
  <span class="title">🗂️ Organiseur de photos</span>
  <select id="folderSel" title="Dossier"></select>
  <button id="btnFolders" title="Gérer les dossiers indexés">📁 Dossiers…</button>
  <button id="btnIndex" title="Ré-indexer (nouvelles photos, modifications, suppressions)">🔄 Indexer</button>
  <div id="indexBar" class="hidden"><div class="progressbar"><i></i></div><span class="muted" id="indexMsg" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="icon" id="btnCancelIndex" title="Arrêter">✕</button></div>
  <span class="spacer"></span>
  <input id="q" placeholder="Nom de fichier, appareil…" style="width:200px">
  <button id="btnHistory" title="Historique des renommages et rangements (annulation)">↶ Historique</button>
</header>

<div id="main">
  <nav id="nav">
    <div class="nv sel" data-v="all">🖼️ Toutes les photos<span class="n" id="nAll"></span></div>
    <div class="nv" data-v="dates">📅 Par date</div>
    <div class="nv" data-v="cameras">📷 Par appareil<span class="n" id="nCam"></span></div>
    <div class="nv" data-v="places">📍 Par lieu<span class="n" id="nGps"></span></div>
    <h4>Nettoyage</h4>
    <div class="nv" data-v="exact">🧬 Doublons exacts</div>
    <div class="nv" data-v="similar">👯 Photos similaires</div>
    <div id="navStats"></div>
  </nav>
  <section id="content">
    <div class="bar" id="topBar"></div>
    <div class="bar hidden" id="selBar">
      <b id="selCount"></b>
      <button id="btnSelAll">Tout sélectionner</button>
      <button id="btnSelNone">Désélectionner</button>
      <span class="spacer"></span>
      <button id="btnRename">✏️ Renommer…</button>
      <button id="btnSort">📂 Ranger…</button>
      <button class="danger" id="btnTrash">🗑 Corbeille</button>
    </div>
    <div id="view"></div>
  </section>
</div>

<div id="viewer" class="hidden">
  <div class="stage">
    <button class="nav-btn l" id="vPrev" title="Précédente (←)">‹</button>
    <img id="vImg" alt="">
    <button class="nav-btn r" id="vNext" title="Suivante (→)">›</button>
  </div>
  <aside><button class="icon close" id="vClose" title="Fermer (Échap)">✕</button><div id="vInfo"></div></aside>
</div>
<div id="toast"></div>

<script>
const MODULE_ID = 'photo-organizer'
const BASE = `/modules/${MODULE_ID}/api`
const call = (action, payload = {}, opts) => window.ledroide.call(MODULE_ID, action, payload, opts)
const run = (action, payload, onProgress) => window.ledroide.run(MODULE_ID, action, payload, { onProgress })
const $ = (s, root = document) => root.querySelector(s)
const $$ = (s, root = document) => [...root.querySelectorAll(s)]
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre']
const PAGE = 240
const thumb = (id) => `${BASE}/thumb/${id}`
function localGet(k, d = null) { try { return localStorage.getItem(k) ?? d } catch { return d } }
function localSet(k, v) { try { localStorage.setItem(k, v) } catch {} }
function bytes(n) { if (n < 1024) return n + ' o'; const u = ['Ko', 'Mo', 'Go', 'To']; let i = -1; do { n /= 1024; i++ } while (n >= 1024 && i < 3); return n.toFixed(n < 10 ? 1 : 0).replace('.', ',') + ' ' + u[i] }
function fmtDate(iso, withTime = true) {
  if (!iso) return '—'
  const d = new Date(iso)
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + (withTime ? ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '')
}
function coord(v, pos, neg) { return `${Math.abs(v).toFixed(5)}° ${v >= 0 ? pos : neg}` }

let toastTimer
function toast(msg, bad = false, action = null) {
  const t = $('#toast')
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toastAct">${esc(action.label)}</button>` : '')
  t.className = 'show' + (bad ? ' bad' : '')
  if (action) $('#toastAct').onclick = () => { t.className = ''; action.run() }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), action ? 9000 : bad ? 5000 : 2600)
}
async function act(action, payload, okMsg, opts) {
  try { const r = await call(action, payload, opts); if (okMsg) toast(okMsg); return r }
  catch (e) { toast(e.message || String(e), true); return null }
}
function dialog(html, cls = '') {
  const ov = document.createElement('div')
  ov.className = 'overlay'
  ov.innerHTML = `<div class="dialog ${cls}">${html}</div>`
  document.body.appendChild(ov)
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) ov.remove() })
  ov.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); ov.remove() } })
  setTimeout(() => ov.querySelector('input:not([type=checkbox]):not([type=radio])')?.focus(), 30)
  return ov
}

const S = { view: 'all', folders: [], stats: null, folderId: +localGet('po-folder', 0) || 0, q: '', sort: localGet('po-sort', 'taken_desc'),
  filter: {}, crumb: [], photos: [], total: 0, loading: false, sel: new Set(), lastClick: null, precision: localGet('po-prec', '10'),
  placeMode: 'clusters', dup: null, simAlgo: localGet('po-algo', 'dhash'), simThr: +localGet('po-thr', 6), indexJob: null }

// ── Data ──
async function loadFolders() {
  const r = await act('folders.list'); if (!r) return
  S.folders = r.folders
  if (S.folderId && !S.folders.some((f) => f.id === S.folderId)) S.folderId = 0
  $('#folderSel').innerHTML = `<option value="0">Tous les dossiers</option>` + S.folders.map((f) => `<option value="${f.id}">${esc(f.path)} (${f.count})</option>`).join('')
  $('#folderSel').value = S.folderId
}
async function loadStats() {
  const r = await act('stats', { folder_id: S.folderId }); if (!r) return
  S.stats = r
  $('#nAll').textContent = r.total; $('#nCam').textContent = r.cameras.length || ''; $('#nGps').textContent = r.gps || ''
  $('#navStats').innerHTML = r.total ? `${r.total} photo(s) · ${bytes(r.bytes)}<br>${r.dated} datée(s) par l'EXIF<br>${r.gps} géolocalisée(s)` : ''
}
async function refreshAll() { await loadFolders(); await loadStats(); render() }
const base = () => ({ folder_id: S.folderId, q: S.q, sort: S.sort, ...S.filter })

// ── Views ──
function setView(v, filter = {}, crumb = []) {
  S.view = v; S.filter = filter; S.crumb = crumb; S.sel.clear()
  $$('.nv').forEach((n) => n.classList.toggle('sel', n.dataset.v === (crumb.length ? crumb[0].view : v)))
  render()
}
function render() {
  updateSelBar()
  const v = S.view
  if (!S.folders.length) return renderWelcome()
  if (v === 'grid' || v === 'all') return renderGrid()
  if (v === 'dates') return renderDates()
  if (v === 'cameras') return renderCameras()
  if (v === 'places') return renderPlaces()
  if (v === 'exact' || v === 'similar') return renderDup()
}
function renderWelcome() {
  $('#topBar').innerHTML = '<div class="crumb">Bienvenue</div>'
  $('#view').innerHTML = `<div class="empty"><h2>Aucun dossier indexé</h2><p>Ajoutez un dossier de photos : le module lit les dates de prise de vue, les appareils et les positions GPS, crée des miniatures et vous permet de trier, renommer et dédoublonner.</p>
    <button class="primary" id="wAdd">📁 Ajouter un dossier…</button></div>`
  $('#wAdd').onclick = foldersDialog
}
function crumbHtml(title) {
  return `<div class="crumb">${S.crumb.map((c, i) => `<a data-c="${i}">${esc(c.label)}</a> ›`).join(' ')} ${esc(title)}</div>`
}
function bindCrumb() {
  $$('.crumb a').forEach((a) => a.onclick = () => { const c = S.crumb[+a.dataset.c]; setView(c.view, c.filter || {}, S.crumb.slice(0, +a.dataset.c)) })

async function renderGrid(append = false) {
  if (!append) {
    const title = S.view === 'all' ? 'Toutes les photos' : S.filterTitle || 'Photos'
    $('#topBar').innerHTML = crumbHtml(title) + `<span class="muted" id="gCount"></span><span class="spacer"></span>
      <select id="gGps"><option value="">Avec et sans GPS</option><option value="with">Avec GPS</option><option value="without">Sans GPS</option></select>
      <select id="gSort"><option value="taken_desc">Plus récentes</option><option value="taken_asc">Plus anciennes</option><option value="name">Nom</option><option value="size_desc">Taille</option><option value="added">Ajout</option></select>
      <button id="gSelAll" title="Sélectionner toutes les photos affichées (Ctrl+A)">☑ Tout sélectionner</button>
      <input type="range" id="gZoom" min="90" max="320" value="${localGet('po-tile', 150)}" title="Taille des vignettes" style="width:100px">`
    bindCrumb()
    $('#gSort').value = S.sort; $('#gGps').value = S.filter.gps || ''
    $('#gSort').onchange = (e) => { S.sort = e.target.value; localSet('po-sort', S.sort); renderGrid() }
    $('#gGps').onchange = (e) => { S.filter = { ...S.filter, gps: e.target.value || undefined }; renderGrid() }
    $('#gSelAll').onclick = () => $('#btnSelAll').click()
    $('#gZoom').oninput = (e) => { document.documentElement.style.setProperty('--tile', e.target.value + 'px'); localSet('po-tile', e.target.value) }
    $('#view').innerHTML = '<div class="grid" id="grid"></div><div id="more"></div>'
    $('#view').scrollTop = 0
    S.photos = []
  }
  if (S.loading) return
  S.loading = true
  const r = await act('photos.list', { ...base(), offset: S.photos.length, limit: PAGE })
  S.loading = false
  if (!r) return
  const start = S.photos.length
  S.photos.push(...r.photos); S.total = r.total
  $('#gCount').textContent = `${r.total} photo(s) · ${bytes(r.bytes)}`
  const byDate = S.sort.startsWith('taken')
  let html = '', prev = start ? (S.photos[start - 1].taken || '').slice(0, 10) : null
  r.photos.forEach((p, k) => {
    const day = (p.taken || '').slice(0, 10)
    if (byDate && day !== prev) { html += `<div class="dayhead">${day ? fmtDate(day, false) : 'Sans date'}</div>`; prev = day }
    html += tileHtml(p, start + k)
  })
  $('#grid').insertAdjacentHTML('beforeend', html)
  $('#grid').classList.toggle('selecting', S.sel.size > 0)
  $('#more').textContent = S.photos.length < S.total ? 'Défilez pour charger la suite…' : (S.total ? '' : 'Aucune photo ne correspond.')
}
function tileHtml(p, idx) {
  return `<div class="ph ${S.sel.has(p.id) ? 'sel' : ''}" data-id="${p.id}" data-idx="${idx}" title="${esc(p.name)}\n${fmtDate(p.taken)}${p.camera ? '\n' + esc(p.camera) : ''}">
    <img src="${thumb(p.id)}" loading="lazy" alt="" draggable="false"><span class="ck"></span>${p.lat != null ? '<span class="gps">📍</span>' : ''}<div class="cap">${esc(p.name)}</div></div>`
}
$('#view').addEventListener('scroll', () => {
  const v = $('#view')
  if ((S.view === 'all' || S.view === 'grid') && S.photos.length < S.total && v.scrollTop + v.clientHeight > v.scrollHeight - 600) renderGrid(true)
})
$('#view').addEventListener('click', (e) => {
  const ph = e.target.closest('.ph'); if (!ph) return
  const id = +ph.dataset.id, idx = +ph.dataset.idx
  if (e.target.closest('.ck') || e.ctrlKey || e.metaKey || e.shiftKey || S.sel.size) {
    if (e.shiftKey && S.lastClick != null) {
      const [a, b] = [Math.min(S.lastClick, idx), Math.max(S.lastClick, idx)]
      for (let i = a; i <= b; i++) S.sel.add(S.photos[i].id)
    } else if (S.sel.has(id)) S.sel.delete(id)
    else S.sel.add(id)
    S.lastClick = idx
    $$('.ph').forEach((el) => el.classList.toggle('sel', S.sel.has(+el.dataset.id)))
    $('#grid')?.classList.toggle('selecting', S.sel.size > 0)
    updateSelBar(); return
  }
  openViewer(S.photos, idx)
})
function updateSelBar() {
  const n = S.sel.size
  $('#selBar').classList.toggle('hidden', !n || !(S.view === 'all' || S.view === 'grid'))
  $('#selCount').textContent = `${n} sélectionnée(s)`
}
$('#btnSelAll').onclick = async () => {
  const r = await act('photos.ids', base()); if (!r) return
  r.ids.forEach((i) => S.sel.add(i)); $$('.ph').forEach((el) => el.classList.add('sel')); $('#grid')?.classList.add('selecting'); updateSelBar()

$('#btnSelNone').onclick = () => { S.sel.clear(); $$('.ph').forEach((el) => el.classList.remove('sel')); $('#grid')?.classList.remove('selecting'); updateSelBar() }

async function renderPlaces() {

    <div class="seg" id="pMode"><button data-m="clusters">Regroupements</button><button data-m="coords">Coordonnées</button></div>

  $$('#pPrec button').forEach((b) => { b.classList.toggle('on', b.dataset.p === S.precision); b.onclick = () => { S.precision = b.dataset.p; localSet('po-prec', S.precision); renderPlaces() } })
  $$('#pMode button').forEach((b) => { b.classList.toggle('on', b.dataset.m === S.placeMode); b.onclick = () => { S.placeMode = b.dataset.m; renderPlaces() } })
  $('#pPrec').classList.toggle('hidden', S.placeMode !== 'clusters')
  if (S.placeMode === 'coords') {

      ${r.photos.map((p, i) => `<tr data-i="${i}" style="cursor:pointer"><td><img src="${thumb(p.id)}" alt="" loading="lazy"></td><td>${esc(p.name)}</td><td>${fmtDate(p.taken)}</td>
      <td class="mono">${coord(p.lat, 'N', 'S')}</td><td class="mono">${coord(p.lon, 'E', 'O')}</td><td class="mono" style="user-select:text">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</td></tr>`).join('')}</tbody></table>
      ${r.total > r.photos.length ? `<div class="note" style="padding:10px">${r.total - r.photos.length} autres non affichées.</div>` : ''}` : noGps()
    $$('table.coords tr[data-i]').forEach((tr) => tr.onclick = (e) => { if (!e.target.closest('td.mono:last-child')) openViewer(r.photos, +tr.dataset.i) })

function noGps() { return '<div class="empty"><h2>Aucune photo géolocalisée</h2><p>Les positions sont lues dans les données GPS de l\'EXIF (smartphones, appareils avec GPS).</p></div>' }

// ── Duplicates ──
function renderDup() {
  const exact = S.view === 'exact'
  $('#topBar').innerHTML = `<div class="crumb">${exact ? 'Doublons exacts' : 'Photos similaires'}</div><span class="muted">${exact ? 'Fichiers identiques (SHA-256)' : 'Images visuellement proches'}</span>
    <span class="spacer"></span>${exact ? '' : `<select id="dAlgo"><option value="dhash">dHash (gradient)</option><option value="phash">pHash (DCT)</option></select>
    <span class="muted">Seuil</span><input type="range" id="dThr" min="0" max="20" value="${S.simThr}" style="width:110px"><b id="dThrV" style="min-width:20px">${S.simThr}</b>`}
    <button class="primary" id="dRun">${S.dup?.view === S.view ? 'Relancer' : 'Rechercher'}</button>`
  if (!exact) {
    $('#dAlgo').value = S.simAlgo
    $('#dAlgo').onchange = (e) => { S.simAlgo = e.target.value; localSet('po-algo', S.simAlgo) }
    $('#dThr').oninput = (e) => { S.simThr = +e.target.value; $('#dThrV').textContent = S.simThr; localSet('po-thr', S.simThr) }
  }
  $('#dRun').onclick = runDup
  if (S.dup?.view !== S.view) {
    $('#view').innerHTML = `<div class="empty"><h2>${exact ? 'Rechercher les doublons exacts' : 'Rechercher les photos similaires'}</h2><p>${exact ? 'Seuls les fichiers de même taille sont comparés par empreinte SHA-256 (calculée une fois puis mémorisée).' : 'Chaque photo possède une empreinte perceptuelle de 64 bits. Le seuil est le nombre de bits différents toléré : 0 = quasi identiques, 6 = très proches (conseillé), 12+ = ressemblance large.'}</p><button class="primary" onclick="runDup()">Lancer la recherche</button></div>`
    return
  }
  const groups = S.dup.groups
  if (!groups.length) { $('#view').innerHTML = `<div class="empty"><h2>Aucun ${exact ? 'doublon' : 'groupe de photos similaires'} 🎉</h2><p>${S.dup.scanned} photo(s) examinée(s).</p></div>`; return }
  const marked = S.dup.marked
  const total = [...marked].reduce((s, id) => s + (S.dup.byId.get(id)?.size || 0), 0)
  $('#view').innerHTML = `<div class="row" style="margin-bottom:12px"><b>${groups.length} groupe(s)</b><span class="muted" title="La meilleure version de chaque groupe (définition, taille) est conservée par défaut">${S.dup.scanned} photo(s) examinée(s)</span>
      <span class="spacer"></span><span class="muted">${marked.size} à supprimer · ${bytes(total)} libérés</span><button class="danger" id="dTrash" ${marked.size ? '' : 'disabled'}>🗑 Envoyer à la corbeille</button></div>` +
    groups.map((g, gi) => `<div class="dgroup"><div class="h">Groupe ${gi + 1} · ${g.photos.length} photos${exact ? ' · ' + bytes(g.photos[0].size) + ' chacune' : ''}</div><div class="items">
      ${g.photos.map((p) => `<div class="ditem ${marked.has(p.id) ? 'trash' : g.keep === p.id ? 'keep' : ''}">${g.keep === p.id ? '<span class="tag">Meilleure</span>' : ''}
        <img src="${thumb(p.id)}" data-g="${gi}" data-id="${p.id}" alt="" loading="lazy">
        <div class="info"><div class="n" title="${esc(p.name)}">${esc(p.name)}</div><div class="p" title="${esc(p.path)}">${esc(p.path)}</div>
        <div class="muted">${p.width}×${p.height} · ${bytes(p.size)}</div><div class="muted">${fmtDate(p.taken)}</div></div>
        <label><input type="checkbox" data-mark="${p.id}" ${marked.has(p.id) ? 'checked' : ''}> Supprimer</label></div>`).join('')}</div></div>`).join('')
  $$('[data-mark]').forEach((cb) => cb.onchange = () => {
    const id = +cb.dataset.mark
    cb.checked ? marked.add(id) : marked.delete(id)
    const g = groups.find((x) => x.photos.some((p) => p.id === id))
    if (g.photos.every((p) => marked.has(p.id))) toast('Attention : toutes les photos de ce groupe seront supprimées', true)
    renderDup()
  })
  $$('.ditem img').forEach((img) => img.onclick = () => { const g = groups[+img.dataset.g]; openViewer(g.photos, g.photos.findIndex((p) => p.id === +img.dataset.id)) })
  $('#dTrash').onclick = async () => {
    if (!confirm(`Envoyer ${marked.size} photo(s) à la corbeille de Windows ?\nVous pourrez les restaurer depuis la corbeille.`)) return
    const r = await act('trash', { ids: [...marked] }, null, { timeout: 120000 })
    if (!r) return
    toast(`${r.trashed} photo(s) envoyée(s) à la corbeille` + (r.failed.length ? `, ${r.failed.length} échec(s)` : ''), r.failed.length > 0)
    const gone = new Set([...marked].filter((id) => !r.failed.some((f) => f.id === id)))
    S.dup.groups = groups.map((g) => ({ ...g, photos: g.photos.filter((p) => !gone.has(p.id)) })).filter((g) => g.photos.length > 1)
    gone.forEach((id) => marked.delete(id))
    await loadStats(); loadFolders(); renderDup()
  }
}
async function runDup() {
  const exact = S.view === 'exact', view = S.view
  $('#view').innerHTML = `<div class="empty"><h2>Recherche en cours…</h2><div class="progressbar" style="margin:14px 0"><i id="dProg" style="width:0"></i></div><p id="dMsg" class="muted"></p></div>`
  try {
    const r = await run(exact ? 'duplicates.exact' : 'duplicates.similar', exact ? { folder_id: S.folderId } : { folder_id: S.folderId, algo: S.simAlgo, threshold: S.simThr },
      (p) => { if ($('#dProg')) { $('#dProg').style.width = (p.percent || 0) + '%'; $('#dMsg').textContent = p.message || '' } })
    const byId = new Map(); r.groups.forEach((g) => g.photos.forEach((p) => byId.set(p.id, p)))
    S.dup = { view, groups: r.groups, scanned: r.scanned, byId, marked: new Set(r.groups.flatMap((g) => g.photos.filter((p) => p.id !== g.keep).map((p) => p.id))) }
  } catch (e) { toast(e.message, true); S.dup = null }
  if (S.view === view) renderDup()
}

// ── Viewer ──
const V = { list: [], idx: 0 }
async function openViewer(list, idx) {
  V.list = list; V.idx = idx; $('#viewer').classList.remove('hidden'); showPhoto()
}
async function showPhoto() {
  const p = V.list[V.idx]; if (!p) return
  $('#vImg').src = `${BASE}/image/${p.id}?size=${Math.min(4096, Math.round(Math.max(innerWidth, innerHeight) * (devicePixelRatio || 1)))}`
  $('#vPrev').disabled = V.idx <= 0; $('#vNext').disabled = V.idx >= V.list.length - 1
  $('#vInfo').innerHTML = `<h3>${esc(p.name)}</h3><div class="muted">Chargement…</div>`
  const i = await act('photo.info', { id: p.id }); if (!i || V.list[V.idx] !== p) return
  const rows = [['Date', fmtDate(i.taken) + (i.taken_src === 'exif' ? '' : ' <span class="muted">(fichier)</span>')], ['Appareil', esc(i.camera || '—')],
    ['Dimensions', `${i.width} × ${i.height}`], ['Taille', bytes(i.size)],
    ['Position', i.lat != null ? `<span class="mono">${i.lat.toFixed(6)}, ${i.lon.toFixed(6)}</span>` : '—'],
    ...Object.entries(i.details || {}).map(([k, v]) => [esc(k), esc(v)]), ['Chemin', `<span class="mono">${esc(i.path)}</span>`]]
  $('#vInfo').innerHTML = `<h3>${esc(i.name)}</h3>${i.exists ? '' : '<p style="color:#fca5a5;margin-bottom:8px">Fichier introuvable : ré-indexez le dossier.</p>'}
    <dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div class="acts"><button id="vOpen">Ouvrir</button><button id="vReveal">Afficher le dossier</button><button class="danger" id="vTrash">🗑 Corbeille</button></div>
    <div class="note" style="margin-top:12px">Pour modifier ou effacer les métadonnées, utilisez le module EXIF.</div>`
  $('#vOpen').onclick = () => act('photo.open', { id: p.id })
  $('#vReveal').onclick = () => act('photo.open', { id: p.id, reveal: true })
  $('#vTrash').onclick = async () => {
    if (!confirm(`Envoyer « ${p.name} » à la corbeille ?`)) return
    const r = await act('trash', { ids: [p.id] }); if (!r || !r.trashed) return
    toast('Photo envoyée à la corbeille')
    V.list.splice(V.idx, 1); S.sel.delete(p.id)
    if (S.dup) { S.dup.groups.forEach((g) => (g.photos = g.photos.filter((x) => x.id !== p.id))); S.dup.groups = S.dup.groups.filter((g) => g.photos.length > 1); S.dup.marked.delete(p.id) }
    if (!V.list.length) closeViewer(); else { V.idx = Math.min(V.idx, V.list.length - 1); showPhoto() }
    await loadStats(); loadFolders()
    if (S.view === 'all' || S.view === 'grid') $(`.ph[data-id="${p.id}"]`)?.remove()
  }
}
function closeViewer() { $('#viewer').classList.add('hidden'); $('#vImg').removeAttribute('src'); if (S.view === 'exact' || S.view === 'similar') renderDup() }
$('#vClose').onclick = closeViewer
$('#vPrev').onclick = () => { if (V.idx > 0) { V.idx--; showPhoto() } }
$('#vNext').onclick = () => { if (V.idx < V.list.length - 1) { V.idx++; showPhoto() } }
document.addEventListener('keydown', (e) => {
  if ($('.overlay')) return
  if (!$('#viewer').classList.contains('hidden')) {
    if (e.key === 'Escape') closeViewer()
    else if (e.key === 'ArrowLeft') $('#vPrev').click()
    else if (e.key === 'ArrowRight') $('#vNext').click()
    else if (e.key === 'Delete') $('#vTrash')?.click()
    return
  }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName)) return
  if (e.key === 'Escape' && S.sel.size) $('#btnSelNone').click()
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && (S.view === 'all' || S.view === 'grid')) { e.preventDefault(); $('#btnSelAll').click() }
  if (e.key === 'Delete' && S.sel.size) $('#btnTrash').click()
})

// ── Folders & indexing ──
function foldersDialog() {
  const ov = dialog(`<h3>Dossiers indexés</h3><div class="content">
    <div class="row"><input id="fPath" placeholder="Chemin absolu, ex. D:\\Photos" style="flex:1" value="${esc(localGet('po-lastpath', ''))}"><button class="primary" id="fAdd">Ajouter et indexer</button></div>
    <div class="note">Les sous-dossiers sont inclus. Ajouter un dossier parent d'un dossier déjà indexé les fusionne.</div>
    <div class="flist" id="fList"></div></div>
    <div class="foot"><span class="spacer"></span><button id="fClose">Fermer</button></div>`)
  const list = () => {
    $('#fList', ov).innerHTML = S.folders.map((f) => `<div class="fitem"><span>📁</span><div class="p"><div title="${esc(f.path)}">${esc(f.path)}</div>
      <div class="s">${f.count} photo(s) · ${f.last_scan ? 'indexé le ' + fmtDate(f.last_scan) : 'jamais indexé'}${f.exists ? '' : ' · <span style="color:#fca5a5">introuvable</span>'}</div></div>
      <button data-scan="${f.id}" title="Ré-indexer ce dossier">🔄</button><button class="danger" data-rm="${f.id}" title="Retirer de l'index (les fichiers ne sont pas touchés)">Retirer</button></div>`).join('') || '<div class="muted">Aucun dossier.</div>'
    $$('[data-scan]', ov).forEach((b) => b.onclick = () => { ov.remove(); startIndex(+b.dataset.scan) })
    $$('[data-rm]', ov).forEach((b) => b.onclick = async () => {
      const f = S.folders.find((x) => x.id === +b.dataset.rm)
      if (!confirm(`Retirer « ${f.path} » de l'index ?\nLes photos elles-mêmes ne sont pas supprimées.`)) return
      if (await act('folder.remove', { id: f.id }, 'Dossier retiré')) { await refreshAll(); list() }
    })
  }
  list()
  const add = async () => {
    const path = $('#fPath', ov).value.trim(); if (!path) return
    localSet('po-lastpath', path)
    const r = await act('folder.add', { path }); if (!r) return
    ov.remove()
    if (r.existing) toast('Ce dossier est déjà couvert par l\'index : ré-indexation')
    await loadFolders(); startIndex(r.id)
  }
  $('#fAdd', ov).onclick = add
  $('#fPath', ov).addEventListener('keydown', (e) => { if (e.key === 'Enter') add() })
  $('#fClose', ov).onclick = () => ov.remove()
}
$('#btnFolders').onclick = foldersDialog
async function startIndex(folderId = 0) {
  if (S.indexJob) return toast('Une indexation est déjà en cours', true)
  $('#indexBar').classList.remove('hidden'); $('#btnIndex').disabled = true
  $('#indexBar i').style.width = '0'; $('#indexMsg').textContent = 'Démarrage…'
  try {
    const r = await window.ledroide.run(MODULE_ID, 'index', { folder_id: folderId }, {
      onStart: (id) => (S.indexJob = id),
      onProgress: (p) => { $('#indexBar i').style.width = (p.percent || 0) + '%'; $('#indexMsg').textContent = p.message || '' },
    })
    const parts = [`${r.added} ajoutée(s)`]
    if (r.updated) parts.push(`${r.updated} mise(s) à jour`)
    if (r.removed) parts.push(`${r.removed} retirée(s)`)
    if (r.failed) parts.push(`${r.failed} illisible(s)`)
    toast('Indexation terminée : ' + parts.join(', '), r.errors.length > 0 && !r.added)
    if (r.errors.length) console.info('Indexation :', r.errors)
  } catch (e) { toast(e.message, true) }
  S.indexJob = null; $('#indexBar').classList.add('hidden'); $('#btnIndex').disabled = false
  S.dup = null
  await refreshAll()
}
$('#btnIndex').onclick = () => S.folders.length ? startIndex(S.folderId) : foldersDialog()
$('#btnCancelIndex').onclick = () => S.indexJob && window.ledroide.cancel(MODULE_ID, S.indexJob)
$('#folderSel').onchange = async (e) => { S.folderId = +e.target.value; localSet('po-folder', S.folderId); S.dup = null; await loadStats(); setView(S.view === 'grid' ? 'all' : S.view) }
let qTimer
$('#q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value.trim(); if (S.view !== 'grid') { setView('all') } else renderGrid() }, 250) })
$$('.nv').forEach((n) => n.onclick = () => setView(n.dataset.v))

// ── Rename / sort / trash / history ──
const TOKENS = [['{date:%Y-%m-%d_%H%M%S}', 'date et heure'], ['{date:%Y%m%d}', 'date compacte'], ['{appareil}', 'appareil'], ['{n}', 'numéro'], ['{n:3}', 'numéro 001'],
  ['{nom}', 'nom actuel'], ['{annee}', 'année'], ['{mois}', 'mois (01)'], ['{mois_nom}', 'mois en lettres'], ['{jour}', 'jour'], ['{dossier}', 'dossier']]
function previewTable(items, fromKey, toKey) {
  return `<table><thead><tr><th>Actuel</th><th></th><th>Nouveau</th></tr></thead><tbody>${items.slice(0, 300).map((i) =>
    `<tr class="${i.same ? 'same' : ''}"><td>${esc(i.from.split(/[\\/]/).pop())}</td><td class="arrow">→</td><td class="new">${esc(i[toKey])}</td></tr>`).join('')}</tbody></table>`
}
function renameDialog() {
  const ids = [...S.sel]
  const ov = dialog(`<h3>Renommer ${ids.length} photo(s)</h3><div class="content">
    <div class="field"><label>Modèle (l'extension est conservée)</label><input id="rPat" class="mono" value="${esc(localGet('po-rpat', '{date:%Y-%m-%d_%H%M%S}_{appareil}_{n}'))}"></div>
    <div class="chips">${TOKENS.map(([t, l]) => `<span class="chip" data-t="${esc(t)}" title="${esc(l)}">${esc(t)}</span>`).join('')}</div>
    <div class="row"><label class="muted">Numéroter à partir de</label><input type="number" id="rStart" value="1" min="0" style="width:80px"><span class="note">Ordre : celui de l'affichage (tri actuel). Les noms en conflit reçoivent un suffixe _2, _3…</span></div>
    <div id="rInfo" class="note"></div><div class="ptable" id="rPrev"></div></div>
    <div class="foot"><span class="spacer"></span><button id="rCancel">Annuler</button><button class="primary" id="rOk" disabled>Renommer</button></div>`, 'wide')
  const order = S.photos.map((p) => p.id).filter((id) => S.sel.has(id))
  const ordered = [...order, ...ids.filter((id) => !order.includes(id))]
  let timer
  const preview = async () => {
    const r = await call('rename.preview', { ids: ordered, pattern: $('#rPat', ov).value, start: +$('#rStart', ov).value || 0 }).catch((e) => ({ error: e.message }))
    if (r.error) { $('#rInfo', ov).innerHTML = `<span style="color:#fca5a5">${esc(r.error)}</span>`; $('#rOk', ov).disabled = true; return }
    $('#rInfo', ov).textContent = `${r.changes} fichier(s) seront renommés sur ${r.count}` + (r.count > r.items.length ? ` (aperçu des ${r.items.length} premiers)` : '')
    $('#rPrev', ov).innerHTML = previewTable(r.items, 'from', 'name')
    $('#rOk', ov).disabled = !r.changes
  }
  const schedule = () => { clearTimeout(timer); timer = setTimeout(preview, 200) }
  $('#rPat', ov).addEventListener('input', schedule); $('#rStart', ov).addEventListener('input', schedule)
  $$('.chip', ov).forEach((c) => c.onclick = () => { const i = $('#rPat', ov); const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, p) + c.dataset.t + i.value.slice(i.selectionEnd ?? p); i.focus(); schedule() })
  $('#rCancel', ov).onclick = () => ov.remove()
  $('#rOk', ov).onclick = async () => {
    localSet('po-rpat', $('#rPat', ov).value)
    $('#rOk', ov).disabled = true
    const r = await act('rename.apply', { ids: ordered, pattern: $('#rPat', ov).value, start: +$('#rStart', ov).value || 0 }, null, { timeout: 300000 })
    if (!r) { $('#rOk', ov).disabled = false; return }
    ov.remove(); S.sel.clear()
    toast(`${r.renamed} photo(s) renommée(s)` + (r.failed.length ? `, ${r.failed.length} échec(s)` : ''), r.failed.length > 0, r.op_id ? { label: 'Annuler', run: () => undo(r.op_id) } : null)
    render()
  }
  preview()
}
function sortDialog() {
  const ids = [...S.sel]
  const pats = [['{annee}/{mois}', '2024 / 03'], ['{annee}/{mois}-{mois_nom}', '2024 / 03-mars'], ['{annee}/{annee}-{mois}-{jour}', '2024 / 2024-03-15'], ['{appareil}/{annee}', 'Appareil / 2024']]
  const ov = dialog(`<h3>Ranger ${ids.length} photo(s) par date</h3><div class="content">
    <div class="field"><label>Dossier de destination (chemin absolu, existant)</label><input id="sDest" value="${esc(localGet('po-dest', S.folders.find((f) => f.id === S.folderId)?.path || S.folders[0]?.path || ''))}"></div>
    <div class="row"><label class="muted">Arborescence</label><select id="sPat">${pats.map(([p, l]) => `<option value="${esc(p)}">${esc(l)}</option>`).join('')}<option value="custom">Personnalisée…</option></select>
      <input id="sCustom" class="mono hidden" value="{annee}/{mois}" style="flex:1"></div>
    <div class="row"><label><input type="radio" name="sMode" value="move" checked> Déplacer</label><label><input type="radio" name="sMode" value="copy"> Copier</label>
      <span class="note">Le dossier de destination est ajouté à l'index. Opération annulable depuis l'historique.</span></div>
    <div id="sInfo" class="note"></div><div class="ptable" id="sPrev"></div>
    <div id="sProg" class="hidden"><div class="progressbar"><i style="width:0"></i></div></div></div>
    <div class="foot"><span class="spacer"></span><button id="sCancel">Annuler</button><button class="primary" id="sOk" disabled>Ranger</button></div>`, 'wide')
  const pat = () => $('#sPat', ov).value === 'custom' ? $('#sCustom', ov).value : $('#sPat', ov).value
  const mode = () => $('input[name=sMode]:checked', ov).value
  let timer
  const preview = async () => {
    const r = await call('sort.preview', { ids, dest: $('#sDest', ov).value, pattern: pat(), mode: mode() }).catch((e) => ({ error: e.message }))
    if (r.error) { $('#sInfo', ov).innerHTML = `<span style="color:#fca5a5">${esc(r.error)}</span>`; $('#sPrev', ov).innerHTML = ''; $('#sOk', ov).disabled = true; return }
    $('#sInfo', ov).innerHTML = `${r.changes} photo(s) ${mode() === 'move' ? 'déplacée(s)' : 'copiée(s)'} dans ${r.folders.length} dossier(s) : ` +
      r.folders.slice(0, 12).map((f) => `<b>${esc(f.folder)}</b> (${f.count})`).join(', ') + (r.folders.length > 12 ? '…' : '')
    $('#sPrev', ov).innerHTML = previewTable(r.items, 'from', 'rel')
    $('#sOk', ov).disabled = !r.changes
    $('#sOk', ov).textContent = mode() === 'move' ? 'Déplacer' : 'Copier'
  }
  const schedule = () => { clearTimeout(timer); timer = setTimeout(preview, 250) }
  $('#sDest', ov).addEventListener('input', schedule); $('#sCustom', ov).addEventListener('input', schedule)
  $('#sPat', ov).onchange = () => { $('#sCustom', ov).classList.toggle('hidden', $('#sPat', ov).value !== 'custom'); schedule() }
  $$('input[name=sMode]', ov).forEach((r) => r.onchange = schedule)
  $('#sCancel', ov).onclick = () => ov.remove()
  $('#sOk', ov).onclick = async () => {
    localSet('po-dest', $('#sDest', ov).value)
    $('#sOk', ov).disabled = true; $('#sProg', ov).classList.remove('hidden')
    try {
      const r = await run('sort.apply', { ids, dest: $('#sDest', ov).value, pattern: pat(), mode: mode() }, (p) => { $('#sProg i', ov).style.width = (p.percent || 0) + '%' })
      ov.remove(); S.sel.clear()
      toast(`${r.done} photo(s) ${r.mode === 'move' ? 'déplacée(s)' : 'copiée(s)'}` + (r.failed_count ? `, ${r.failed_count} échec(s)` : ''), r.failed_count > 0, r.op_id ? { label: 'Annuler', run: () => undo(r.op_id) } : null)
      await refreshAll()
    } catch (e) { toast(e.message, true); $('#sOk', ov).disabled = false }
  }
  preview()
}
async function undo(id) {
  const r = await act('op.undo', { id }, null, { timeout: 300000 }); if (!r) return
  toast(`Annulation : ${r.restored} fichier(s) restauré(s)` + (r.failed.length ? `, ${r.failed.length} échec(s) : ${r.failed[0].error}` : ''), r.failed.length > 0)
  await refreshAll()
}
async function historyDialog() {
  const r = await act('ops.list'); if (!r) return
  const ov = dialog(`<h3>Historique</h3><div class="content">${r.ops.map((o) => `<div class="op"><div class="l">${esc(o.label)}<div class="d">${fmtDate(o.created_at)}</div></div>
    ${o.undone ? '<span class="muted">Annulé</span>' : `<button data-undo="${o.id}">↶ Annuler</button>`}</div>`).join('') || '<div class="muted">Aucune opération.</div>'}
    <div class="note">Les suppressions passent par la corbeille de Windows : restaurez-les depuis celle-ci.</div></div>
    <div class="foot"><span class="spacer"></span><button id="hClose">Fermer</button></div>`)
  $('#hClose', ov).onclick = () => ov.remove()
  $$('[data-undo]', ov).forEach((b) => b.onclick = async () => {
    if (!confirm('Annuler cette opération ? Les fichiers reprennent leur nom et leur emplacement d\'origine.')) return
    ov.remove(); undo(+b.dataset.undo)
  })
}
$('#btnRename').onclick = renameDialog
$('#btnSort').onclick = sortDialog
$('#btnHistory').onclick = historyDialog
$('#btnTrash').onclick = async () => {
  if (!confirm(`Envoyer ${S.sel.size} photo(s) à la corbeille de Windows ?`)) return
  const r = await act('trash', { ids: [...S.sel] }, null, { timeout: 120000 }); if (!r) return
  toast(`${r.trashed} photo(s) envoyée(s) à la corbeille` + (r.failed.length ? `, ${r.failed.length} échec(s)` : ''), r.failed.length > 0)
  S.sel.clear(); await refreshAll()
}

document.documentElement.style.setProperty('--tile', localGet('po-tile', 150) + 'px')
refreshAll()
</script>
</body>
</html>
