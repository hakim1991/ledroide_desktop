<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planning Gantt</title>
<script src="/ledroide-bridge.js"></script>
<style>
  :root {
    --bg: #0f0f12; --surface: #18181b; --surface2: #1f1f23; --border: #27272a; --line: #1d1d21;
    --text: #e2e2e8; --muted: #71717a; --accent: #6366f1; --accent-h: #818cf8;
    --ok: #22c55e; --err: #ef4444; --warn: #f59e0b;
    --row: 30px; --head: 46px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
         font-size: 13px; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
  button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
           padding: 5px 10px; font: inherit; cursor: pointer; transition: .12s; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: #3f3f46; background: #26262b; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button.danger { color: #fca5a5; }
  button.danger:hover:not(:disabled) { border-color: rgba(239,68,68,.5); }
  button.icon { padding: 5px 8px; min-width: 30px; }
  input, select, textarea { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 8px; font: inherit; outline: none; user-select: text; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  .hidden { display: none !important; }
  .spacer { flex: 1; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }

  header { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border);
           background: var(--surface); flex-shrink: 0; flex-wrap: wrap; }
  header .title { font-weight: 600; font-size: 14px; margin-right: 4px; }
  #projectSel { max-width: 220px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--surface2); color: var(--text); }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--border);
               border-radius: 8px; padding: 4px; z-index: 50; min-width: 230px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .menu-list button { display: flex; gap: 8px; width: 100%; text-align: left; border: none; background: transparent; padding: 7px 10px; }
  .menu-list button:hover { background: var(--surface2); }
  .menu-list hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  #main { flex: 1; min-height: 0; display: flex; }
  #grid { width: 430px; min-width: 200px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  #split { width: 5px; cursor: col-resize; background: var(--border); flex-shrink: 0; }
  #split:hover, #split.drag { background: var(--accent); }
  .ghead, .grow { display: grid; grid-template-columns: minmax(120px, 1fr) 74px 74px 50px 46px 80px; align-items: center; }
  .ghead { height: var(--head); flex-shrink: 0; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11.5px;
           text-transform: uppercase; letter-spacing: .03em; }
  .ghead > div, .grow > div { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #gbody { flex: 1; overflow: hidden; }
  .grow { height: var(--row); border-bottom: 1px solid var(--line); cursor: default; }
  .grow:hover { background: #1c1c21; }
  .grow.sel { background: rgba(99,102,241,.16); }
  .grow.summary .name { font-weight: 600; }
  .grow .name { display: flex; align-items: center; gap: 5px; }
  .grow .name .txt { overflow: hidden; text-overflow: ellipsis; }
  .grow .tog { width: 14px; flex-shrink: 0; text-align: center; color: var(--muted); cursor: pointer; font-size: 10px; }
  .grow .tog:hover { color: var(--text); }
  .grow .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .grow .dot.ms { transform: rotate(45deg); }
  .grow .num { color: #a1a1aa; font-variant-numeric: tabular-nums; font-size: 12px; }
  .grow .late { color: #fca5a5; }

  #chart { flex: 1; min-width: 0; overflow: auto; position: relative; }
  #chead { position: sticky; top: 0; z-index: 5; height: var(--head); background: var(--surface); border-bottom: 1px solid var(--border); }
  #chead .r1, #chead .r2 { position: relative; height: 23px; }
  #chead .r1 { border-bottom: 1px solid var(--line); }
  #chead .c { position: absolute; top: 0; height: 100%; display: flex; align-items: center; justify-content: center;
              border-left: 1px solid var(--line); font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  #chead .r1 .c { justify-content: flex-start; padding-left: 6px; color: #a1a1aa; font-weight: 600; }
  #chead .c.we { color: #52525b; }
  #chead .c.today { color: #fff; background: rgba(99,102,241,.35); }
  #canvas { position: relative; }
  .rowbg { position: absolute; left: 0; right: 0; height: var(--row); border-bottom: 1px solid var(--line); }
  .rowbg.sel { background: rgba(99,102,241,.10); }
  .we-col { position: absolute; top: 0; bottom: 0; background: rgba(255,255,255,.025); }
  .vline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  #todayLine { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .7; z-index: 3; pointer-events: none; }

  .bar { position: absolute; height: 18px; border-radius: 4px; background: color-mix(in srgb, var(--c) 45%, #18181b);
         border: 1px solid var(--c); cursor: grab; z-index: 2; overflow: visible; }
  .bar:active { cursor: grabbing; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); border-radius: 3px 0 0 3px; pointer-events: none; }
  .bar .pct { position: absolute; left: 6px; top: 0; line-height: 16px; font-size: 10.5px; color: #fff; pointer-events: none;
              text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; }
  .bar.sel { box-shadow: 0 0 0 2px #fff; }
  .bar.late { border-color: var(--err); }
  .bar .h { position: absolute; top: -1px; bottom: -1px; width: 7px; cursor: ew-resize; }
  .bar .h.l { left: -3px; } .bar .h.r { right: -3px; }
  .bar .link { position: absolute; right: -15px; top: 3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c);
               background: var(--bg); cursor: crosshair; opacity: 0; transition: opacity .1s; }
  .bar:hover .link, .bar.sel .link { opacity: 1; }
  .bar.summary { height: 10px; border-radius: 0; background: #a1a1aa; border-color: #a1a1aa; }
  .bar.summary .fill { background: #e4e4e7; border-radius: 0; }
  .bar.summary::before, .bar.summary::after { content: ''; position: absolute; bottom: -7px; border: 5px solid transparent; border-top-color: #a1a1aa; }
  .bar.summary::before { left: -1px; border-left-color: #a1a1aa; }
  .bar.summary::after { right: -1px; border-right-color: #a1a1aa; }
  .bar.summary .pct, .bar.summary .h { display: none; }
  .bar.ms { width: 16px; height: 16px; border-radius: 2px; transform: rotate(45deg); background: var(--c); }
  .bar.ms .fill, .bar.ms .pct, .bar.ms .h { display: none; }
  .bar.ms .link { transform: rotate(-45deg); right: -16px; top: -10px; }
  .bar.drop { box-shadow: 0 0 0 2px var(--ok); }
  .lbl { position: absolute; height: var(--row); line-height: var(--row); font-size: 12px; color: #a1a1aa; white-space: nowrap; pointer-events: none; z-index: 1; }
  .lbl b { color: var(--text); font-weight: 500; }

  #arrows { position: absolute; left: 0; top: 0; z-index: 1; overflow: visible; pointer-events: none; }
  #arrows path.d { fill: none; stroke: #71717a; stroke-width: 1.4; }
  #arrows path.hit { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; cursor: pointer; }
  #arrows g:hover path.d, #arrows g.sel path.d { stroke: var(--accent-h); stroke-width: 2; }
  #arrows path.tmp { fill: none; stroke: var(--ok); stroke-width: 1.6; stroke-dasharray: 4 3; }

  #empty { flex: 1; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 32px; text-align: center; max-width: 420px; }
  .card h2 { font-size: 17px; margin-bottom: 6px; }
  .card p { color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .card .actions { display: flex; gap: 8px; justify-content: center; }
  #noTasks { position: absolute; left: 24px; top: calc(var(--head) + 24px); color: var(--muted); z-index: 4; }

  #tip { position: fixed; z-index: 80; background: #0b0b0e; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
         font-size: 12px; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.5); line-height: 1.55; max-width: 300px; }
  #tip b { display: block; margin-bottom: 2px; }
  #tip span { color: var(--muted); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: min(560px, calc(100vw - 32px));
            max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .dialog.small { width: min(380px, calc(100vw - 32px)); }
  .dialog h3 { font-size: 15px; padding: 14px 18px 10px; }
  .dialog .content { padding: 0 18px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .dialog .foot { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field > label { font-size: 11.5px; color: var(--muted); }
  .field.row { flex-direction: row; align-items: center; gap: 8px; }
  .field textarea { min-height: 70px; resize: vertical; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw { width: 22px; height: 22px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; }
  .sw.on { border-color: #fff; }
  .sw.none { background: repeating-linear-gradient(45deg, #3f3f46 0 4px, #27272a 4px 8px); }
  .deplist { display: flex; flex-direction: column; gap: 4px; }
  .dep { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 4px 3px 8px; }
  .dep .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep input { width: 58px; padding: 2px 5px; }
  .muted { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 11.5px; }

  #depPop { position: fixed; z-index: 70; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 8px; width: 240px; }
  #depPop .n { font-size: 12px; color: #a1a1aa; }
  #depPop .r { display: flex; gap: 6px; align-items: center; }
  #depPop input { width: 70px; }

  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: #27272a;
           border: 1px solid #3f3f46; border-radius: 8px; padding: 8px 14px; transition: .2s; z-index: 100; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.bad { border-color: rgba(239,68,68,.6); color: #fecaca; }
</style>
</head>
<body>

<header>
  <span class="title">📊 Planning Gantt</span>
  <select id="projectSel" title="Projet"></select>
  <button class="icon" id="btnNewProject" title="Nouveau projet">＋</button>
  <span class="sep"></span>
  <button class="primary" id="btnAddTask" title="Ajouter une tâche (Inser)">＋ Tâche</button>
  <button id="btnAddMs" title="Ajouter un jalon">◆ Jalon</button>
  <button class="icon" id="btnUp" title="Monter (Alt+↑)">↑</button>
  <button class="icon" id="btnDown" title="Descendre (Alt+↓)">↓</button>
  <button class="icon" id="btnOut" title="Désindenter (Alt+←)">⇤</button>
  <button class="icon" id="btnIn" title="Indenter dans la tâche précédente (Alt+→)">⇥</button>
  <button class="icon danger" id="btnDel" title="Supprimer (Suppr)">🗑</button>
  <span class="spacer"></span>
  <div class="seg" id="zoom">
    <button data-z="day">Jour</button><button data-z="week">Semaine</button><button data-z="month">Mois</button>
  </div>
  <button id="btnToday">Aujourd'hui</button>
  <div class="menu">
    <button class="icon" id="btnMenu" title="Plus d'actions">⋯</button>
    <div class="menu-list hidden" id="menuList">
      <button data-act="edit-project">✏️ Modifier le projet…</button>
      <button data-act="auto">🔁 <span id="autoLbl">Replanification auto</span></button>
      <button data-act="expand">⊞ Tout déplier</button>
      <button data-act="collapse">⊟ Tout replier</button>
      <hr>
      <button data-act="export-json">⬇️ Exporter (JSON)</button>
      <button data-act="export-csv">⬇️ Exporter (CSV)</button>
      <button data-act="import">⬆️ Importer (JSON)…</button>
      <button data-act="seed">🧪 Créer un projet d'exemple</button>
      <hr>
      <button data-act="delete-project" class="danger">🗑 Supprimer le projet</button>
    </div>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" class="hidden" />
</header>

<div id="empty" class="hidden">
  <div class="card">
    <h2>Aucun projet</h2>
    <p>Créez un projet pour planifier vos tâches sur un diagramme de Gantt : durées, jalons, avancement et dépendances.</p>
    <div class="actions">
      <button class="primary" id="emptyNew">Nouveau projet</button>
      <button id="emptySeed">Créer un exemple</button>
      <button id="emptyImport">Importer…</button>
    </div>
  </div>
</div>

<div id="main" class="hidden">
  <div id="grid">
    <div class="ghead"><div>Tâche</div><div>Début</div><div>Fin</div><div>Durée</div><div>%</div><div>Resp.</div></div>
    <div id="gbody"></div>
  </div>
  <div id="split"></div>
  <div id="chart">
    <div id="chead"><div class="r1"></div><div class="r2"></div></div>
    <div id="canvas"></div>
    <div id="noTasks" class="hidden">Aucune tâche — cliquez sur « ＋ Tâche » ou double-cliquez dans le diagramme.</div>
  </div>
</div>

<div id="tip" class="hidden"></div>
<div id="depPop" class="hidden"></div>
<div id="toast"></div>

<script>
const MODULE_ID = 'gantt-planner'
const call = (action, payload = {}) => window.ledroide.call(MODULE_ID, action, payload)
const $ = (s, root = document) => root.querySelector(s)
const $$ = (s, root = document) => [...root.querySelectorAll(s)]
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

const DAY = 86400000
const ROW = 30
const ZOOM = { day: 34, week: 14, month: 4.5 }
const COLORS = ['#6366f1', '#38bdf8', '#22c55e', '#eab308', '#f97316', '#ef4444', '#ec4899', '#a855f7', '#14b8a6', '#71717a']
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']
const WD = ['D', 'L', 'M', 'M', 'J', 'V', 'S']

const toDay = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY }
const fromDay = (n) => new Date(n * DAY).toISOString().slice(0, 10)
const todayN = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY }
const dt = (n) => new Date(n * DAY)
const wday = (n) => dt(n).getUTCDay()
const fmt = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y.slice(2)}` }
const fmtLong = (s) => { const d = dt(toDay(s)); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
const dur = (t) => toDay(t.end) - toDay(t.start) + 1
function isoWeek(n) {
  const d = dt(n); const day = (d.getUTCDay() + 6) % 7
  d.setUTCDate(d.getUTCDate() - day + 3)
  const first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4))
  return 1 + Math.round(((d - first) / DAY - 3 + ((first.getUTCDay() + 6) % 7)) / 7)
}

function localGet(k) { try { return localStorage.getItem(k) } catch { return null } }
function localSet(k, v) { try { localStorage.setItem(k, v) } catch {} }

const state = {
  projects: [], pid: Number(localGet('gp-project')) || null, view: null,
  zoom: localGet('gp-zoom') || 'day', sel: null, selDep: null,
  collapsed: new Set(), rows: [], byId: new Map(), origin: 0, days: 0,
}

let toastTimer
function toast(msg, bad = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), bad ? 5000 : 2200)
}
async function act(action, payload, okMsg) {
  try {
    const r = await call(action, payload)
    if (okMsg) toast(okMsg)
    return r
  } catch (e) { toast(e.message || String(e), true); return null }
}

// ── Data ──────────────────────────────────────────────────────────────────────

async function loadProjects() {
  const r = await act('projects.list')
  if (!r) return
  state.projects = r.projects
  if (!state.projects.some((p) => p.id === state.pid)) state.pid = state.projects[0]?.id ?? null
  renderProjectSel()
  if (state.pid) await openProject(state.pid)
  else showEmpty(true)
}

async function openProject(id) {
  const v = await act('project.get', { id })
  if (!v) return
  state.pid = id; localSet('gp-project', id)
  try { state.collapsed = new Set(JSON.parse(localGet('gp-collapsed-' + id) || '[]')) } catch { state.collapsed = new Set() }
  state.sel = null
  setView(v, true)
}

function setView(v, scrollToday = false) {
  if (!v || !v.project) return
  state.view = v
  state.pid = v.project.id
  const p = state.projects.find((x) => x.id === v.project.id)
  if (p) Object.assign(p, v.project)
  else state.projects.push({ ...v.project })
  if (state.sel && !v.tasks.some((t) => t.id === state.sel)) state.sel = null
  if (state.selDep && !v.deps.some((d) => d.id === state.selDep)) state.selDep = null
  showEmpty(false)
  renderProjectSel()
  render()
  if (scrollToday) scrollTo(todayN(), true)
}

function showEmpty(empty) {
  $('#empty').classList.toggle('hidden', !empty)
  $('#main').classList.toggle('hidden', empty)
  $$('header button:not(#btnNewProject):not(#btnMenu), header select, header .seg').forEach((b) => (b.style.visibility = empty ? 'hidden' : ''))
}

function renderProjectSel() {
  $('#projectSel').innerHTML = state.projects.map((p) =>
    `<option value="${p.id}" ${p.id === state.pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')
  $('#autoLbl').textContent = 'Replanification auto : ' + (state.view?.project.auto_schedule ? 'activée' : 'désactivée')
}

// ── Tree ──────────────────────────────────────────────────────────────────────

function buildTree() {
  const tasks = state.view.tasks
  state.byId = new Map(tasks.map((t) => [t.id, t]))
  const kids = new Map()
  for (const t of tasks) {
    const p = state.byId.has(t.parent_id) ? t.parent_id : null
    if (!kids.has(p)) kids.set(p, [])
    kids.get(p).push(t)
  }
  for (const list of kids.values()) list.sort((a, b) => a.position - b.position || a.id - b.id)
  state.kids = kids
  const rows = [], all = []
  const walk = (pid, depth, hidden) => {
    for (const t of kids.get(pid) || []) {
      all.push({ t, depth })
      if (!hidden) rows.push({ t, depth })
      walk(t.id, depth + 1, hidden || state.collapsed.has(t.id))
    }
  }
  walk(null, 0, false)
  state.rows = rows
  state.all = all
  state.rowOf = new Map(rows.map((r, i) => [r.t.id, i]))
}

function visibleRowOf(id) {
  let cur = state.byId.get(id)
  while (cur) {
    if (state.rowOf.has(cur.id)) return state.rowOf.get(cur.id)
    cur = state.byId.get(cur.parent_id)
  }
  return null
}

// ── Render ────────────────────────────────────────────────────────────────────

const px = () => ZOOM[state.zoom]
const xOf = (n) => (n - state.origin) * px()

function computeRange() {
  const t0 = todayN()
  let min = t0, max = t0
  for (const t of state.view.tasks) { min = Math.min(min, toDay(t.start)); max = Math.max(max, toDay(t.end)) }
  const pad = { day: [14, 45], week: [28, 120], month: [62, 365] }[state.zoom]
  let start = min - pad[0], end = max + pad[1]
  if (state.zoom === 'month') { const d = dt(start); start = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / DAY }
  else start -= (wday(start) + 6) % 7
  const minWidth = Math.ceil(($('#chart').clientWidth || 800) / px()) + 1
  state.origin = start
  state.days = Math.max(end - start + 1, minWidth)
}

function render() {
  buildTree()
  computeRange()
  renderGrid()
  renderChart()
  renderToolbar()
}

function renderToolbar() {
  $$('#zoom button').forEach((b) => b.classList.toggle('on', b.dataset.z === state.zoom))
  const t = state.byId.get(state.sel)
  const sibs = t ? state.kids.get(state.byId.has(t.parent_id) ? t.parent_id : null) : []
  const i = t ? sibs.indexOf(t) : -1
  $('#btnUp').disabled = !t || i <= 0
  $('#btnDown').disabled = !t || i >= sibs.length - 1
  $('#btnIn').disabled = !t || i <= 0 || sibs[i - 1].milestone
  $('#btnOut').disabled = !t || !state.byId.has(t.parent_id)
  $('#btnDel').disabled = !t
}

function taskColor(t) { return t.color || state.view.project.color || '#6366f1' }
const isLate = (t) => !t.summary && t.progress < 100 && toDay(t.end) < todayN()

function renderGrid() {
  $('#gbody').innerHTML = state.rows.map(({ t, depth }) => {
    const hasKids = t.summary
    const tog = hasKids ? (state.collapsed.has(t.id) ? '▶' : '▼') : ''
    return `<div class="grow ${t.summary ? 'summary' : ''} ${t.id === state.sel ? 'sel' : ''}" data-id="${t.id}" title="${esc(t.name)}">
      <div class="name" style="padding-left:${6 + depth * 16}px">
        <span class="tog" data-tog="${hasKids ? t.id : ''}">${tog}</span>
        <span class="dot ${t.milestone ? 'ms' : ''}" style="background:${t.summary ? '#a1a1aa' : taskColor(t)}"></span>
        <span class="txt">${esc(t.name)}</span>
      </div>
      <div class="num">${fmt(t.start)}</div>
      <div class="num ${isLate(t) ? 'late' : ''}">${fmt(t.end)}</div>
      <div class="num">${t.milestone ? '—' : dur(t) + ' j'}</div>
      <div class="num">${t.milestone ? '' : t.progress + '%'}</div>
      <div class="num">${esc(t.assignee)}</div>
    </div>`
  }).join('')
}

function renderChart() {
  const w = state.days * px(), h = Math.max(state.rows.length * ROW, 1)
  const chart = $('#chart')
  const minH = chart.clientHeight - 47
  renderScale(w)
  const parts = []
  state.rows.forEach(({ t }, i) => parts.push(`<div class="rowbg ${t.id === state.sel ? 'sel' : ''}" style="top:${i * ROW}px"></div>`))
  if (state.zoom !== 'month') {
    for (let n = state.origin; n < state.origin + state.days; n++) {
      const wd = wday(n)
      if (wd === 6) parts.push(`<div class="we-col" style="left:${xOf(n)}px;width:${2 * px()}px"></div>`)
      if (state.zoom === 'day' || wd === 1) parts.push(`<div class="vline" style="left:${xOf(n)}px"></div>`)
    }
  } else {
    for (let n = state.origin; n < state.origin + state.days; n++) if (dt(n).getUTCDate() === 1) parts.push(`<div class="vline" style="left:${xOf(n)}px"></div>`)
  }
  parts.push(`<div id="todayLine" style="left:${xOf(todayN()) + px() / 2 - 1}px"></div>`)
  state.rows.forEach(({ t }, i) => parts.push(barHtml(t, i)))
  parts.push(`<svg id="arrows" width="${w}" height="${Math.max(h, minH)}"><defs>
      <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#71717a"/></marker>
      <marker id="ahs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#818cf8"/></marker>
    </defs>${arrowsHtml()}<path class="tmp hidden" id="tmpLink"/></svg>`)
  const canvas = $('#canvas')
  canvas.style.width = w + 'px'
  canvas.style.height = Math.max(h, minH) + 'px'
  canvas.innerHTML = parts.join('')
  $('#noTasks').classList.toggle('hidden', state.view.tasks.length > 0)
}

function barGeom(t) {
  const s = toDay(t.start), e = toDay(t.end)
  if (t.milestone) { const cx = xOf(s) + px() / 2; return { x1: cx - 8, x2: cx + 8, cx } }
  return { x1: xOf(s), x2: xOf(e + 1) }
}

function barHtml(t, i) {
  const g = barGeom(t), y = i * ROW
  const c = taskColor(t)
  const cls = ['bar', t.summary ? 'summary' : '', t.milestone ? 'ms' : '', t.id === state.sel ? 'sel' : '', isLate(t) ? 'late' : ''].join(' ')
  const top = t.milestone ? y + 7 : t.summary ? y + 8 : y + 6
  const width = t.milestone ? 16 : Math.max(g.x2 - g.x1, 3)
  const pctTxt = width > 40 && !t.summary && !t.milestone ? `<span class="pct">${t.progress}%</span>` : ''
  const label = `<div class="lbl" style="left:${(t.milestone ? g.x2 + 4 : g.x2) + 14}px;top:${y}px"><b>${esc(t.name)}</b>${t.assignee ? ' · ' + esc(t.assignee) : ''}</div>`
  return `<div class="${cls}" data-id="${t.id}" style="--c:${c};left:${g.x1}px;top:${top}px;width:${width}px">
      <div class="fill" style="width:${t.progress}%"></div>${pctTxt}
      <div class="h l" data-h="l"></div><div class="h r" data-h="r"></div><div class="link" data-link="1" title="Glisser vers une tâche pour créer une dépendance"></div>
    </div>${label}`
}

function arrowPath(d) {
  const ra = visibleRowOf(d.from_id), rb = visibleRowOf(d.to_id)
  if (ra == null || rb == null || ra === rb) return null
  const a = state.rows[ra].t, b = state.rows[rb].t
  const ga = barGeom(a), gb = barGeom(b)
  const x1 = ga.x2 + 1, y1 = ra * ROW + ROW / 2
  const x2 = gb.x1 - 1, y2 = rb * ROW + ROW / 2
  if (x2 - x1 >= 14) return `M${x1},${y1} H${x1 + 7} V${y2} H${x2}`
  const ym = y1 + (y2 > y1 ? ROW / 2 : -ROW / 2)
  return `M${x1},${y1} H${x1 + 7} V${ym} H${x2 - 9} V${y2} H${x2}`
}

function arrowsHtml() {
  return state.view.deps.map((d) => {
    const p = arrowPath(d)
    if (!p) return ''
    const sel = d.id === state.selDep
    return `<g data-dep="${d.id}" class="${sel ? 'sel' : ''}"><path class="d" d="${p}" marker-end="url(#${sel ? 'ahs' : 'ah'})"/><path class="hit" d="${p}"/></g>`
  }).join('')
}

function renderScale(w) {
  const r1 = [], r2 = []
  const end = state.origin + state.days, P = px(), t0 = todayN()
  const group = (keyFn, labelFn, out, cls = () => '') => {
    let start = state.origin, key = keyFn(start)
    for (let n = state.origin + 1; n <= end; n++) {
      const k = n < end ? keyFn(n) : null
      if (k !== key) {
        const width = (n - start) * P
        out.push(`<div class="c ${cls(start, n)}" style="left:${xOf(start)}px;width:${width}px">${width > 18 ? labelFn(start, n) : ''}</div>`)
        start = n; key = k
      }
    }
  }
  const monthKey = (n) => { const d = dt(n); return d.getUTCFullYear() * 12 + d.getUTCMonth() }
  const monthLbl = (n) => { const d = dt(n); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
  if (state.zoom === 'day') {
    group(monthKey, monthLbl, r1)
    group((n) => n, (n) => `${WD[wday(n)]} ${dt(n).getUTCDate()}`, r2, (n) => (n === t0 ? 'today' : wday(n) % 6 === 0 ? 'we' : ''))
  } else if (state.zoom === 'week') {
    group(monthKey, monthLbl, r1)
    group((n) => Math.floor((n - state.origin) / 7), (n) => `S${isoWeek(n)}`, r2, (s, e) => (t0 >= s && t0 < e ? 'today' : ''))
  } else {
    group((n) => dt(n).getUTCFullYear(), (n) => dt(n).getUTCFullYear(), r1)
    group(monthKey, (n) => MONTHS[dt(n).getUTCMonth()], r2, (s, e) => (t0 >= s && t0 < e ? 'today' : ''))
  }
  $('#chead').style.width = w + 'px'
  $('#chead .r1').innerHTML = r1.join('')
  $('#chead .r2').innerHTML = r2.join('')
}

function scrollTo(n, center = false) {
  const chart = $('#chart')
  const x = xOf(n)
  chart.scrollLeft = center ? Math.max(0, x - chart.clientWidth / 3) : x
}

function ensureVisible(id) {
  const t = state.byId.get(id); if (!t) return
  const chart = $('#chart'), g = barGeom(t), i = state.rowOf.get(id)
  if (g.x1 < chart.scrollLeft || g.x1 > chart.scrollLeft + chart.clientWidth - 60) chart.scrollLeft = Math.max(0, g.x1 - 80)
  if (i != null) {
    const y = i * ROW, viewH = chart.clientHeight - 47
    if (y < chart.scrollTop) chart.scrollTop = y
    else if (y + ROW > chart.scrollTop + viewH) chart.scrollTop = y + ROW - viewH
  }
}

// ── Selection ─────────────────────────────────────────────────────────────────

function select(id, opts = {}) {
  state.sel = id; state.selDep = null
  $$('.grow').forEach((el) => el.classList.toggle('sel', Number(el.dataset.id) === id))
  $$('.rowbg').forEach((el, i) => el.classList.toggle('sel', state.rows[i]?.t.id === id))
  $$('.bar').forEach((el) => el.classList.toggle('sel', Number(el.dataset.id) === id))
  $$('#arrows g.sel').forEach((g) => g.classList.remove('sel'))
  hideDepPop()
  renderToolbar()
  if (opts.scroll) ensureVisible(id)
}

function toggleCollapse(id) {
  if (state.collapsed.has(id)) state.collapsed.delete(id); else state.collapsed.add(id)
  localSet('gp-collapsed-' + state.pid, JSON.stringify([...state.collapsed]))
  render()
}

// ── Grid events ───────────────────────────────────────────────────────────────

$('#gbody').addEventListener('click', (e) => {
  const tog = e.target.closest('[data-tog]')
  if (tog && tog.dataset.tog) { toggleCollapse(Number(tog.dataset.tog)); return }
  const row = e.target.closest('.grow')
  if (row) select(Number(row.dataset.id), { scroll: true })
})
$('#gbody').addEventListener('dblclick', (e) => {
  const row = e.target.closest('.grow')
  if (row && !e.target.closest('[data-tog]')) openTaskDialog(state.byId.get(Number(row.dataset.id)))
})
$('#grid').addEventListener('wheel', (e) => { $('#chart').scrollTop += e.deltaY; e.preventDefault() }, { passive: false })
$('#chart').addEventListener('scroll', () => { $('#gbody').scrollTop = $('#chart').scrollTop; hideTip(); hideDepPop() })

// ── Chart interactions ────────────────────────────────────────────────────────

let drag = null

$('#canvas').addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return
  const depG = e.target.closest('#arrows g[data-dep]')
  if (depG) { openDepPop(Number(depG.dataset.dep), e); return }
  const bar = e.target.closest('.bar')
  if (!bar) { hideDepPop(); return }
  const t = state.byId.get(Number(bar.dataset.id))
  hideTip()
  if (e.target.dataset.link) {
    const g = barGeom(t), i = state.rowOf.get(t.id)
    drag = { mode: 'link', t, x0: g.x2 + 1, y0: i * ROW + ROW / 2 }
  } else {
    const h = e.target.dataset.h
    const mode = h && !t.summary && !t.milestone ? (h === 'l' ? 'left' : 'right') : 'move'
    drag = { mode, t, bar, sx: e.clientX, s: toDay(t.start), e: toDay(t.end), ds: 0, de: 0, moved: false }
  }
  bar.setPointerCapture(e.pointerId)
  drag.pointerId = e.pointerId
  drag.el = bar
  e.preventDefault()
})

$('#canvas').addEventListener('pointermove', (e) => {
  if (!drag) { showTipFor(e); return }
  if (drag.mode === 'link') {
    const rect = $('#canvas').getBoundingClientRect()
    const x = e.clientX - rect.left, y = e.clientY - rect.top
    const tmp = $('#tmpLink'); tmp.classList.remove('hidden')
    tmp.setAttribute('d', `M${drag.x0},${drag.y0} L${x},${y}`)
    $$('.bar.drop').forEach((b) => b.classList.remove('drop'))
    const target = barAt(e.clientX, e.clientY)
    if (target && Number(target.dataset.id) !== drag.t.id) target.classList.add('drop')
    return
  }
  const delta = Math.round((e.clientX - drag.sx) / px())
  if (!drag.moved && Math.abs(e.clientX - drag.sx) < 3) return
  drag.moved = true
  let s = drag.s, en = drag.e
  if (drag.mode === 'move') { s += delta; en += delta }
  else if (drag.mode === 'left') s = Math.min(drag.s + delta, en)
  else en = Math.max(drag.e + delta, s)
  drag.ns = s; drag.ne = en
  const fake = { ...drag.t, start: fromDay(s), end: fromDay(en) }
  const g = barGeom(fake)
  drag.el.style.left = g.x1 + 'px'
  if (!drag.t.milestone) drag.el.style.width = Math.max(g.x2 - g.x1, 3) + 'px'
  showTip(e.clientX, e.clientY, `<b>${esc(drag.t.name)}</b>${fmtLong(fake.start)}${drag.t.milestone ? '' : ' → ' + fmtLong(fake.end)}<br><span>${drag.t.milestone ? 'Jalon' : dur(fake) + ' jour(s)'}</span>`)
})

function barAt(x, y) {
  const el = document.elementFromPoint(x, y)
  return el ? el.closest('.bar') : null
}

$('#canvas').addEventListener('pointerup', async (e) => {
  if (!drag) return
  const d = drag; drag = null
  try { d.el.releasePointerCapture(d.pointerId) } catch {}
  hideTip()
  if (d.mode === 'link') {
    $('#tmpLink')?.classList.add('hidden')
    $$('.bar.drop').forEach((b) => b.classList.remove('drop'))
    const target = barAt(e.clientX, e.clientY)
    const to = target ? Number(target.dataset.id) : null
    if (to && to !== d.t.id) {
      const v = await act('dep.add', { from_id: d.t.id, to_id: to }, 'Dépendance ajoutée')
      if (v) setView(v)
    }
    return
  }
  if (!d.moved) { select(d.t.id); return }
  if (d.ns === d.s && d.ne === d.e) { render(); return }
  d.t.start = fromDay(d.ns); d.t.end = fromDay(d.ne)
  const v = await act('task.shift', { id: d.t.id, start: d.t.start, end: d.t.end })
  if (v) { state.sel = d.t.id; setView(v) } else await openProject(state.pid)
})

const abortDrag = () => { if (drag) { drag = null; hideTip(); render() } }
$('#canvas').addEventListener('pointercancel', abortDrag)
$('#canvas').addEventListener('lostpointercapture', abortDrag)

$('#canvas').addEventListener('dblclick', (e) => {
  const bar = e.target.closest('.bar')
  if (bar) { openTaskDialog(state.byId.get(Number(bar.dataset.id))); return }
  if (e.target.closest('#arrows g')) return
  const rect = $('#canvas').getBoundingClientRect()
  const n = state.origin + Math.floor((e.clientX - rect.left) / px())
  openTaskDialog(null, { start: fromDay(n) })
})

$('#canvas').addEventListener('pointerleave', () => { if (!drag) hideTip() })

function showTip(x, y, html) {
  const tip = $('#tip'); tip.innerHTML = html; tip.classList.remove('hidden')
  const r = tip.getBoundingClientRect()
  tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px'
  tip.style.top = Math.min(y + 16, innerHeight - r.height - 8) + 'px'
}
function hideTip() { $('#tip').classList.add('hidden') }
function showTipFor(e) {
  const bar = e.target.closest('.bar')
  if (!bar || e.target.dataset.link) { hideTip(); return }
  const t = state.byId.get(Number(bar.dataset.id))
  const preds = state.view.deps.filter((d) => d.to_id === t.id).map((d) => state.byId.get(d.from_id)?.name).filter(Boolean)
  showTip(e.clientX, e.clientY, `<b>${esc(t.name)}</b>${t.milestone ? 'Jalon · ' + fmtLong(t.start)
    : `${fmtLong(t.start)} → ${fmtLong(t.end)}<br><span>${dur(t)} jour(s) · ${t.progress}% réalisé${t.summary ? ' (groupe)' : ''}</span>`}
    ${t.assignee ? `<br><span>Responsable :</span> ${esc(t.assignee)}` : ''}
    ${preds.length ? `<br><span>Après :</span> ${esc(preds.join(', '))}` : ''}
    ${isLate(t) ? '<br><span style="color:#fca5a5">En retard</span>' : ''}`)
}

// ── Dependency popover ────────────────────────────────────────────────────────

function openDepPop(id, e) {
  const d = state.view.deps.find((x) => x.id === id); if (!d) return
  state.selDep = id
  $$('#arrows g').forEach((g) => {
    const on = Number(g.dataset.dep) === id
    g.classList.toggle('sel', on)
    g.querySelector('path.d').setAttribute('marker-end', `url(#${on ? 'ahs' : 'ah'})`)
  })
  const a = state.byId.get(d.from_id), b = state.byId.get(d.to_id)
  const pop = $('#depPop')
  pop.innerHTML = `<div class="n"><b>${esc(a?.name)}</b> → <b>${esc(b?.name)}</b></div>
    <div class="r"><label class="muted">Décalage</label><input type="number" id="depLag" value="${d.lag}" min="-365" max="365"><span class="muted">jour(s)</span></div>
    <div class="r"><button class="primary" id="depSave">Appliquer</button><span class="spacer"></span><button class="danger" id="depDel">Supprimer</button></div>`
  pop.classList.remove('hidden')
  pop.style.left = Math.min(e.clientX + 8, innerWidth - 250) + 'px'
  pop.style.top = Math.min(e.clientY + 8, innerHeight - 130) + 'px'
  $('#depSave').onclick = async () => {
    const v = await act('dep.update', { id, lag: Number($('#depLag').value) || 0 })
    if (v) { hideDepPop(); setView(v) }
  }
  $('#depDel').onclick = () => deleteDep(id)
}
function hideDepPop() { $('#depPop').classList.add('hidden') }
async function deleteDep(id) {
  const v = await act('dep.delete', { id }, 'Dépendance supprimée')
  if (v) { state.selDep = null; hideDepPop(); setView(v) }
}

// ── Task dialog ───────────────────────────────────────────────────────────────

function dialog(html, cls = '') {
  const ov = document.createElement('div')
  ov.className = 'overlay'
  ov.innerHTML = `<div class="dialog ${cls}">${html}</div>`
  document.body.appendChild(ov)
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) ov.remove() })
  return ov
}

function parentOptions(task) {
  const banned = new Set()
  if (task) {
    const stack = [task.id]
    while (stack.length) { const id = stack.pop(); banned.add(id); (state.kids.get(id) || []).forEach((k) => stack.push(k.id)) }
  }
  return state.all.filter(({ t }) => !banned.has(t.id) && !t.milestone)
}

function openTaskDialog(task, defaults = {}) {
  const sel = state.byId.get(state.sel)
  const isNew = !task
  const t0 = todayN()
  const base = sel && isNew && !defaults.start ? toDay(sel.end) + 1 : defaults.start ? toDay(defaults.start) : t0
  const t = task ? { ...task } : {
    name: '', start: fromDay(base), end: fromDay(base + (defaults.milestone ? 0 : 4)), progress: 0,
    milestone: !!defaults.milestone, color: '', assignee: '', notes: '',
    parent_id: sel && !defaults.start ? (state.byId.has(sel.parent_id) ? sel.parent_id : null) : null,
  }
  const summary = !!task?.summary
  let color = t.color
  const preds = task ? state.view.deps.filter((d) => d.to_id === task.id) : []
  const ov = dialog(`
    <h3>${isNew ? (t.milestone ? 'Nouveau jalon' : 'Nouvelle tâche') : summary ? 'Groupe de tâches' : t.milestone ? 'Jalon' : 'Tâche'}</h3>
    <div class="content">
      <div class="field full"><label>Nom</label><input id="fName" maxlength="200" value="${esc(t.name)}" placeholder="Nom de la tâche"></div>
      <div class="field"><label>Début</label><input type="date" id="fStart" value="${t.start}" ${summary ? 'disabled' : ''}></div>
      <div class="field" id="endWrap"><label>Fin</label><input type="date" id="fEnd" value="${t.end}" ${summary ? 'disabled' : ''}></div>
      <div class="field" id="durWrap"><label>Durée (jours)</label><input type="number" id="fDur" min="1" max="3650" value="${dur(t)}" ${summary ? 'disabled' : ''}></div>
      <div class="field" id="progWrap"><label>Avancement : <span id="progVal">${t.progress}</span>%</label>
        <input type="range" id="fProg" min="0" max="100" step="5" value="${t.progress}" ${summary ? 'disabled' : ''}></div>
      ${summary ? '<div class="field full note">Les dates et l\'avancement d\'un groupe sont calculés à partir de ses sous-tâches.</div>' : ''}
      <div class="field row full"><input type="checkbox" id="fMs" ${t.milestone ? 'checked' : ''} ${summary ? 'disabled' : ''}><label for="fMs">Jalon (événement ponctuel, durée nulle)</label></div>
      <div class="field"><label>Responsable</label><input id="fWho" maxlength="100" value="${esc(t.assignee)}" list="whoList">
        <datalist id="whoList">${[...new Set(state.view.tasks.map((x) => x.assignee).filter(Boolean))].map((a) => `<option value="${esc(a)}">`).join('')}</datalist></div>
      <div class="field"><label>Groupe parent</label><select id="fParent"><option value="">— Aucun —</option>
        ${parentOptions(task).map(({ t: p, depth }) => `<option value="${p.id}" ${p.id === t.parent_id ? 'selected' : ''}>${'  '.repeat(depth)}${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field full"><label>Couleur</label><div class="swatches" id="fColors">
        <div class="sw none ${!color ? 'on' : ''}" data-c="" title="Couleur du projet"></div>
        ${COLORS.map((c) => `<div class="sw ${c === color ? 'on' : ''}" data-c="${c}" style="background:${c}"></div>`).join('')}</div></div>
      ${task ? `<div class="field full"><label>Prédécesseurs (cette tâche commence après…)</label><div class="deplist" id="fDeps">
        ${preds.map((d) => `<div class="dep"><span class="n">${esc(state.byId.get(d.from_id)?.name)}</span>
          <span class="muted">${d.lag ? (d.lag > 0 ? '+' : '') + d.lag + ' j' : ''}</span><button class="icon danger" data-deldep="${d.id}" title="Retirer">✕</button></div>`).join('')
          || '<span class="muted">Aucun. Astuce : glissez le rond au bout d\'une barre vers une autre tâche.</span>'}
        </div>
        <div class="dep" style="background:transparent;border-style:dashed"><select id="fAddDep" style="flex:1"><option value="">Ajouter un prédécesseur…</option>
          ${state.all.filter(({ t: p }) => p.id !== task.id && !preds.some((d) => d.from_id === p.id)).map(({ t: p, depth }) => `<option value="${p.id}">${'  '.repeat(depth)}${esc(p.name)}</option>`).join('')}
        </select></div></div>` : ''}
      <div class="field full"><label>Notes</label><textarea id="fNotes" maxlength="10000">${esc(t.notes)}</textarea></div>
    </div>
    <div class="foot">
      ${task ? '<button class="danger" id="fDelete">Supprimer</button>' : ''}
      <span class="spacer"></span>
      <button id="fCancel">Annuler</button>
      <button class="primary" id="fSave">${isNew ? 'Créer' : 'Enregistrer'}</button>
    </div>`)
  const q = (s) => $(s, ov)
  const syncMs = () => {
    const ms = q('#fMs').checked
    q('#endWrap').classList.toggle('hidden', ms); q('#durWrap').classList.toggle('hidden', ms); q('#progWrap').classList.toggle('hidden', ms)
  }
  syncMs()
  q('#fMs').onchange = syncMs
  q('#fProg').oninput = () => (q('#progVal').textContent = q('#fProg').value)
  q('#fStart').onchange = () => {
    const d = Math.max(1, Number(q('#fDur').value) || 1)
    if (q('#fStart').value) q('#fEnd').value = fromDay(toDay(q('#fStart').value) + d - 1)
  }
  q('#fEnd').onchange = () => {
    if (q('#fStart').value && q('#fEnd').value) q('#fDur').value = Math.max(1, toDay(q('#fEnd').value) - toDay(q('#fStart').value) + 1)
  }
  q('#fDur').oninput = () => {
    const d = Number(q('#fDur').value)
    if (d >= 1 && q('#fStart').value) q('#fEnd').value = fromDay(toDay(q('#fStart').value) + d - 1)
  }
  q('#fColors').onclick = (e) => {
    const sw = e.target.closest('.sw'); if (!sw) return
    color = sw.dataset.c
    $$('.sw', ov).forEach((x) => x.classList.toggle('on', x === sw))
  }
  q('#fCancel').onclick = () => ov.remove()
  if (task) {
    q('#fDelete').onclick = async () => { if (await deleteTask(task.id)) ov.remove() }
    q('#fDeps').onclick = async (e) => {
      const b = e.target.closest('[data-deldep]'); if (!b) return
      const v = await act('dep.delete', { id: Number(b.dataset.deldep) })
      if (v) { setView(v); ov.remove(); openTaskDialog(state.byId.get(task.id)) }
    }
    q('#fAddDep').onchange = async () => {
      const from = Number(q('#fAddDep').value); if (!from) return
      const v = await act('dep.add', { from_id: from, to_id: task.id })
      if (v) { setView(v); ov.remove(); openTaskDialog(state.byId.get(task.id)) }
      else q('#fAddDep').value = ''
    }
  }
  const save = async () => {
    const ms = q('#fMs').checked
    const payload = {
      name: q('#fName').value.trim(), start: q('#fStart').value, end: ms ? q('#fStart').value : q('#fEnd').value,
      progress: Number(q('#fProg').value), milestone: ms, color, assignee: q('#fWho').value.trim(),
      notes: q('#fNotes').value, parent_id: q('#fParent').value ? Number(q('#fParent').value) : null,
    }
    if (summary) { payload.start = task.start; payload.end = task.end; payload.progress = task.progress }
    if (!payload.name) { toast('Le nom est requis', true); q('#fName').focus(); return }
    const req = task ? { id: task.id, task: payload } : { project_id: state.pid, task: payload, after_id: payload.parent_id === (sel?.parent_id ?? null) && !defaults.start ? sel?.id : null }
    const before = new Set(state.view.tasks.map((x) => x.id))
    const v = await act('task.save', req)
    if (!v) return
    ov.remove()
    const created = v.tasks.find((x) => !before.has(x.id))
    if (payload.parent_id) state.collapsed.delete(payload.parent_id)
    state.sel = task ? task.id : created?.id ?? null
    setView(v)
    if (state.sel) ensureVisible(state.sel)
  }
  q('#fSave').onclick = save
  ov.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ov.remove()
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'SELECT') { e.preventDefault(); save() }
  })
  setTimeout(() => { q('#fName').focus(); q('#fName').select() }, 0)
}

async function deleteTask(id) {
  const t = state.byId.get(id); if (!t) return false
  const msg = t.summary ? `Supprimer le groupe « ${t.name} » et toutes ses sous-tâches ?` : `Supprimer « ${t.name} » ?`
  if (!confirm(msg)) return false
  const v = await act('task.delete', { id }, 'Tâche supprimée')
  if (!v) return false
  state.sel = null
  setView(v)
  return true
}

// ── Reordering / hierarchy ────────────────────────────────────────────────────

async function restructure(mutate) {
  const kids = new Map([...state.kids].map(([k, v]) => [k, [...v]]))
  const parents = {}
  if (mutate(kids, parents) === false) return
  const order = []
  const walk = (pid) => (kids.get(pid) || []).forEach((t) => { order.push(t.id); walk(t.id) })
  walk(null)
  const v = await act('task.reorder', { project_id: state.pid, order, parents })
  if (v) setView(v)
}

const parentKey = (t) => (state.byId.has(t.parent_id) ? t.parent_id : null)

function moveSel(dir) {
  const t = state.byId.get(state.sel); if (!t) return
  restructure((kids) => {
    const list = kids.get(parentKey(t)), i = list.indexOf(t), j = i + dir
    if (j < 0 || j >= list.length) return false
    list.splice(i, 1); list.splice(j, 0, t)
  })
}

function indentSel() {
  const t = state.byId.get(state.sel); if (!t) return
  restructure((kids, parents) => {
    const list = kids.get(parentKey(t)), i = list.indexOf(t)
    if (i <= 0 || list[i - 1].milestone) return false
    const np = list[i - 1]
    list.splice(i, 1)
    if (!kids.has(np.id)) kids.set(np.id, [])
    kids.get(np.id).push(t)
    parents[t.id] = np.id
    state.collapsed.delete(np.id)
  })
}

function outdentSel() {
  const t = state.byId.get(state.sel); if (!t) return
  const p = state.byId.get(t.parent_id); if (!p) return
  restructure((kids, parents) => {
    const list = kids.get(p.id)
    list.splice(list.indexOf(t), 1)
    const up = kids.get(parentKey(p))
    up.splice(up.indexOf(p) + 1, 0, t)
    parents[t.id] = parentKey(p)
  })
}

// ── Projects ──────────────────────────────────────────────────────────────────

function openProjectDialog(project) {
  let color = project?.color || COLORS[0]
  const ov = dialog(`
    <h3>${project ? 'Modifier le projet' : 'Nouveau projet'}</h3>
    <div class="content">
      <div class="field full"><label>Nom</label><input id="pName" maxlength="100" value="${esc(project?.name || '')}" placeholder="Nom du projet"></div>
      <div class="field full"><label>Couleur par défaut des tâches</label><div class="swatches" id="pColors">
        ${COLORS.map((c) => `<div class="sw ${c === color ? 'on' : ''}" data-c="${c}" style="background:${c}"></div>`).join('')}</div></div>
      <div class="field row full"><input type="checkbox" id="pAuto" ${project?.auto_schedule === false ? '' : 'checked'}>
        <label for="pAuto">Replanification automatique : décaler les tâches qui suivent quand une tâche dont elles dépendent est repoussée</label></div>
    </div>
    <div class="foot"><span class="spacer"></span><button id="pCancel">Annuler</button><button class="primary" id="pSave">${project ? 'Enregistrer' : 'Créer'}</button></div>`, 'small')
  const q = (s) => $(s, ov)
  q('#pColors').onclick = (e) => {
    const sw = e.target.closest('.sw'); if (!sw) return
    color = sw.dataset.c; $$('.sw', ov).forEach((x) => x.classList.toggle('on', x === sw))
  }
  q('#pCancel').onclick = () => ov.remove()
  const save = async () => {
    const name = q('#pName').value.trim()
    if (!name) { toast('Le nom est requis', true); return }
    const v = await act('project.save', { id: project?.id, project: { name, color, auto_schedule: q('#pAuto').checked } })
    if (!v) return
    ov.remove()
    if (!project) { state.collapsed = new Set(); state.sel = null; localSet('gp-project', v.project.id) }
    setView(v, !project)
  }
  q('#pSave').onclick = save
  ov.addEventListener('keydown', (e) => { if (e.key === 'Escape') ov.remove(); if (e.key === 'Enter') { e.preventDefault(); save() } })
  setTimeout(() => q('#pName').focus(), 0)
}

function download(name, content, type) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([content], { type }))
  a.download = name
  document.body.appendChild(a); a.click(); a.remove()
  setTimeout(() => URL.revokeObjectURL(a.href), 2000)
}
const safeName = (s) => s.replace(/[\\/:*?"<>|]+/g, '_').trim() || 'projet'

async function exportJson() {
  const data = await act('project.export', { id: state.pid })
  if (data) download(safeName(state.view.project.name) + '.gantt.json', JSON.stringify(data, null, 2), 'application/json')
}

function exportCsv() {
  const num = new Map(state.all.map(({ t }, i) => [t.id, i + 1]))
  const cell = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s }
  const lines = [['N°', 'Tâche', 'Niveau', 'Début', 'Fin', 'Durée (j)', 'Avancement (%)', 'Jalon', 'Responsable', 'Parent', 'Prédécesseurs', 'Notes']]
  for (const { t, depth } of state.all) {
    const preds = state.view.deps.filter((d) => d.to_id === t.id).map((d) => num.get(d.from_id) + (d.lag ? (d.lag > 0 ? '+' : '') + d.lag + 'j' : '')).join(',')
    lines.push([num.get(t.id), t.name, depth + 1, t.start, t.end, t.milestone ? 0 : dur(t), t.progress, t.milestone ? 'oui' : '',
      t.assignee, num.get(t.parent_id) ?? '', preds, t.notes])
  }
  download(safeName(state.view.project.name) + '.csv', '﻿' + lines.map((l) => l.map(cell).join(';')).join('\r\n'), 'text/csv')
}

async function importFile(file) {
  let data
  try { data = JSON.parse(await file.text()) } catch { toast('Fichier JSON invalide', true); return }
  const v = await act('project.import', { data }, 'Projet importé')
  if (v) { await refreshProjects(); state.collapsed = new Set(); state.sel = null; setView(v, true) }
}

async function refreshProjects() {
  const r = await act('projects.list'); if (r) state.projects = r.projects
}

async function seed() {
  const v = await act('project.seed', {}, 'Projet d\'exemple créé')
  if (v) { await refreshProjects(); state.collapsed = new Set(); state.sel = null; setView(v, true) }
}

async function deleteProject() {
  const p = state.view?.project; if (!p) return
  if (!confirm(`Supprimer le projet « ${p.name} » et toutes ses tâches ?`)) return
  if (!await act('project.delete', { id: p.id }, 'Projet supprimé')) return
  state.view = null; state.pid = null
  await loadProjects()
}

// ── Toolbar & keyboard ────────────────────────────────────────────────────────

$('#projectSel').onchange = (e) => openProject(Number(e.target.value))
$('#btnNewProject').onclick = () => openProjectDialog(null)
$('#emptyNew').onclick = () => openProjectDialog(null)
$('#emptySeed').onclick = seed
$('#emptyImport').onclick = () => $('#importFile').click()
$('#btnAddTask').onclick = () => openTaskDialog(null)
$('#btnAddMs').onclick = () => openTaskDialog(null, { milestone: true })
$('#btnUp').onclick = () => moveSel(-1)
$('#btnDown').onclick = () => moveSel(1)
$('#btnIn').onclick = indentSel
$('#btnOut').onclick = outdentSel
$('#btnDel').onclick = () => state.sel && deleteTask(state.sel)
$('#btnToday').onclick = () => scrollTo(todayN(), true)
$('#zoom').onclick = (e) => {
  const z = e.target.dataset.z; if (!z || z === state.zoom) return
  const chart = $('#chart')
  const center = state.origin + (chart.scrollLeft + chart.clientWidth / 2) / px()
  state.zoom = z; localSet('gp-zoom', z)
  render()
  chart.scrollLeft = Math.max(0, xOf(center) - chart.clientWidth / 2)
}
$('#btnMenu').onclick = (e) => { e.stopPropagation(); $('#menuList').classList.toggle('hidden') }
document.addEventListener('click', () => $('#menuList').classList.add('hidden'))
$('#menuList').onclick = async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return
  $('#menuList').classList.add('hidden')
  const a = b.dataset.act
  if (a === 'import') { $('#importFile').click(); return }
  if (a === 'seed') { seed(); return }
  if (!state.view) return
  if (a === 'edit-project') openProjectDialog(state.view.project)
  else if (a === 'auto') {
    const p = state.view.project
    const v = await act('project.save', { id: p.id, project: { name: p.name, color: p.color, auto_schedule: !p.auto_schedule } },
      'Replanification auto ' + (p.auto_schedule ? 'désactivée' : 'activée'))
    if (v) setView(v)
  } else if (a === 'expand') { state.collapsed.clear(); localSet('gp-collapsed-' + state.pid, '[]'); render() }
  else if (a === 'collapse') {
    state.collapsed = new Set(state.view.tasks.filter((t) => t.summary).map((t) => t.id))
    localSet('gp-collapsed-' + state.pid, JSON.stringify([...state.collapsed])); render()
  } else if (a === 'export-json') exportJson()
  else if (a === 'export-csv') exportCsv()
  else if (a === 'delete-project') deleteProject()
}
$('#importFile').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f) }

document.addEventListener('keydown', (e) => {
  if ($('.overlay') || !state.view) return
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return
  const t = state.byId.get(state.sel)
  if (e.key === 'Escape') { hideDepPop(); return }
  if (e.key === 'Delete') {
    if (state.selDep) deleteDep(state.selDep)
    else if (t) deleteTask(t.id)
    return
  }
  if (e.key === 'Insert') { openTaskDialog(null); return }
  if (e.key === 'Enter' && t) { openTaskDialog(t); return }
  if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); return }
  if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); return }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); indentSel(); return }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); outdentSel(); return }
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && state.rows.length) {
    e.preventDefault()
    const i = t ? state.rowOf.get(t.id) ?? -1 : -1
    const j = Math.max(0, Math.min(state.rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))
    select(state.rows[j].t.id, { scroll: true })
  }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && t?.summary) {
    const collapsed = state.collapsed.has(t.id)
    if ((e.key === 'ArrowLeft') !== collapsed) toggleCollapse(t.id)
  }
})

// ── Splitter ──────────────────────────────────────────────────────────────────

;(() => {
  const w = Number(localGet('gp-grid-w'))
  if (w >= 200) $('#grid').style.width = w + 'px'
  const split = $('#split')
  split.addEventListener('pointerdown', (e) => {
    split.setPointerCapture(e.pointerId); split.classList.add('drag')
    const x0 = e.clientX, w0 = $('#grid').offsetWidth
    const move = (ev) => { $('#grid').style.width = Math.max(200, Math.min(innerWidth - 200, w0 + ev.clientX - x0)) + 'px' }
    const up = () => {
      split.classList.remove('drag'); split.removeEventListener('pointermove', move); split.removeEventListener('pointerup', up)
      localSet('gp-grid-w', $('#grid').offsetWidth)
      if (state.view) render()
    }
    split.addEventListener('pointermove', move); split.addEventListener('pointerup', up)
  })
})()

let resizeTimer
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => state.view && render(), 120) })

loadProjects()
</script>
