[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledroide-sdk"
version = "0.1.0"
description = "SDK for LedroideDesktop modules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ledroide_sdk*"]
